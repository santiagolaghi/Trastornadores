<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Una sola historia</title><style>body{margin:0;background:#14110f;color:#f4ebdd;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.load{text-align:center}.load b{font:700 28px Georgia,serif}.load p{opacity:.65}</style></head><body><div class="load"><b>Una sola historia</b><p>Abriendo la historia…</p></div><script>(async()=>{try{const f=['bundle-1.txt', 'bundle-2.txt', 'bundle-3.txt', 'bundle-4.txt'];const parts=await Promise.all(f.map(x=>fetch('/'+x).then(r=>r.text())));const bin=atob(parts.join(''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(text);document.close()}catch(e){document.body.innerHTML='<div class="load"><b>No pudimos abrir la historia</b><p>Volvé a cargar esta página.</p></div>'}})()</script></body></html>

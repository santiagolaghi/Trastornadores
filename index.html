<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><meta name="apple-mobile-web-app-capable" content="yes"><title>TNT · Trastornadores</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon.svg"><link rel="stylesheet" href="/assets/tnt-ui.css?v=10"><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--tnt-bg);color:var(--tnt-text)}button,input{font:inherit}.hub{width:min(1040px,100%);margin:auto;padding:18px 16px 100px}.top{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,#ff6a35,#ff9b71);display:grid;place-items:center;font-weight:1000;color:#fff}.who{flex:1;min-width:0}.who small{display:block;color:var(--tnt-muted);font-size:9px;text-transform:uppercase;letter-spacing:.1em}.who h1{margin:2px 0 0;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--tnt-line);background:var(--tnt-panel);color:var(--tnt-text)}.hero{margin-top:20px}.hero h2{font-size:clamp(34px,8vw,58px);line-height:.94;letter-spacing:-.06em;margin:8px 0}.hero p{color:var(--tnt-muted);font-size:11px;line-height:1.6;max-width:650px}.search{margin-top:18px;background:var(--tnt-panel);border:1px solid var(--tnt-line);border-radius:17px;display:grid;grid-template-columns:1fr auto;padding:5px}.search input{height:44px;border:0;background:transparent;color:var(--tnt-text);padding:0 12px;outline:0}.search button{border:0;border-radius:12px;background:var(--tnt-panel2);color:var(--tnt-text);width:46px}.pulse{margin-top:17px;border:1px solid var(--tnt-line);border-radius:24px;background:linear-gradient(145deg,var(--tnt-panel),var(--tnt-panel2));padding:18px;position:relative;overflow:hidden}.pulse:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#7c6cff22;right:-70px;top:-90px}.pulse .ey{font-size:9px;color:#9d90ff;font-weight:900;letter-spacing:.14em}.pulse h3{font-size:20px;margin:6px 0 12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:relative;z-index:1}.metric{background:rgba(255,255,255,.05);border:1px solid var(--tnt-line);border-radius:14px;padding:10px}.metric b{display:block;font-size:20px}.metric span{font-size:7px;color:var(--tnt-muted);text-transform:uppercase}.section{display:flex;align-items:end;justify-content:space-between;margin:24px 2px 10px}.section h3{margin:0;font-size:17px}.section span{font-size:9px;color:var(--tnt-muted)}.attention{display:grid;gap:8px}.att{border:1px solid var(--tnt-line);background:var(--tnt-panel);border-radius:16px;padding:13px;display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center}.att .ai{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:#ff6a3518}.att b{font-size:11px}.att small{display:block;color:var(--tnt-muted);font-size:8px;margin-top:3px}.att em{font-style:normal;font-size:9px;color:var(--tnt-accent)}.modules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.module{position:relative;min-height:174px;border:1px solid var(--tnt-line);border-radius:25px;padding:16px;overflow:hidden;text-align:left;background:var(--tnt-panel);color:var(--tnt-text);box-shadow:0 12px 30px rgba(0,0,0,.08)}.module:before,.module:after{content:"";position:absolute;border-radius:22px;inset:12px -10px -12px 22px;background:var(--mc);opacity:.11;transform:rotate(3deg);z-index:0}.module:after{inset:22px -18px -20px 36px;opacity:.07;transform:rotate(6deg)}.module>*{position:relative;z-index:1}.module .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:var(--mc)}.module h4{font-size:16px;margin:17px 0 4px}.module p{font-size:8px;color:var(--tnt-muted);line-height:1.45;margin:0}.module .arrow{position:absolute;right:14px;bottom:14px;width:34px;height:34px;border-radius:11px;background:var(--tnt-text);color:var(--tnt-bg);display:grid;place-items:center}.module .badge{position:absolute;right:14px;top:14px;font-size:7px;padding:5px 7px;border-radius:999px;background:var(--mc);color:#fff}.today{display:grid;gap:8px}.todayitem{border-left:4px solid var(--c,#7c6cff);background:var(--tnt-panel);border-radius:16px;padding:12px 13px}.todayitem b{font-size:11px}.todayitem small{display:block;color:var(--tnt-muted);font-size:8px;margin-top:3px}.login{min-height:100svh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 80% 10%,#ff6a352c,transparent 28rem),radial-gradient(circle at 10% 90%,#7c6cff25,transparent 28rem),var(--tnt-bg)}.loginCard{width:min(430px,100%);background:var(--tnt-panel);border:1px solid var(--tnt-line);border-radius:28px;padding:24px;box-shadow:var(--tnt-shadow)}.loginCard .logo{width:60px;height:60px}.loginCard h1{font-size:38px;line-height:.95;letter-spacing:-.055em;margin:22px 0 10px}.loginCard p{font-size:11px;color:var(--tnt-muted);line-height:1.55}.google{width:100%;height:52px;border:0;border-radius:14px;background:#fff;color:#111;font-weight:900;margin-top:12px}.loginCard input{width:100%;height:48px;border-radius:13px;border:1px solid var(--tnt-line);background:var(--tnt-panel2);color:var(--tnt-text);padding:0 12px;margin-top:10px;outline:0}.magic{width:100%;height:46px;border:1px solid var(--tnt-line);border-radius:13px;background:var(--tnt-panel2);color:var(--tnt-text);font-weight:850;margin-top:8px}.msg{font-size:9px;color:var(--tnt-warn);margin-top:9px;min-height:14px}.results{position:fixed;inset:0;z-index:200;background:var(--tnt-bg);padding:18px;overflow:auto}.results .back{border:1px solid var(--tnt-line);background:var(--tnt-panel);color:var(--tnt-text);border-radius:12px;height:40px;padding:0 12px}.reslist{display:grid;gap:8px;margin-top:16px}.res{border:1px solid var(--tnt-line);background:var(--tnt-panel);border-radius:15px;padding:12px;text-align:left;color:var(--tnt-text)}.res b{font-size:11px}.res small{display:block;color:var(--tnt-muted);font-size:8px;margin-top:3px}
@media(min-width:760px){.hub{padding-top:28px}.modules{grid-template-columns:repeat(3,1fr)}.pulse{padding:22px}}@media(max-width:520px){.metrics{grid-template-columns:repeat(2,1fr)}.module{min-height:158px;padding:14px}.module h4{font-size:14px}}
</style></head><body data-tnt-shell="off"><div id="app"></div><script>
window.TNT_CACHE_RESET=(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>/^tnt-|lista-sabados|efe/i.test(k)).map(k=>caches.delete(k)));
    }
  }catch(e){console.warn('TNT cache reset',e)}
})();
</script><script src="/supabase-lite.js?v=12"></script><script src="/assets/tnt-core.js?v=10" data-public="true" data-shell="off"></script><script>
const app=document.getElementById('app'),sb=TNT.sb;let identity=null,person=null,account=null,events=[],tasks=[],notifications=[],assignees=[],schedule=[],people=[],accounts=[],grants=[];
const MODULES=[
{id:'organizacion',name:'Organización',icon:'◫',desc:'Calendario, tareas, eventos, equipos y responsabilidades.',url:'/organizacion/?v=13',color:'#7c6cff',scope:'*'},
{id:'campamento',name:'Campamento',icon:'△',desc:'Inscripciones, pagos, habitaciones y logística.',url:'/campamento/?v=13',color:'#62c6b3',scope:'*'},
{id:'glosario',name:'Prédicas & Glosario',icon:'▤',desc:'Biblioteca, prédicas y recursos bíblicos.',url:'/glosario/?v=13',color:'#d5a85b',scope:'*'},
{id:'lista-sabados',name:'Lista Sábados',icon:'✓',desc:'Asistencia, historial y seguimiento.',url:'/lista-sabados/?v=13',color:'#83bf70',scope:'*'},
{id:'efe',name:'EFE',icon:'◎',desc:'Equipos, asistencia y acompañamiento.',url:'/efe/?v=13',color:'#ff6a35',scope:'*'},
{id:'buffet',name:'Buffet',icon:'◇',desc:'Caja, ventas, pedidos y stock.',url:'/buffet/?v=13',color:'#f0b94f',scope:'*'},
{id:'chat',name:'Chat TNT',icon:'◌',desc:'Conversaciones por actividad, evento y equipo.',url:'/chat/?v=13',color:'#6db6ff',scope:'*'}];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function avatar(){const a=account?.avatar_url||identity?.avatar_url,n=identity?.display_name||'TNT';return a?`<img class="tnt-avatar" src="${esc(a)}">`:`<span class="tnt-avatar fallback">${esc(n.slice(0,1).toUpperCase())}</span>`}
function canModule(m){return account?.system_role==='admin'||m==='chat'||TNT.hasAccess(m,'*','view')||(TNT.grants||[]).some(g=>g.module===m&&g.enabled&&(!g.valid_from||Date.parse(g.valid_from)<=Date.now())&&(!g.valid_until||Date.parse(g.valid_until)>=Date.now()))}
function login(msg=''){app.innerHTML=`<main class="login"><section class="loginCard"><div class="logo">T</div><div style="font-size:9px;color:var(--tnt-accent);font-weight:900;letter-spacing:.16em;margin-top:18px">CUENTA TNT</div><h1>Una cuenta.<br>Todo TNT.</h1><p>Entrá una sola vez. Tu identidad, rol y permisos se mantienen en Organización, EFE, Lista Sábados, Campamento, Buffet y Glosario.</p><button class="google" id="google">Continuar con Google</button><input id="email" type="email" placeholder="tu@email.com"><button class="magic" id="magic">Enviar enlace por email</button><div class="msg" id="msg">${esc(msg)}</div></section></main>`;document.getElementById('google').onclick=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/?v=13'}});document.getElementById('magic').onclick=async()=>{const email=document.getElementById('email').value.trim();if(!email)return document.getElementById('msg').textContent='Escribí tu email.';const r=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+'/?v=13'}});document.getElementById('msg').textContent=r.error?r.error.message:'Te enviamos un enlace de acceso.'}}
async function load(){await window.TNT_CACHE_RESET;await TNT.ready;if(!TNT.identity)return login();identity=TNT.identity;person=TNT.person;account=TNT.account;grants=TNT.grants||[];const [ev,ta,no,as,sc,pp,aa]=await Promise.all([sb.from('tnt_events').select('*').order('start_date'),sb.from('tnt_tasks').select('*').order('due_at'),sb.from('tnt_notifications').select('*').order('created_at',{ascending:false}).limit(30),sb.from('tnt_task_assignees').select('*'),sb.from('tnt_schedule_items').select('*').order('starts_at'),sb.from('tnt_people').select('*'),sb.from('tnt_accounts').select('*')]);events=ev.data||[];tasks=ta.data||[];notifications=no.data||[];assignees=as.data||[];schedule=sc.data||[];people=pp.data||[];accounts=aa.data||[];render()}
function myTasks(){const ids=new Set(assignees.filter(x=>x.person_id===person.id).map(x=>x.task_id));return tasks.filter(x=>ids.has(x.id)&&!['done','completed','cancelled'].includes(x.status))}
function upcoming(){const now=new Date().toISOString().slice(0,10);return events.filter(x=>x.end_date>=now).slice(0,4)}
function unread(){return notifications.filter(x=>(!x.person_id||x.person_id===person.id)&&!x.read_at)}
function attention(){const out=[];for(const t of myTasks().slice(0,3)){out.push({ico:'✓',title:t.title,sub:t.status==='unread'?'Necesita tu confirmación':'Tarea activa · '+(t.status||'pendiente'),href:'/organizacion/?task='+t.id})}for(const n of unread().slice(0,3)){out.push({ico:'!',title:n.title,sub:n.body||'Notificación TNT',href:n.href||'/organizacion/'})}return out.slice(0,5)}
function todayItems(){const d=new Date().toISOString().slice(0,10),ev=events.filter(x=>x.start_date<=d&&x.end_date>=d);return ev.map(x=>({title:x.name,sub:(x.location||'')+' · '+(x.status||'planificación'),color:x.color||'#7c6cff'})).slice(0,5)}
function render(){const mine=myTasks(),up=upcoming(),un=unread(),atts=attention(),today=todayItems(),mods=MODULES.filter(m=>canModule(m.id));app.innerHTML=`<main class="hub"><header class="top"><div class="logo">T</div><div class="who"><small>${account.system_role==='admin'?'Administrador · ':''}${esc(account.ministry_role||'Usuario TNT')}</small><h1>Hola, ${esc(identity.display_name)} 👋</h1></div><button class="iconbtn" id="theme">◐</button><button class="iconbtn" id="me">${avatar()}</button></header><section class="hero"><div style="font-size:9px;font-weight:900;color:var(--tnt-accent);letter-spacing:.15em">MINISTERIO TNT</div><h2>Todo lo que<br>necesitás, acá.</h2><p>Tu cuenta sabe quién sos, qué responsabilidades tenés y qué partes de TNT podés usar.</p><form class="search" id="search"><input id="q" placeholder="Buscar personas, eventos, tareas…"><button>⌕</button></form></section><section class="pulse"><div class="ey">TNT PULSE · ESTA SEMANA</div><h3>${up.length} actividades próximas · ${mine.length} tareas tuyas</h3><div class="metrics"><div class="metric"><b>${mine.length}</b><span>Mis tareas</span></div><div class="metric"><b>${un.length}</b><span>Sin leer</span></div><div class="metric"><b>${up.length}</b><span>Próximos</span></div><div class="metric"><b>${grants.filter(x=>x.enabled).length}</b><span>Accesos</span></div></div></section>${atts.length?`<div class="section"><h3>Necesita tu atención</h3><span>${atts.length} pendientes</span></div><div class="attention">${atts.map(x=>`<button class="att" data-href="${esc(x.href)}"><span class="ai">${x.ico}</span><span><b>${esc(x.title)}</b><small>${esc(x.sub)}</small></span><em>›</em></button>`).join('')}</div>`:''}<div class="section"><h3>Mis espacios</h3><span>${mods.length} disponibles</span></div><div class="modules">${mods.map((m,i)=>`<button class="module" data-href="${m.url}" style="--mc:${m.color}"><span class="ico">${m.icon}</span>${i<2?'<span class="badge">ACTIVO</span>':''}<h4>${m.name}</h4><p>${m.desc}</p><span class="arrow">↗</span></button>`).join('')}${account.system_role==='admin'?`<button class="module" data-href="/admin/" style="--mc:#ff6a35"><span class="ico">⚙</span><span class="badge">ADMIN</span><h4>Administración</h4><p>Usuarios, roles, accesos, solicitudes, seguridad y auditoría.</p><span class="arrow">↗</span></button>`:''}</div><div class="section"><h3>Hoy en TNT</h3><span>${today.length?'en movimiento':'sin agenda'}</span></div><div class="today">${today.length?today.map(x=>`<div class="todayitem" style="--c:${x.color}"><b>${esc(x.title)}</b><small>${esc(x.sub)}</small></div>`).join(''):'<div class="todayitem"><b>No hay eventos cargados para hoy</b><small>Cuando haya actividad, va a aparecer automáticamente acá.</small></div>'}</div></main>`;document.querySelectorAll('[data-href]').forEach(b=>b.onclick=()=>location.href=b.dataset.href);document.getElementById('theme').onclick=()=>{TNT.toggleTheme();render()};document.getElementById('me').onclick=()=>TNT.sheet('Mi Cuenta TNT',`<div class="tnt-profile-head">${avatar()}<div><b>${esc(identity.display_name)}</b><small>${esc(identity.email)}</small><small>${esc(account.ministry_role)} · ${account.system_role==='admin'?'Administrador':'Usuario'}</small></div></div><div class="tnt-menu-actions"><button onclick="location.href='/chat/'">Chat TNT</button>${account.system_role==='admin'?'<button onclick="location.href=\'/admin/\'">Administración</button>':''}<button class="wide danger" id="logout2">Cerrar sesión</button></div>`);document.getElementById('search').onsubmit=e=>{e.preventDefault();search(document.getElementById('q').value)}}
function search(q){q=String(q||'').trim().toLowerCase();if(!q)return;const rows=[];for(const p of people)if((p.full_name||'').toLowerCase().includes(q))rows.push({t:p.full_name,s:'Persona TNT',h:'/admin/?person='+p.id});for(const e of events)if((e.name||'').toLowerCase().includes(q))rows.push({t:e.name,s:'Evento · '+e.start_date,h:'/organizacion/?event='+e.id});for(const t of tasks)if((t.title||'').toLowerCase().includes(q))rows.push({t:t.title,s:'Tarea · '+(t.status||''),h:'/organizacion/?task='+t.id});const d=document.createElement('div');d.className='results';d.innerHTML=`<button class="back">← Volver</button><h2>Resultados para “${esc(q)}”</h2><div class="reslist">${rows.length?rows.slice(0,40).map(x=>`<button class="res" data-href="${x.h}"><b>${esc(x.t)}</b><small>${esc(x.s)}</small></button>`).join(''):'<div class="res"><b>No encontré resultados.</b><small>Probá con otro nombre o palabra.</small></div>'}</div>`;document.body.appendChild(d);d.querySelector('.back').onclick=()=>d.remove();d.querySelectorAll('[data-href]').forEach(b=>b.onclick=()=>location.href=b.dataset.href)}
document.addEventListener('click',e=>{if(e.target?.id==='logout2')TNT.logout()});document.addEventListener('tnt:ready',load,{once:true});setTimeout(()=>{if(window.TNT&&TNT.identity&&!identity)load();else if(window.TNT&&!TNT.identity)login()},300);
</script></body></html>

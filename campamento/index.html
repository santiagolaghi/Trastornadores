</style>

function similarity(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;let d=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prev=d[0];d[0]=i;for(let j=1;j<=b.length;j++){let cur=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=cur}}return 1-d[b.length]/Math.max(a.length,b.length)}
function score(a,b){let s=0,r=[],hard=false;let ad=digits(a.Dni),bd=digits(b.Dni);if(ad.length>=7&&bd.length>=7){if(ad===bd){s+=72;r.push("DNI exacto")}else{hard=true;s-=90;r.push("DNI distinto")}}if(a.Email&&b.Email&&norm(a.Email)===norm(b.Email)){s+=45;r.push("Email exacto")}if(a.Telefono&&b.Telefono&&digits(a.Telefono)===digits(b.Telefono)){s+=40;r.push("Teléfono exacto")}if(a.FechaNacimiento&&b.FechaNacimiento){if(a.FechaNacimiento===b.FechaNacimiento){s+=36;r.push("Nacimiento exacto")}else s-=35}let n=similarity(full(a),full(b));s+=Math.round(n*30);if(n>.8)r.push("Nombre "+Math.round(n*100)+"% parecido");if(hard)s=Math.min(s,55);return{Score:Math.max(0,Math.min(100,s)),Reasons:r,Hard:hard}}
const aliases={Nombre:["nombre","nombres"],Apellido:["apellido","apellidos"],Dni:["dni","documento","numero documento","nro documento"],FechaNacimiento:["fecha nacimiento","fecha de nacimiento","nacimiento"],Email:["email","correo","mail","correo electronico"],Telefono:["telefono","celular","whatsapp","tel"],Congregacion:["congregacion","iglesia"]};
function canon(raw){let o={};for(const[h,v]of Object.entries(raw)){let k=Object.keys(aliases).find(k=>aliases[k].some(a=>norm(a)===norm(h)));if(k)o[k]=v}o.Nombre=titleCase(o.Nombre);o.Apellido=titleCase(o.Apellido);o.Dni=digits(o.Dni);o.Email=String(o.Email||"").trim().toLowerCase();o.Telefono=digits(o.Telefono);let m=String(o.FechaNacimiento||"").match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(m)o.FechaNacimiento=m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");return o}
function analyze(rows){let R={Auto:[],Review:[],New:[]};rows.forEach(raw=>{const x=canon(raw);if(!x.Nombre&&!x.Dni&&!x.Email)return;let best=null;State.People.forEach(p=>{let q=score(x,p);if(!best||q.Score>best.Score)best={Match:p,...q}});if(best&&best.Score>=85&&!best.Hard)R.Auto.push({Incoming:x,...best});else if(best&&best.Score>=65)R.Review.push({Incoming:x,...best});else R.New.push({Incoming:x,Closest:best})});return R}

function activateCamp(id){State.Camps.forEach(c=>c.Activo=c.Id===id);save();buildCampSelect();toast("Edición activa actualizada");render("Campamentos")}
function duplicateCamp(id){const c=State.Camps.find(x=>x.Id===id);State.Camps.push({...c,Id:"C"+Date.now(),Nombre:c.Nombre+" copia",Activo:false});save();buildCampSelect();toast("Edición duplicada");render("Campamentos")}
function formPage(){return '<div class="hero"><span class="badge bV">'+State.FormFields.length+' campos</span><h2>El formulario se arma sin tocar código.</h2><p>Campos, obligatoriedad, orden y visibilidad. La edad se calcula automáticamente desde la fecha de nacimiento.</p><button class="btn primary" onclick="addField()">+ Agregar campo</button></div>'+section("Campos","Podés moverlos, activarlos o volverlos obligatorios.")+'<div class="list">'+State.FormFields.map((f,i)=>'<div class="personCard"><div class="avatar">'+(i+1)+'</div><div><b>'+f.Nombre+'</b><div class="small">'+f.Tipo+(f.Nombre==="Fecha de nacimiento"?" · calcula edad":"")+'</div><div class="meta"><span class="badge '+(f.Required?"bV":"bS")+'">'+(f.Required?"Obligatorio":"Opcional")+'</span><span class="badge '+(f.Active?"bG":"bR")+'">'+(f.Active?"Visible":"Oculto")+'</span></div></div><div class="cardActions"><button class="btn icon" onclick="moveField('+i+',-1)">↑</button><button class="btn icon" onclick="moveField('+i+',1)">↓</button><button class="btn soft" onclick="toggleField(\''+f.Id+'\',\'Required\')">Oblig.</button><button class="btn" onclick="toggleField(\''+f.Id+'\',\'Active\')">Visible</button></div></div>').join("")+'</div>'}
function addField(){openModal("Agregar campo","Elegí un nombre y un tipo.",'<div class="formGrid" style="margin-top:16px"><div class="field"><label>Nombre</label><input id="afName" class="input" placeholder="Ej. Pedido de oración"></div><div class="field"><label>Tipo</label><div class="segment" id="typeSeg">'+["Texto corto","Texto largo","Sí / No","Opción múltiple"].map((x,i)=>'<button data-type="'+x+'" class="'+(!i?"on":"")+'">'+x+'</button>').join("")+'</div></div></div><div class="modalActions"><button class="btn primary" onclick="commitField()">Agregar</button></div>');window.newFieldType="Texto corto";$$("[data-type]").forEach(b=>b.onclick=()=>{$$("[data-type]").forEach(x=>x.classList.remove("on"));b.classList.add("on");window.newFieldType=b.dataset.type})}
function commitField(){State.FormFields.push({Id:"F"+Date.now(),Nombre:$("#afName").value||"Nuevo campo",Tipo:window.newFieldType||"Texto corto",Required:false,Active:true});save();closeModal();toast("Campo agregado");render("Formulario")}
function moveField(i,d){let j=i+d;if(j<0||j>=State.FormFields.length)return;[State.FormFields[i],State.FormFields[j]]=[State.FormFields[j],State.FormFields[i]];save();render("Formulario")}
function toggleField(id,k){let f=State.FormFields.find(x=>x.Id===id);f[k]=!f[k];save();render("Formulario")}
function paymentsPage(){const total=State.Enroll.reduce((a,x)=>a+x.Total,0),paid=State.Enroll.reduce((a,x)=>a+x.Pago,0);return '<div class="grid g3 statsMobile">'+kpi("$","Cobrado","$"+paid.toLocaleString("es-AR"),Math.round(paid/total*100)+"%","peachBg")+kpi("◌","Pendiente","$"+(total-paid).toLocaleString("es-AR"),"saldo total","lav")+kpi("✓","Pagos",State.Payments.length,"movimientos registrados","mintBg")+'</div>'+section("Últimos pagos","Tarjetas simples, sin tabla horizontal.",'<button class="btn primary" onclick="newPayment()">Registrar pago</button>')+'<div class="list">'+State.Payments.map(x=>{const p=person(x.PersonaId);return '<div class="paymentCard"><div class="avatar">$</div><div><b>'+full(p)+'</b><div class="small">'+x.Fecha+' · '+x.Metodo+'</div></div><div class="cardActions"><span class="badge bG">$'+x.Monto.toLocaleString("es-AR")+'</span></div></div>'}).join("")+'</div>'}
function newPayment(){openModal("Registrar pago","Se suma automáticamente al saldo de la inscripción.",'<div class="formGrid" style="margin-top:16px"><div class="field"><label>DNI</label><input id="payDni" class="input" inputmode="numeric" placeholder="Documento"></div><div class="field"><label>Monto</label><input id="payAmount" class="input" inputmode="numeric" placeholder="35000"></div><div class="field"><label>Fecha</label><input id="payDate" class="input" value="'+today()+'"></div><div class="field"><label>Método</label><div id="payMethod" class="segment">'+["Transferencia","Efectivo"].map((x,i)=>'<button data-pm="'+x+'" class="'+(!i?"on":"")+'">'+x+'</button>').join("")+'</div></div></div><div class="modalActions"><button class="btn primary" onclick="commitPayment()">Guardar pago</button></div>');window.payMethod="Transferencia";$$("[data-pm]").forEach(b=>b.onclick=()=>{$$("[data-pm]").forEach(x=>x.classList.remove("on"));b.classList.add("on");window.payMethod=b.dataset.pm})}
function commitPayment(){let p=State.People.find(x=>digits(x.Dni)===digits($("#payDni").value));if(!p){toast("No encontré ese DNI");return}let m=Number(digits($("#payAmount").value));State.Payments.unshift({Id:"PAY"+Date.now(),PersonaId:p.Id,Monto:m,Fecha:$("#payDate").value,Metodo:window.payMethod});let e=State.Enroll.find(x=>x.PersonaId===p.Id);if(e)e.Pago=Math.min(e.Total,e.Pago+m);save();closeModal();toast("Pago registrado");render("Pagos")}
function healthPage(){return '<div class="hero"><span class="badge bR">Acceso sensible</span><h2>Salud clara para quien realmente la necesita.</h2><p>Alergias, medicación y restricciones en tarjetas legibles.</p></div>'+section("Alertas","Personas con datos médicos relevantes.")+'<div class="list">'+State.People.filter(p=>p.Alergias&&p.Alergias!=="Ninguna"||p.Medicacion&&p.Medicacion!=="No").map(p=>'<div class="healthCard"><div class="avatar" style="background:var(--roseSoft);color:#b65f71">♡</div><div><b>'+full(p)+'</b><div class="meta"><span class="badge bR">Alergia: '+(p.Alergias||"Sin dato")+'</span><span class="badge bA">Medicación: '+(p.Medicacion||"Sin dato")+'</span></div></div><div class="cardActions"><button class="btn soft" onclick="personDetail(\''+p.Id+'\')">Ver contacto</button></div></div>').join("")+'</div>'}
function assignmentPage(type){
 const map={Habitaciones:{items:State.Rooms,key:"Habitacion"},Transporte:{items:State.Buses,key:"Transporte"},Equipos:{items:State.Teams,key:"Equipo"}},m=map[type];
 return '<div class="hero"><span class="badge bS">'+m.items.length+' opciones</span><h2>'+type+' sin planillas eternas.</h2><p>Distribución visual por tarjetas y ajuste manual cuando haga falta.</p><button class="btn primary" onclick="autoAssign(\''+type+'\')">Distribuir automáticamente</button></div>'+section("Distribución actual","Cada tarjeta muestra cupo y personas.")+'<div class="'+(type==="Habitaciones"?"roomGrid":type==="Transporte"?"transportGrid":"teamGrid")+'">'+m.items.map(item=>{let asg=State.Enroll.filter(e=>e[m.key]===item.Nombre);return '<div class="card"><div class="row between"><div><b>'+item.Nombre+'</b><div class="small">'+asg.length+' de '+item.Cupo+'</div></div><span class="badge '+(asg.length>=item.Cupo?"bR":"bG")+'">'+Math.round(asg.length/item.Cupo*100)+'%</span></div><div class="progress" style="margin-top:10px"><i style="width:'+Math.min(100,Math.round(asg.length/item.Cupo*100))+'%"></i></div><div class="slotList">'+asg.map(e=>'<div class="chip"><span>'+full(person(e.PersonaId))+'</span><button class="x" style="width:26px;height:26px" onclick="unassign(\''+e.Id+'\',\''+m.key+'\')">×</button></div>').join("")+'</div></div>'}).join("")+'</div>'}
function autoAssign(type){const map={Habitaciones:{items:State.Rooms,key:"Habitacion"},Transporte:{items:State.Buses,key:"Transporte"},Equipos:{items:State.Teams,key:"Equipo"}},m=map[type];State.Enroll.forEach((e,i)=>e[m.key]=m.items[i%m.items.length].Nombre);save();toast("Distribución actualizada");render(type)}
function unassign(id,key){State.Enroll.find(x=>x.Id===id)[key]="Sin asignar";save();render(key==="Habitacion"?"Habitaciones":key==="Transporte"?"Transporte":"Equipos")}
function checkinPage(){return '<div class="hero"><span class="badge bG">'+State.Checkins.length+' llegaron</span><h2>Check-in rápido y grande.</h2><p>Escribí nombre o DNI y confirmá. Nada más.</p><input id="checkSearch" class="input" style="max-width:480px" placeholder="Nombre o DNI..."><div id="checkResult" style="margin-top:12px"></div></div>'+section("Llegadas","Se actualiza en el momento.")+'<div class="grid g3">'+State.Checkins.map(x=>'<div class="card"><span class="badge bG">Llegó</span><h3 style="margin:10px 0 2px">'+full(person(x.PersonaId))+'</h3><div class="small">'+x.Hora+'</div></div>').join("")+'</div>'}
function bindCheckin(){let q=$("#checkSearch"),r=$("#checkResult");q.oninput=()=>{let v=norm(q.value);if(v.length<2){r.innerHTML="";return}let p=State.People.find(x=>norm(full(x)).includes(v)||digits(x.Dni).includes(digits(q.value)));r.innerHTML=p?'<div class="personCard"><div class="avatar">'+p.Nombre[0]+p.Apellido[0]+'</div><div><b>'+full(p)+'</b><div class="small">DNI '+p.Dni+'</div></div><div class="cardActions"><button class="btn primary" onclick="doCheckin(\''+p.Id+'\')">Confirmar llegada</button></div></div>':'<div class="notice">No encontramos coincidencias.</div>'}}
function doCheckin(id){if(!State.Checkins.some(x=>x.PersonaId===id))State.Checkins.unshift({PersonaId:id,Hora:new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})});save();toast("Llegada confirmada");render("Check-in")}
function commsPage(){return '<div class="hero"><span class="badge bP">Plantillas</span><h2>Mensajes listos para cada momento.</h2><p>Editá el texto una vez y reutilizalo para inscripciones, pagos y recordatorios.</p></div>'+section("Plantillas","Podés editar y probar el contenido.")+'<div class="grid g3">'+Object.entries(State.Templates).map(([k,v])=>'<div class="card"><div class="kpiIcon peachBg">✉</div><b>'+k+'</b><p class="small">'+v+'</p><button class="btn soft" onclick="editTemplate(\''+k+'\')">Editar</button></div>').join("")+'</div>'}
function editTemplate(k){openModal("Editar "+k,"Usá {Nombre} y {Campamento} como variables.",'<textarea id="tplText" class="input" style="margin-top:16px">'+State.Templates[k]+'</textarea><div class="modalActions"><button class="btn primary" onclick="commitTemplate(\''+k+'\')">Guardar</button></div>')}
function commitTemplate(k){State.Templates[k]=$("#tplText").value;save();closeModal();toast("Plantilla guardada");render("Comunicaciones")}
function myPage(){return '<div class="hero" style="max-width:680px;margin:auto"><span class="badge bV">Acceso privado</span><h2>Mi ficha</h2><p>Ingresá tu DNI y la palabra clave enviada por email.</p><div class="formGrid"><div class="field"><label>DNI</label><input id="mfDni" class="input" inputmode="numeric" placeholder="Tu DNI"></div><div class="field"><label>Palabra clave</label><input id="mfKey" class="input" type="password" placeholder="••••••••"></div></div><button class="btn primary" style="margin-top:14px" onclick="openMyFicha()">Ver mi ficha</button><div class="notice" style="margin-top:14px">Demo: DNI 40111222 · palabra clave Luz482Monte</div></div><div id="myResult" style="max-width:680px;margin:14px auto 0"></div>'}
function openMyFicha(){let p=State.People.find(x=>digits(x.Dni)===digits($("#mfDni").value)&&x.Clave===$("#mfKey").value);if(!p){toast("Datos incorrectos");return}let e=State.Enroll.find(x=>x.PersonaId===p.Id);$("#myResult").innerHTML='<div class="card"><div class="row"><div class="avatar">'+p.Nombre[0]+p.Apellido[0]+'</div><div><b>'+full(p)+'</b><div class="small">'+p.Email+'</div></div></div>'+section("Mi campamento","Estado actual")+'<div class="compactStats"><div class="compactStat"><b>'+e.Estado+'</b><span>Inscripción</span></div><div class="compactStat"><b>$'+(e.Total-e.Pago).toLocaleString("es-AR")+'</b><span>Saldo</span></div><div class="compactStat"><b>'+e.Equipo+'</b><span>Equipo</span></div></div></div>'}
function settingsPage(){return '<div class="hero"><span class="badge bV">Personalizable</span><h2>La app se adapta al campamento.</h2><p>Activá módulos y elegí una identidad visual sin tocar código.</p></div>'+section("Módulos","Mostrá solo lo que realmente usan.")+'<div class="grid g2">'+Object.entries(State.Modules).map(([k,v])=>'<div class="card row between"><div><b>'+k+'</b><div class="small">Disponible para roles autorizados</div></div><div class="toggle '+(v?"on":"")+'" onclick="toggleModule(\''+k+'\')"></div></div>').join("")+'</div>'+section("Acento visual","Cuatro opciones suaves, todas clean.")+'<div class="card"><div class="actions">'+["#8679e8","#68b98f","#eea875","#73aee8"].map(c=>'<button class="colorChoice '+(State.Theme===c?"on":"")+'" style="background:'+c+'" onclick="setTheme(\''+c+'\')"></button>').join("")+'</div></div>'}
function toggleModule(k){State.Modules[k]=!State.Modules[k];save();render("Configuración")}
function setTheme(c){State.Theme=c;document.documentElement.style.setProperty("--primary",c);save();toast("Color actualizado");render("Configuración")}
function render(p="Inicio"){activate(p);let h="";if(p==="Inicio")h=home();else if(p==="Campamentos")h=campsPage();else if(p==="Inscripciones")h=enrollPage();else if(p==="Personas")h=peoplePage();else if(p==="Importar historial")h=importPage();else if(p==="Revisar coincidencias")h=reviewPage();else if(p==="Formulario")h=formPage();else if(p==="Salud")h=healthPage();else if(p==="Pagos")h=paymentsPage();else if(p==="Habitaciones"||p==="Transporte"||p==="Equipos")h=assignmentPage(p);else if(p==="Check-in")h=checkinPage();else if(p==="Comunicaciones")h=commsPage();else if(p==="Mi ficha")h=myPage();else if(p==="Configuración")h=settingsPage();$("#content").innerHTML=h;if(p==="Inscripciones")bindEnroll();if(p==="Personas")bindPeople();if(p==="Importar historial")bindImport();if(p==="Check-in")bindCheckin();window.scrollTo({top:0,behavior:"instant"})}
nav();buildCampSelect();document.documentElement.style.setProperty("--primary",State.Theme||"#8679e8");render();
</script>
</body></html>

  app.innerHTML=`<div class="app ${prep?'prep-app':''}"><header class="top"><div class="toprow"><div class="brand">💣 TNT Buffet<small id="shift-label">SIN JORNADA</small><button class="pill" id="shift-history">Elegir jornada</button></div><button class="pill role-pill ${prep?'prep-pill':''}" id="role-pill">${prep?'👨‍🍳 PREPARACIÓN':'🧾 CAJA'} · ${esc(state.name)}</button></div></header>${prep?`<div class="prep-strip"><span class="prep-dot"></span><b>MODO PREPARACIÓN</b><small>Este celular recibe las órdenes nuevas en pantalla completa.</small></div>`:''}<main class="content" id="screen"></main><nav class="nav ${prep?'prep-nav':''}">${prep?`<button data-tab="kitchen"><b>👨‍🍳</b>Órdenes de preparación</button>`:`<button data-tab="sale"><b>🛒</b>Vender</button><button data-tab="kitchen"><b>👨‍🍳</b>Órdenes</button><button data-tab="menu"><b>🍽️</b>Menú</button><button data-tab="cash"><b>💰</b>Caja</button>`}</nav></div>`;
  document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});
  $('#shift-history').onclick=chooseShift;
  $('#role-pill').onclick=()=>{const next=state.role==='kitchen'?'cashier':'kitchen';state.role=next;localStorage.setItem('tnt_role',next);state.tab=next==='kitchen'?'kitchen':'sale';renderShell();render();};
}

async function refreshAll(){
  await loadShift();
  await Promise.all([loadProducts(),loadMenu(),loadOrders(),loadSales(),loadExpenses(),loadDebts(),loadClosure()]);
  render();
}
async function loadShift(){const d=state.date;const {data,error}=await db.from('tnt_shifts').select('*').eq('shift_date',d).maybeSingle();if(error)throw error;state.shift=data}
async function loadProducts(){const {data,error}=await db.from('tnt_products').select('*').order('created_at');if(error)throw error;state.products=data||[]}
async function loadMenu(){if(!state.shift){state.menu=[];return}const {data,error}=await db.from('tnt_menu_items').select('*,tnt_products(*)').eq('shift_id',state.shift.id).order('sort_order').order('created_at');if(error)throw error;state.menu=data||[]}
async function loadOrders(){if(!state.shift){state.orders=[];return}const {data,error}=await db.from('tnt_orders').select('*').eq('shift_id',state.shift.id).neq('status','cancelled').order('created_at',{ascending:false}).limit(100);if(error)throw error;state.orders=data||[]}
async function loadSales(){
 if(!state.shift){state.sales=[];return;}
 const sales=[];
 for(let start=0;;start+=500){
  const {data,error}=await db.from('tnt_sales').select('*,tnt_sale_items(id,menu_item_id,product_id,product_name,emoji,qty,unit_price,line_total,requires_prep)').eq('shift_id',state.shift.id).order('created_at',{ascending:false}).order('id',{ascending:false}).range(start,start+499);
  if(error)throw error;
  sales.push(...(data||[]));if(!data||data.length<500)break;
 }
 state.sales=sales;
}
async function loadExpenses(){if(!state.shift){state.expenses=[];return}const {data,error}=await db.from('tnt_expenses').select('*').eq('shift_id',state.shift.id).order('created_at',{ascending:false});if(error)throw error;state.expenses=data||[]}
async function loadDebts(){const {data,error}=await db.from('tnt_debts').select('*').eq('status','pending').order('created_at',{ascending:false});if(error)throw error;state.debts=data||[]}
async function loadClosure(){if(!state.shift){state.closure=null;return}const {data,error}=await db.from('tnt_cash_closures').select('*').eq('shift_id',state.shift.id).maybeSingle();if(error)throw error;state.closure=data}

function connectRealtime(){
 if(channel)clearInterval(channel);let busy=false;channel=setInterval(async()=>{if(document.hidden||busy||state.charging)return;busy=true;try{const old=new Set(state.orders.map(o=>o.id));await Promise.all([loadOrders(),loadMenu()]);const fresh=state.orders.find(o=>!old.has(o.id)&&o.status==='new');if(state.role==='kitchen'&&fresh)showOrderAlert(fresh);if(state.tab==='kitchen')render();}catch(e){toast('No se pudo actualizar. Revisá la conexión.');}finally{busy=false;}},7000);
 window.addEventListener('pagehide',()=>{saveCart();clearInterval(channel);},{once:true});
}

function render(){
  if(!$('#screen'))return;
  if(state.role==='kitchen') state.tab='kitchen';
  const l=$('#shift-label');if(l)l.textContent=state.shift?`${state.shift.shift_date.split('-').reverse().join('/')} · ${({planning:'EN PREPARACIÓN',open:'ABIERTA',closed:'CERRADA'}[state.shift.status]||'SIN ESTADO')}`:'SIN JORNADA';
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));
  if(state.tab==='sale')renderSale();
  else if(state.tab==='kitchen')renderKitchen();
  else if(state.tab==='menu')renderMenu();
  else renderCash();
}

function shiftGate(inner){
  if(!state.shift)return `<div class="hero"><h1>Arranquemos el sábado</h1><p>Creá la jornada para configurar el menú. Podés abrir la caja después.</p></div><div class="card"><button class="btn full" id="create-shift">Crear jornada para esta fecha</button></div>`;
  return inner;
}
function bindCreateShift(){const b=$('#create-shift');if(b)b.onclick=async()=>{setBusy(b,true);try{const {data,error}=await db.from('tnt_shifts').insert({shift_date:state.date,status:'planning',opening_cash:0}).select().single();if(error)throw error;state.shift=data;await loadMenu();render()}catch(e){toast(errMsg(e));setBusy(b,false)}}}

function renderSale(){
  captureCart();
  const s=$('#screen');
  if(!state.shift){s.innerHTML=shiftGate('');bindCreateShift();return}
  if(state.shift.status==='planning'){s.innerHTML=`<div class="hero"><h1>🛒 Caja todavía cerrada</h1><p>Terminá el menú y abrí la caja para empezar a vender.</p></div><button class="btn full" id="go-menu">Configurar menú</button>`;$('#go-menu').onclick=()=>{state.tab='menu';render()};return}
  if(state.shift.status==='closed'){s.innerHTML=`<div class="hero"><h1>🔒 Jornada cerrada</h1><p>El sábado quedó registrado. Mirá el cierre en Caja.</p></div>`;return}
  state.cart=state.cart.filter(x=>state.menu.some(m=>m.id===x.id));
  const active=state.menu.filter(x=>x.active&&x.tnt_products?.active);
  const salesTotal=state.sales.reduce((a,x)=>a+Number(x.total),0);
  s.innerHTML=`<div class="stats"><div class="stat"><small>Ventas</small><strong>${state.sales.length}</strong></div><div class="stat"><small>Recaudado</small><strong>${money(salesTotal)}</strong></div></div><div class="section-title"><h2>Productos</h2><span>Agregá todos los productos del pedido</span></div><div class="prodgrid">${active.map(productCard).join('')}</div>${cartHtml()}<div class="tnt-actions buffet-order-actions"><button class="btn secondary" id="park-order" ${!state.cart.length?'disabled':''}>Dejar pedido en espera</button><button class="btn secondary" id="parked-orders">Pedidos en espera (${state.parked.length})</button><button class="btn secondary" id="clear-order" ${!state.cart.length?'disabled':''}>Vaciar pedido</button></div>`;
  s.querySelectorAll('.product[data-id]').forEach(b=>b.onclick=()=>addCart(b.dataset.id));bindCart();
}
function productCard(m){const p=m.tnt_products;const visual=p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}">`:esc(p.emoji);return `<button class="product" data-id="${m.id}" ${m.remaining_qty<=0?'disabled':''}><div class="pvisual">${visual}</div><div class="pbody"><div class="pname">${esc(p.name)}</div><div class="pmeta"><span class="price">${money(m.price)}</span><span class="stock ${m.remaining_qty<=4?'low':''}">${m.remaining_qty} quedan</span></div></div>${m.remaining_qty<=0?'<div class="soldout">AGOTADO</div>':''}</button>`}
function addCart(id){if(state.charging)return;captureCart();const m=state.menu.find(x=>x.id===id);if(!m||m.remaining_qty<=0)return;let it=state.cart.find(x=>x.id===id);if(it){if(it.qty<m.remaining_qty)it.qty++}else state.cart.push({id,qty:1});renderSale()}
function cartHtml(){const total=state.cart.reduce((a,x)=>{const m=state.menu.find(y=>y.id===x.id);return a+(m?Number(m.price)*x.qty:0)},0);if(!state.cart.length)return `<div class="cartbar"><div class="carthead"><strong>Pedido · ${state.cart.reduce((n,x)=>n+x.qty,0)} productos</strong><strong>$0</strong></div><div class="empty">Tocá productos para armar el pedido</div></div>`;return `<div class="cartbar"><div class="carthead"><strong>Pedido · ${state.cart.reduce((n,x)=>n+x.qty,0)} productos</strong><strong>${money(total)}</strong></div>${state.cart.map(x=>{const m=state.menu.find(y=>y.id===x.id),p=m.tnt_products;return `<div class="cartitem"><div><b>${esc(p.emoji)} ${esc(p.name)}</b><div class="muted">${money(m.price*x.qty)}</div></div><div class="qty"><button data-act="minus" data-id="${x.id}">−</button><b>${x.qty}</b><button data-act="plus" data-id="${x.id}">+</button></div></div>`}).join('')}<div class="checkout"><div class="field"><label>Nombre / para quién</label><input class="input" id="customer" value="${esc(state.customer||'')}" placeholder="Ej: Santi Laghi"></div><div class="field"><label>Notas</label><input class="input" id="sale-notes" value="${esc(state.notes||'')}" placeholder="Sin azúcar, calentar, etc."></div><div class="paychips"><button class="chip ${state.pay==='cash'?'sel':''}" data-pay="cash">💵 Efectivo</button><button class="chip ${state.pay==='transfer'?'sel':''}" data-pay="transfer">📲 Transfer.</button><button class="chip ${state.pay==='fiado'?'sel':''}" data-pay="fiado">📝 Fiado</button></div>${state.pay==='cash'?`<div class="field"><label>Efectivo recibido</label><input class="input" id="received" value="${esc(state.received||'')}" inputmode="decimal" type="number" min="0" placeholder="${Math.ceil(total)}"></div>`:''}<button class="btn green full" id="charge">COBRAR ${money(total)}</button></div></div>`}
function bindCart(){
 saveCart();['customer','sale-notes','received'].forEach(id=>{const el=$('#'+id);if(el)el.oninput=()=>{captureCart();saveCart();};});
 $('#park-order')?.addEventListener('click',()=>{if(state.charging||!state.cart.length)return;captureCart();state.parked.push({id:crypto.randomUUID(),at:new Date().toISOString(),cart:structuredClone(state.cart),customer:state.customer,notes:state.notes,received:state.received,pay:state.pay});resetCart();renderSale();toast('Pedido guardado en espera en este dispositivo.');});
 $('#clear-order')?.addEventListener('click',async()=>{if(state.charging)return;if(await TNTUI.confirm('¿Vaciar este pedido sin cobrarlo?')){resetCart();renderSale();}});
 $('#parked-orders')?.addEventListener('click',showParked);

  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{if(state.charging)return;const it=state.cart.find(x=>x.id===b.dataset.id),m=state.menu.find(x=>x.id===b.dataset.id);if(b.dataset.act==='plus'&&it.qty<m.remaining_qty)it.qty++;if(b.dataset.act==='minus'){it.qty--;if(it.qty<=0)state.cart=state.cart.filter(x=>x!==it)}renderSale()});
  document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{if(state.charging)return;state.pay=b.dataset.pay;renderSale()});
  const c=$('#charge');if(c)c.onclick=chargeSale;
}
async function chargeSale(e){const b=e.currentTarget;if(state.charging||!TNT.hasAccess('buffet','*','edit')||!state.cart.length)return;const customer=$('#customer')?.value.trim()||'',notes=$('#sale-notes')?.value.trim()||'';if(state.pay==='fiado'&&!customer){toast('Poné el nombre del fiado');return}const total=state.cart.reduce((a,x)=>a+Number(state.menu.find(y=>y.id===x.id)?.price||0)*x.qty,0);const received=state.pay==='cash'?Number($('#received')?.value||0):0;if(state.pay==='cash'&&received<total){toast('Falta efectivo');return}state.charging=true;document.querySelectorAll('#screen button,#screen input').forEach(el=>el.disabled=true);setBusy(b,true,'COBRANDO…');try{const {data,error}=await db.rpc('tnt_create_sale',{p_shift_id:state.shift.id,p_customer_name:customer,p_method:state.pay,p_received:received,p_notes:notes,p_cashier:state.name,p_items:state.cart.map(x=>({menu_item_id:x.id,qty:x.qty}))});if(error)throw error;resetCart();try{await Promise.all([loadMenu(),loadSales(),loadOrders(),loadDebts()]);toast(data?.order?`✅ Cobrado · Orden #${data.order.order_no} enviada`:'✅ Cobrado')}catch{toast('Venta guardada. No pudimos actualizar la pantalla; tocá la jornada para recargar.')}renderSale()}catch(x){toast(errMsg(x));setBusy(b,false)}finally{state.charging=false;renderSale();enforceReadOnly();}}

function renderKitchen(){
  const s=$('#screen');if(!state.shift){s.innerHTML=shiftGate('');bindCreateShift();return}
  const pending=state.orders.filter(x=>['new','taken','ready'].includes(x.status));
  s.innerHTML=`<div class="hero"><h1>👨‍🍳 Preparación</h1><p>Las nuevas órdenes aparecen solas y ocupan la pantalla hasta que alguien las tome.</p></div><div class="section-title"><h2>Órdenes activas</h2><span>${pending.length}</span></div><div class="orders">${pending.length?pending.map(orderHtml).join(''):'<div class="empty">No hay órdenes pendientes 🎉</div>'}</div>`;
  bindOrderButtons();
}
function orderHtml(o){const lab=o.status==='new'?'NUEVA':o.status==='taken'?`TOMÓ ${esc(o.taken_by||'')}`:'LISTA';const action=o.status==='new'?`<button class="btn full" data-claim="${o.id}">✋ TOMAR ORDEN</button>`:o.status==='taken'?`<button class="btn green full" data-ready="${o.id}">✅ MARCAR LISTO</button>`:`<button class="btn blue full" data-deliver="${o.id}">🤝 ENTREGADO</button>`;return `<div class="order ${o.status}"><div class="oh"><span class="ono">#${o.order_no}</span><span class="ostatus">${lab}</span></div><div class="osum">${esc(o.summary)}</div><div class="ocustomer">${o.customer_name?`PARA ${esc(o.customer_name).toUpperCase()}`:'SIN NOMBRE'}</div>${o.notes?`<div class="onotes">📝 ${esc(o.notes)}</div>`:''}<div class="muted" style="margin-top:6px">${fmtTime(o.created_at)} · Caja: ${esc(o.cashier_name)}</div>${action}</div>`}
function bindOrderButtons(){document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>orderAction(b,'tnt_claim_order',{p_order_id:b.dataset.claim,p_staff:state.name}));document.querySelectorAll('[data-ready]').forEach(b=>b.onclick=()=>orderAction(b,'tnt_ready_order',{p_order_id:b.dataset.ready,p_staff:state.name}));document.querySelectorAll('[data-deliver]').forEach(b=>b.onclick=()=>orderAction(b,'tnt_deliver_order',{p_order_id:b.dataset.deliver}))}
async function orderAction(b,fn,args){setBusy(b,true);try{const {data,error}=await db.rpc(fn,args);if(error)throw error;await loadOrders();if(fn==='tnt_claim_order'&&data.taken_by!==state.name)toast(`Ya la tomó ${data.taken_by}`);else toast('✅ Actualizado');hideOrderAlert();render()}catch(e){toast(errMsg(e));setBusy(b,false)}}
function showOrderAlert(o){state.alert=o;$('#alert-order-no').textContent=`ORDEN #${o.order_no}`;$('#alert-summary').textContent=o.summary;$('#alert-customer').textContent=(o.customer_name||'SIN NOMBRE').toUpperCase();$('#alert-notes').textContent=o.notes?`📝 ${o.notes}`:'';$('#alert-actions').innerHTML=`<button class="btn green" id="alert-take">✋ TOMAR ORDEN</button><button class="btn secondary" id="alert-close">VER LISTA</button>`;alertEl.hidden=false;alertEl.classList.remove('hidden');try{navigator.vibrate?.([350,120,350,120,600])}catch{}beep();$('#alert-take').onclick=()=>orderAction($('#alert-take'),'tnt_claim_order',{p_order_id:o.id,p_staff:state.name});$('#alert-close').onclick=hideOrderAlert}
function hideOrderAlert(){state.alert=null;alertEl.classList.add('hidden');alertEl.hidden=true}
function beep(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const ac=new A(),osc=ac.createOscillator(),g=ac.createGain();osc.frequency.value=880;g.gain.value=.08;osc.connect(g);g.connect(ac.destination);osc.start();setTimeout(()=>{osc.stop();ac.close()},300)}catch{}}

function renderMenu(){
  const s=$('#screen');if(!state.shift){s.innerHTML=shiftGate('');bindCreateShift();return}
  const isClosed=state.shift.status==='closed';
  s.innerHTML=`<div class="hero"><h1>🍽️ Menú del sábado</h1><p>Cambiá productos, precios y cantidades cada semana sin perder el historial.</p></div>${state.shift.status==='planning'?`<div class="card"><div class="field"><label>Efectivo inicial</label><input class="input" id="opening" type="number" inputmode="decimal" value="0"></div><div class="btnrow"><button class="btn secondary" id="copy-menu">Copiar último sábado</button><button class="btn green" id="open-shift">🟢 ABRIR BUFFET</button></div></div>`:''}<div class="section-title"><h2>Catálogo</h2><button class="btn secondary" id="new-product" ${isClosed?'disabled':''}>+ Producto</button></div><div class="card" id="menu-list">${state.products.filter(p=>p.active).map(menuProductRow).join('')||'<div class="empty">Sin productos</div>'}</div>`;
  bindMenu();
}
function menuProductRow(p){const m=state.menu.find(x=>x.product_id===p.id);const visual=p.image_url?`<img src="${esc(p.image_url)}">`:esc(p.emoji);return `<div class="menurow" data-product="${p.id}"><div class="emoji">${visual}</div><div><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(p.name)}</b><button class="pill edit-product" data-p="${p.id}">Editar</button></div><div class="mini-grid" style="margin-top:7px"><div class="field"><label>Precio hoy</label><input class="input mi-price" type="number" value="${m?Number(m.price):Number(p.default_price)}"></div><div class="field"><label>Costo/u</label><input class="input mi-cost" type="number" value="${m?Number(m.cost):Number(p.default_cost)}"></div><div class="field"><label>Preparados</label><input class="input mi-qty" type="number" min="0" value="${m?m.initial_qty:0}"></div><div class="field"><label>Quedan</label><input class="input mi-rem" type="number" min="0" value="${m?m.remaining_qty:0}" ${m?'':'disabled'}></div></div><div class="switchline"><span class="muted">Vender este sábado</span><input class="switch mi-active" type="checkbox" ${m?.active?'checked':''}></div></div></div>`}
function bindMenu(){
  const cp=$('#copy-menu');if(cp)cp.onclick=async()=>{setBusy(cp,true);try{const {data,error}=await db.rpc('tnt_copy_last_menu',{p_shift_id:state.shift.id});if(error)throw error;await loadMenu();toast(data?`Copiados ${data} productos`:'No hay un sábado anterior');renderMenu()}catch(e){toast(errMsg(e));setBusy(cp,false)}};
  const op=$('#open-shift');if(op)op.onclick=async()=>{setBusy(op,true,'ABRIENDO…');try{const {data,error}=await db.rpc('tnt_open_shift',{p_date:state.date,p_opening_cash:Number($('#opening').value||0),p_staff:state.name});if(error)throw error;state.shift=data;toast('🟢 Buffet abierto');state.tab='sale';render()}catch(e){toast(errMsg(e));setBusy(op,false)}};
  $('#new-product').onclick=()=>productModal();document.querySelectorAll('.edit-product').forEach(b=>b.onclick=()=>productModal(state.products.find(p=>p.id===b.dataset.p)));
  document.querySelectorAll('.menurow').forEach(row=>{const p=state.products.find(x=>x.id===row.dataset.product),m=state.menu.find(x=>x.product_id===p.id),toggle=row.querySelector('.mi-active');toggle.onchange=()=>saveMenuRow(row,p,state.menu.find(x=>x.product_id===p.id));row.querySelectorAll('.mi-price,.mi-cost,.mi-qty,.mi-rem').forEach(i=>i.onchange=()=>{if(toggle.checked)saveMenuRow(row,p,state.menu.find(x=>x.product_id===p.id))})});
}
async function saveMenuRow(row,p,m){
 if(row.dataset.saving||!TNT.hasAccess('buffet','*','edit'))return;
 const active=row.querySelector('.mi-active').checked,price=Number(row.querySelector('.mi-price').value),cost=Number(row.querySelector('.mi-cost').value),qty=Number(row.querySelector('.mi-qty').value||0),rem=Number(row.querySelector('.mi-rem').value||0);
 let status=row.querySelector('[role=status]');
 if(!status){status=document.createElement('p');status.className='muted';status.setAttribute('role','status');row.append(status);}
 if(!Number.isFinite(price)||!Number.isFinite(cost)||price<0||cost<0||!Number.isInteger(qty)||!Number.isInteger(rem)||qty<0||rem<0){status.textContent='Revisá precios y costos positivos, y cantidades enteras.';return;}
 row.dataset.saving='true';row.querySelectorAll('input,button').forEach(el=>el.disabled=true);status.textContent='Guardando…';
 try{
  if(m){
   const result=await db.from('tnt_menu_items').update({price,cost,initial_qty:qty,remaining_qty:rem,active}).eq('id',m.id).eq('remaining_qty',m.remaining_qty).select().maybeSingle();
   if(result.error)throw result.error;
   if(!result.data){await loadMenu();const current=state.menu.find(x=>x.id===m.id);if(current)row.querySelector('.mi-rem').value=current.remaining_qty;throw Error('Cambió el stock por una venta. Actualizamos cuántos quedan; revisá los valores antes de guardar de nuevo.');}
  }else if(active){
   const {error}=await db.from('tnt_menu_items').insert({shift_id:state.shift.id,product_id:p.id,price,cost,initial_qty:qty,remaining_qty:qty,active:true,sort_order:state.menu.length});
   if(error)throw error;
  }
  await loadMenu();toast('Guardado');renderMenu();
 }catch(e){status.textContent='No se guardó: '+errMsg(e);}
 finally{delete row.dataset.saving;row.querySelectorAll('input,button').forEach(el=>el.disabled=false);if(!m)row.querySelector('.mi-rem').disabled=true;enforceReadOnly();}
}
function productModal(p=null){

async function compressPhoto(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=560,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*scale),h=Math.round(img.height*scale),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',.68))};img.src=r.result};r.readAsDataURL(file)})}

const BILL_DENOMS=[20000,10000,2000,1000,500,200,100,50,20,10];
function billStorageKey(){return state.shift?`tnt_billcount_${state.shift.id}`:'tnt_billcount_none'}
function getBillCounts(){try{return JSON.parse(localStorage.getItem(billStorageKey())||'{}')}catch{return {}}}
function saveBillCounts(counts){try{localStorage.setItem(billStorageKey(),JSON.stringify(counts))}catch{}}
function billCountTotal(counts=getBillCounts()){return BILL_DENOMS.reduce((sum,d)=>sum+d*Math.max(0,Number(counts[d]||0)),0)}
function billCounterHtml(){const counts=getBillCounts(),total=billCountTotal(counts);return `<div class="card bill-card"><div class="bill-head"><div><h3>🧮 Contador de billetes</h3><p>Contá la caja tocando + / −. El total pasa solo al cierre.</p></div><div class="bill-total"><small>TOTAL CONTADO</small><strong id="bill-total">${money(total)}</strong></div></div><div class="bill-list">${BILL_DENOMS.map(d=>`<div class="bill-row" data-denom="${d}"><div class="bill-value">${money(d)}</div><div class="bill-stepper"><button type="button" class="bill-minus" aria-label="Restar billete de ${money(d)}">−</button><input class="bill-count" inputmode="numeric" type="number" min="0" step="1" value="${Math.max(0,Number(counts[d]||0))}" aria-label="Cantidad de billetes de ${money(d)}"><button type="button" class="bill-plus" aria-label="Sumar billete de ${money(d)}">+</button></div><div class="bill-subtotal">${money(d*Math.max(0,Number(counts[d]||0)))}</div></div>`).join('')}</div><button type="button" class="btn secondary full" id="clear-bills">Vaciar contador</button></div>`}
function syncBillCounter(){const counts={};document.querySelectorAll('.bill-row').forEach(row=>{const d=Number(row.dataset.denom),input=row.querySelector('.bill-count'),n=Math.max(0,Math.floor(Number(input.value||0)));input.value=n;counts[d]=n;row.querySelector('.bill-subtotal').textContent=money(d*n)});saveBillCounts(counts);const total=billCountTotal(counts),totalEl=$('#bill-total'),counted=$('#counted');if(totalEl)totalEl.textContent=money(total);if(counted)counted.value=total;}
function bindBillCounter(){document.querySelectorAll('.bill-row').forEach(row=>{const input=row.querySelector('.bill-count');row.querySelector('.bill-minus').onclick=()=>{input.value=Math.max(0,Number(input.value||0)-1);syncBillCounter()};row.querySelector('.bill-plus').onclick=()=>{input.value=Math.max(0,Number(input.value||0)+1);syncBillCounter()};input.oninput=syncBillCounter});const clear=$('#clear-bills');if(clear)clear.onclick=()=>{document.querySelectorAll('.bill-count').forEach(i=>i.value=0);syncBillCounter()};syncBillCounter()}

function renderCash(){

  const sales=state.sales,exp=state.expenses;const total=sales.reduce((a,x)=>a+Number(x.total),0),cash=sales.filter(x=>x.method==='cash').reduce((a,x)=>a+Number(x.total),0),tr=sales.filter(x=>x.method==='transfer').reduce((a,x)=>a+Number(x.total),0),fiado=sales.filter(x=>x.method==='fiado').reduce((a,x)=>a+Number(x.total),0),expenses=exp.reduce((a,x)=>a+Number(x.amount),0),cost=sales.reduce((a,x)=>a+Number(x.total_cost),0),profit=total-cost-expenses;

  bindCash();
}
function closureHtml(){const c=state.closure;return `<div class="hero"><h1>🔒 Sábado cerrado</h1><p>Cerró ${esc(c.closed_by)}</p></div><div class="stats"><div class="stat"><small>Esperado efectivo</small><strong>${money(c.expected_cash)}</strong></div><div class="stat"><small>Contado</small><strong>${money(c.counted_cash)}</strong></div><div class="stat"><small>Diferencia</small><strong class="${Number(c.difference)===0?'positive':'negative'}">${money(c.difference)}</strong></div><div class="stat"><small>Para ministerio*</small><strong class="positive">${money(c.profit_estimate)}</strong></div></div><div class="card muted">* Resultado estimado: ventas − costo cargado de productos − gastos registrados.</div>`}

async function chooseShift(){
  try {
    const {data,error}=await db.from('tnt_shifts').select('shift_date,status').order('shift_date',{ascending:false});

    const days=[...new Set([localDate(),...(data||[]).map(s=>s.shift_date)])];
    const modal=TNTUI.modal('Jornadas de Buffet',`<p>Elegí una fecha para ver su menú, ventas y cierre.</p><label>Jornada<select id="buffet-date">${days.map(d=>`<option value="${d}" ${d===state.date?'selected':''}>${d.split('-').reverse().join('/')} ${d===localDate()?'· Hoy':''}</option>`).join('')}</select></label><button class="tnt-button primary" id="load-buffet-date">Ver jornada</button><div role="alert"></div>`);
    modal.querySelector('#load-buffet-date').onclick=async e=>{const b=e.currentTarget;b.disabled=true;if(state.charging){b.disabled=false;return toast('Esperá a que termine el cobro.')}captureCart();saveCart();const before=structuredClone(state);state.date=modal.querySelector('select').value;$('#screen').innerHTML='<p class="muted">Cargando jornada…</p>';try{await loadShift();await Promise.all([loadProducts(),loadMenu(),loadOrders(),loadSales(),loadExpenses(),loadDebts(),loadClosure()]);restoreCart();render();await TNTUI.closeModal(modal)}catch(err){Object.assign(state,before);render();modal.querySelector('[role=alert]').textContent='No se pudo cargar la jornada: '+errMsg(err);}finally{b.disabled=false}};
  }catch(e){toast(errMsg(e))}
}
function enforceReadOnly(){
  if(!TNT.identity||TNT.hasAccess('buffet','*','edit'))return;
  document.querySelectorAll('#screen button:not(#go-menu),#screen input,#screen textarea,#screen select').forEach(el=>{if(!el.disabled)el.disabled=true;});
  const screen=document.querySelector('#screen');if(screen&&!screen.querySelector('.buffet-readonly')){const note=document.createElement('p');note.className='buffet-readonly muted';note.textContent='Acceso de lectura: podés consultar las jornadas. Para registrar cambios necesitás permiso de edición.';screen.prepend(note);}
}
new MutationObserver(enforceReadOnly).observe(app,{childList:true,subtree:true});
let buffetLiveTimer;
document.addEventListener('tnt:data',event=>{
 if(!(event.detail?.tables||[]).some(t=>['tnt_products','tnt_shifts','tnt_menu_items','tnt_orders','tnt_sales','tnt_expenses','tnt_debts','tnt_cash_closures'].includes(t)))return;
 clearTimeout(buffetLiveTimer);buffetLiveTimer=setTimeout(async()=>{
  if(TNT.blocked||state.charging||!document.querySelector('#screen'))return;
  captureCart();saveCart();
  try{await refreshAll();}catch(error){toast('No se pudo actualizar la jornada: '+errMsg(error));}
 },180);
});
(async function init(){await TNT.ready;if(!TNT.identity||TNT.blocked)return;state.name=TNT.displayName();state.tab=state.role==='kitchen'?'kitchen':'sale';localStorage.setItem('tnt_name',state.name);try{await connectApp();await boot()}catch(e){loginView(errMsg(e))}})();

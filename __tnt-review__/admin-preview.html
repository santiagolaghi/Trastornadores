 const sheet=TNT.sheet('Permisos detallados',`<div class="permission-person"><b>${esc(a.nickname||p.full_name)}</b><span>Rol: ${esc(role)}</span><p>“Usar rol” sigue la plantilla de ${esc(role)}. Elegí Permitir o Bloquear solo cuando esta persona sea una excepción.</p></div><div class="permission-modules">${permissionBlocks(role,pid)}</div>`,true);
 sheet.querySelectorAll('[data-person-action]').forEach(sel=>{sel.dataset.saved=sel.value;sel.onchange=async()=>{sel.disabled=true;const key={person_id:pid,module:sel.dataset.module,scope:sel.dataset.scope,action:sel.dataset.action};try{let r;if(sel.value==='inherit'){r=await sb.from('tnt_person_permission_overrides').delete().eq('person_id',pid).eq('module',key.module).eq('scope',key.scope).eq('action',key.action);}else{r=await sb.from('tnt_person_permission_overrides').upsert({...key,allowed:sel.value==='allow',updated_by:TNT.person.id,updated_at:new Date().toISOString()},{onConflict:'person_id,module,scope,action'});}if(r.error)throw r.error;sel.dataset.saved=sel.value;TNTUI.toast('Excepción guardada');await load();}catch(e){sel.value=sel.dataset.saved;TNTUI.toast('No se pudo guardar: '+e.message,true);}finally{sel.disabled=false;TNTUI.enhanceSelects(sheet);}};});
}
function modulesView(){const rows=[];for(const [mod,scopes] of Object.entries(MODULE_SCOPES))for(const [scope,label] of scopes){const allowed=accounts.filter(a=>effectiveAccess(a,mod,scope).level!=='none');rows.push(`<article class="card"><h3>${esc(label)}</h3><p>${allowed.length} cuentas con acceso</p>${allowed.map(a=>`<span class="tnt-pill">${esc(a.nickname||person(a.person_id).full_name)}${inheritedAccess(a,mod,scope)?' · '+esc(inheritedAccess(a,mod,scope)):''}</span>`).join('')}</article>`);}view.innerHTML='<div class="grid2">'+rows.join('')+'</div>';}

function trashView(){view.innerHTML='<div class="grid2">'+(trash.length?trash.map(x=>'<article class="card"><b style="font-size:12px">'+esc(x.label||x.entity_type)+'</b><p style="font-size:12px;color:var(--tnt-muted)">Eliminado '+new Date(x.deleted_at).toLocaleString('es-AR')+' · recuperable hasta '+new Date(x.restore_until).toLocaleDateString('es-AR')+'</p><span class="tnt-pill">'+esc(x.entity_type)+'</span></article>').join(''):'<div class="card"><b>La papelera está vacía.</b></div>')+'</div>'}
const permissionLabel=(m,scope)=>MODULE_SCOPES[m]?.find(x=>x[0]===scope)?.[1]||m;
function profileLinksView(){const rows=profileLinks.filter(r=>r.status==='pending');return `<section class="settings-grid"><h2>Cuentas que coinciden con perfiles · ${rows.length}</h2>${rows.map(r=>`<article class="card"><h3>${esc(person(r.person_id).full_name)}</h3><p>La cuenta Google coincide en nombre y nacimiento con ${esc(person(r.target_person_id).full_name)}, que ya tiene un perfil. Revisá la vista previa antes de vincular.</p><button class="btn primary" data-profile-link="${r.id}">Revisar identidad e historial</button></article>`).join('')||'<p>No hay vinculaciones pendientes.</p>'}</section>`;}
function bindProfileLinks(){view.querySelectorAll('[data-profile-link]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const result=await sb.rpc('tnt_profile_link_preview',{p_request:b.dataset.profileLink});if(result.error)throw result.error;const {source,target,history}=result.data;
 const fields=[['birthday','Nacimiento'],['sex','Sexo'],['phone','WhatsApp'],['instagram','Instagram'],['dni','DNI']],profileCard=(p,label)=>`<article class="card"><h3>${label}</h3><b>${esc(p.full_name)}</b><dl>${fields.map(([k,l])=>`<dt>${l}</dt><dd>${esc(k==='sex'?({M:'Varón',F:'Mujer'}[p[k]]||'Sin definir'):p[k]||'Sin completar')}</dd>`).join('')}</dl></article>`;
 const modal=TNT.sheet('Vincular una cuenta a su perfil',`<p>Cuenta Google: <strong>${esc(acct(source.id).email||'Sin correo')}</strong></p><div class="grid2">${profileCard(source,'Datos de la cuenta nueva')}${profileCard(target,'Perfil que se conserva')}</div><p>Historial del perfil: ${history.saturdays} asistencias de sábados, ${history.efe} de EFE, ${history.camps} inscripciones a campamento y ${history.messages} mensajes.</p><p>Se conservan los datos del perfil original. La cuenta mantendrá su estado de staff y sus permisos actuales.</p><form id="profile-link-form" class="tnt-form"><label><input type="checkbox" name="same_person" required> Verifiqué que los dos registros son de la misma persona.</label><div class="acts"><button type="submit" class="btn primary">Vincular y conservar historial</button><button type="button" class="btn danger" data-reject-link>Son personas distintas</button></div><p role="status"></p></form>`);
 const form=modal.querySelector('form'),review=async approved=>{const buttons=[...form.querySelectorAll('button')];buttons.forEach(x=>x.disabled=true);try{const r=await sb.rpc('tnt_review_profile_link',{p_request:b.dataset.profileLink,p_approve:approved});if(r.error)throw r.error;TNTUI.closeModal(modal);await load();TNTUI.toast(approved?'Cuenta vinculada. El historial se conserva.':'Se conservaron los dos perfiles separados.');}catch(e){form.querySelector('[role=status]').textContent=e.message;}finally{buttons.forEach(x=>x.disabled=false);}};
 form.onsubmit=e=>{e.preventDefault();if(form.checkValidity())review(true);};form.querySelector('[data-reject-link]').onclick=()=>review(false);
 }catch(e){TNTUI.toast(e.message||'No se pudo cargar la vista previa.',true);}finally{b.disabled=false;}});}
const PROFILE_LABELS={first_name:'Nombre',last_name:'Apellido',birthday:'Fecha de nacimiento',sex:'Sexo',phone:'WhatsApp',instagram:'Instagram',dni:'DNI',interests:'Intereses',studies:'Estudio o actividad',dreams:'Sueños',efe_group:'EFE'};
function profileValue(key,value){return key==='sex'?({F:'Mujer',M:'Varón'}[value]||'Sin definir'):value||'Sin completar';}
function profileRequestsView(){const rows=[...profileRequests.map(r=>({...r,origin:'account'})),...publicProfileRequests.map(r=>({...r,origin:'public'}))].filter(r=>r.status==='pending');return `<section class="settings-grid"><h2>Cambios de perfil · ${rows.length}</h2>${rows.map(r=>`<article class="card"><h3>${esc(person(r.person_id).full_name)}</h3><p>${r.origin==='public'?'Enviado desde el formulario público. Verificá la identidad de quien envió los datos.':'Enviado desde la cuenta Google de esta persona.'}</p><dl>${Object.entries(r.proposed_values).filter(([k,v])=>v!==r.before_values[k]).map(([k,v])=>`<dt>${esc(PROFILE_LABELS[k]||settings.find(s=>s.key==='profile_fields')?.value?.[k]?.label||k)}</dt><dd>${esc(profileValue(k,r.before_values[k]))} → <strong>${esc(profileValue(k,v))}</strong></dd>`).join('')}</dl><div class="acts"><button class="btn primary" data-profile-review="${r.id}" data-origin="${r.origin}" data-approve="true">Aprobar datos</button><button class="btn danger" data-profile-review="${r.id}" data-origin="${r.origin}" data-approve="false">Rechazar cambios</button></div></article>`).join('')||'<p>No hay cambios de perfil pendientes.</p>'}</section>`;}
function bindProfileReviews(){view.querySelectorAll('[data-profile-review]').forEach(b=>b.onclick=async()=>{const id=b.dataset.profileReview;view.querySelectorAll(`[data-profile-review="${id}"]`).forEach(x=>x.disabled=true);try{const r=await sb.rpc(b.dataset.origin==='public'?'tnt_review_public_profile':'tnt_review_profile_change',{p_request:id,p_approve:b.dataset.approve==='true'});if(r.error)throw r.error;await load();TNTUI.toast('La revisión quedó guardada.');}catch(e){TNTUI.toast(e.message,true);view.querySelectorAll(`[data-profile-review="${id}"]`).forEach(x=>x.disabled=false);}});}
function requestsView(){const pend=requests.filter(x=>x.status==='pending'),done=requests.filter(x=>x.status!=='pending').slice(0,12);view.innerHTML=`${profileLinksView()}${profileRequestsView()}${roleRequestsView()}<section class="settings-grid"><div><h2>Solicitudes de módulos pendientes · ${pend.length}</h2><p>Revisá el módulo y la persona antes de conceder acceso. La respuesta queda registrada.</p></div>${pend.length?pend.map(r=>`<article class="card req"><div><b>${esc(person(r.person_id).full_name)}</b><small>${esc(permissionLabel(r.module,r.scope))} · ${r.requested_level==='view'?'Consultar':r.requested_level==='edit'?'Editar':'Administrar'}</small><small>${esc(r.note||'Sin detalle')} · ${new Date(r.created_at).toLocaleDateString('es-AR')}</small></div><div class="acts"><button class="btn primary" data-review="${r.id}" data-approve="true">Aprobar</button><button class="btn danger" data-review="${r.id}" data-approve="false">Rechazar</button></div></article>`).join(''):'<div class="card">No hay solicitudes pendientes.</div>'}${done.length?`<div><h2>Resueltas recientemente</h2></div>${done.map(r=>`<article class="card"><b>${esc(person(r.person_id).full_name)}</b> · ${esc(permissionLabel(r.module,r.scope))}<p>${r.status==='approved'?'Aprobada':r.status==='rejected'?'Rechazada':'Cancelada'} · ${new Date(r.reviewed_at||r.created_at).toLocaleDateString('es-AR')}</p></article>`).join('')}`:''}</section>`;bindProfileLinks();bindProfileReviews();bindRoleReviews();view.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>review(b.dataset.review,b.dataset.approve==='true'))}
function roleRequestsView(){const pending=roleRequests.filter(r=>r.status==='pending');return `<section class="settings-grid"><div><h2>Revisión del staff · ${pending.length}</h2><p>La función declarada no concede permisos. Confirmala o elegí la correcta.</p></div>${pending.map(r=>`<article class="card role-review" data-role-request="${r.id}"><b>${esc(person(r.person_id).full_name)}</b><p>Solicitó: ${esc(r.requested_role)}</p><label>Función que vas a aprobar<select aria-label="Función aprobada">${['Pastor/a','Líder','Timoteo','Colaborador'].map(role=>`<option value="${role}" ${role===r.requested_role?'selected':''}>${role==='Colaborador'?'Colaborador/a':role}</option>`).join('')}</select></label><div class="acts"><button class="btn primary" data-role-approve="${r.person_id}">Aprobar esta función</button><button class="btn danger" data-role-reject="${r.person_id}">Mantener en comunidad</button></div><small>Al aprobar, podrá consultar Organización y los chats donde lo incluyan. Los demás módulos se autorizan aparte.</small></article>`).join('')||'<p>No hay funciones pendientes de revisión.</p>'}</section>`;}
function bindRoleReviews(){view.querySelectorAll('[data-role-approve],[data-role-reject]').forEach(b=>b.onclick=async()=>{const card=b.closest('[data-role-request]'),pid=b.dataset.roleApprove||b.dataset.roleReject;b.disabled=true;const r=await sb.rpc('tnt_review_staff',{p_person:pid,p_role:b.dataset.roleApprove?card.querySelector('select').value:null});if(r.error){b.disabled=false;TNTUI.toast(r.error.message,true);return;}TNTUI.toast('Revisión guardada');await load();});}
async function review(id,ok){const r=requests.find(x=>x.id===id);if(!r||r.status!=='pending')return;view.querySelectorAll(`[data-review="${id}"]`).forEach(b=>b.disabled=true);try{const result=await sb.rpc('tnt_review_access_request',{p_request:id,p_approve:ok});if(result.error)throw result.error;TNTUI.toast(ok?'Acceso concedido':'Solicitud rechazada');await load()}catch(err){TNTUI.toast(err.message||'No se pudo guardar la respuesta',true);view.querySelectorAll(`[data-review="${id}"]`).forEach(b=>b.disabled=false)}}
function settingsView(){view.innerHTML=`<div class="settings-grid"><article class="card"><h2>Estudio TNT</h2><p>Configurá cada módulo, sus textos, colores, portadas y tutoriales. Probá en borrador y publicá cuando esté listo.</p><div class="tnt-config-cards">${TNTExperience.modules.map(([id,name,desc])=>`<button data-config-module="${id}"><b>${esc(name)}</b><small>${esc(desc)}</small><span class="tnt-pill">${TNTExperience.enabled(id)?"Habilitado":"En pausa"}</span></button>`).join('')}</div></article><article class="card"><h2>Aspecto de la aplicación</h2><p>El tema se aplica a todos los módulos de TNT.</p><div class="actions"><button class="btn" data-theme="light">Modo claro</button><button class="btn" data-theme="dark">Modo oscuro</button></div></article><article class="card"><h2>Usuarios y permisos</h2><p>Definí permisos predeterminados por rol y después hacé excepciones persona por persona cuando sea necesario.</p><div class="actions"><button class="btn primary" data-go="roles">Permisos por rol</button><button class="btn" data-go="users">Gestionar personas</button><button class="btn" data-go="requests">Solicitudes (${requests.filter(x=>x.status==='pending').length})</button></div></article><article class="card"><h2>Organización</h2><p>Los sábados, actividades y plantillas se gestionan directamente en Organización para no duplicar controles acá.</p><div class="actions"><a class="btn primary" href="/organizacion/?view=saturdays">Abrir Organización</a></div></article><article class="card" id="profile-settings"></article><article class="card" id="community-news-settings"></article><article class="card"><h2>Seguimiento y recuperación</h2><p>La auditoría ahora traduce los cambios a lenguaje entendible. La papelera conserva lo recuperable.</p><div class="actions"><button class="btn" data-go="audit">Abrir auditoría</button><button class="btn" data-go="trash">Abrir papelera</button></div></article></div>`;view.querySelectorAll('[data-config-module]').forEach(b=>b.onclick=()=>TNTExperience.openSettings(b.dataset.configModule));TNTProfileSettings.mount(view.querySelector('#profile-settings'),settings);TNTProfileSettings.mountNews(view.querySelector('#community-news-settings'),settings);view.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});view.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{TNT.setTheme(b.dataset.theme);TNTUI.toast('Aspecto actualizado')})}
const AUDIT_ACTION={INSERT:'Creó',UPDATE:'Actualizó',DELETE:'Eliminó',profile_change_approved:'Aprobó cambios de',profile_change_rejected:'Rechazó cambios de',profile_archived:'Archivó',profile_restored:'Restauró',profile_link_approved:'Vinculó la cuenta al',profile_link_rejected:'Rechazó la vinculación de',public_profile_approved:'Aprobó datos recibidos para',public_profile_rejected:'Rechazó datos recibidos para'};const AUDIT_ENTITY={profile:'perfil',task:'actividad',event:'encuentro',account:'cuenta',access_grant:'permiso',chat_thread:'chat',chat_member:'participante del chat',schedule_item:'actividad del cronograma',event_member:'persona del encuentro'};const AUDIT_FIELD={full_name:'nombre completo',first_name:'nombre',last_name:'apellido',birthday:'nacimiento',sex:'sexo',phone:'WhatsApp',instagram:'Instagram',active:'perfil activo',status:'estado',title:'nombre',name:'nombre',planned_start:'horario',duration_minutes:'duración',assignee_mode:'cantidad de responsables',event_role:'función',enabled:'estado de cuenta',access_level:'nivel de acceso',scope:'área',module:'módulo'};
function auditValue(k,v){if(v===null||v===undefined||v==='')return 'vacío';if(k==='sex')return ({M:'Varón',F:'Mujer',U:'Sin definir'})[v]||'Sin definir';if(k==='active'||k==='enabled')return v?'Habilitado':'Deshabilitado';if(k==='status')return ({unread:'pendiente',preparing:'pendiente',progress:'en curso',review:'lista',ready:'lista',completed:'terminada',planning:'en preparación',confirmed:'confirmado',live:'en curso',cancelled:'cancelado'})[v]||v;if(k==='assignee_mode')return v==='multiple'?'varias personas':'una persona';if(k.includes('at')&&typeof v==='string'&&v.includes('T')){try{return new Date(v).toLocaleString('es-AR')}catch{}}return String(v)}
function auditInfo(x){const d=x.details||{},n=d.new||{},o=d.old||{},title=n.title||n.name||n.full_name||o.title||o.name||o.full_name||d.name||AUDIT_ENTITY[x.entity_type]||x.entity_type,who=x.person_id?person(x.person_id).full_name:'Sistema';if(x.action!=='UPDATE')return {title,summary:`${AUDIT_ACTION[x.action]||x.action} ${AUDIT_ENTITY[x.entity_type]||x.entity_type}`,detail:`${who} · ${new Date(x.created_at).toLocaleString('es-AR')}`};const ignored=new Set(['id','updated_at','created_at','created_by','event_id','parent_task_id','private_notes']);const keys=[...new Set([...Object.keys(o),...Object.keys(n)])].filter(k=>!ignored.has(k)&&JSON.stringify(o[k])!==JSON.stringify(n[k]));const readable=keys.slice(0,4).map(k=>`${AUDIT_FIELD[k]||k}: ${auditValue(k,o[k])} → ${auditValue(k,n[k])}`);return {title,summary:'Actualizó '+(AUDIT_ENTITY[x.entity_type]||x.entity_type),detail:(readable.length?readable.join(' · '):'Cambio interno')+' · '+who+' · '+new Date(x.created_at).toLocaleString('es-AR')}}
function auditView(){view.innerHTML=`<div class="audit-head"><div><h2>Historial de cambios</h2><p>Acá ves qué cambió en lenguaje normal, sin código ni JSON.</p></div></div><div class="audit">${audit.length?audit.map(x=>{const i=auditInfo(x);return `<article class="card audit-card"><span class="audit-kind">${esc(i.summary)}</span><h3>${esc(i.title)}</h3><p>${esc(i.detail)}</p></article>`}).join(''):'<div class="card">Todavía no hay movimientos.</div>'}</div>`}
view.addEventListener('input',e=>{const form=e.target.closest('form');if(form)form.dataset.tntDirty='true';});view.addEventListener('change',e=>{const form=e.target.closest('form');if(form)form.dataset.tntDirty='true';});
let adminLiveTimer;document.addEventListener('tnt:data',e=>{if(!(e.detail?.tables||[]).some(t=>['tnt_people','tnt_accounts','tnt_access_grants','tnt_person_permission_overrides','tnt_role_permission_presets','tnt_access_requests','tnt_role_requests','tnt_profile_change_requests','tnt_profile_link_requests','tnt_profile_public_requests','tnt_audit_log','tnt_settings'].includes(t)))return;clearTimeout(adminLiveTimer);adminLiveTimer=setTimeout(()=>{if(!TNT.blocked)load({live:true});},180);});

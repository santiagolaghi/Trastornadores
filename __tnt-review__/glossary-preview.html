    let q=db.from(table).select(select).range(from,from+size-1);

    out.push(...(data||[]));
    if(!data||data.length<size)break;
    from+=size;
  }
  return out;

function searchableTopic(t){
  let stories=linksForTopic(t.id).map(l=>story(l.story_id)).filter(Boolean);
  return norm([t.name,t.description,t.category,t.core_truth,...arr(t.keywords),...arr(t.youth_scenarios),...stories.flatMap(s=>[s.title,s.reference,s.summary,s.tension,s.takeaway,...arr(s.youth_applications)])].join(' '));
}

function render(){

function bindAuth(){
  let mode='login';
  $$('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;$$('[data-mode]').forEach(x=>x.classList.toggle('on',x===b));$('.name').hidden=mode!=='signup';$('#authbtn').textContent=mode==='signup'?'Crear cuenta':'Entrar'});
  $('#auth').onsubmit=async e=>{e.preventDefault();let email=$('#email').value.trim(),password=$('#pass').value,name=$('#name').value.trim(),m=$('#msg');m.textContent='Procesando…';let r=mode==='signup'?await db.auth.signUp({email,password,options:{data:{display_name:name||email.split('@')[0]}}}):await db.auth.signInWithPassword({email,password});if(r.error){m.textContent=r.error.message;return}m.textContent=mode==='signup'&&!r.data.session?'Cuenta creada. Revisá tu email para confirmarla.':'Listo.'}

function capture(){if(!$('#title'))return;S.edit.title=$('#title').value.trim();S.edit.subtitle=$('#subtitle').value.trim();S.edit.topic=$('#topic').value;S.edit.text=sermonEditor?.get().text||$('#text').value}
function bind(){
  $$('[data-nav]').forEach(b=>b.onclick=()=>{if(S.tab==='create')capture();S.tab=b.dataset.nav;render();scrollTo(0,0)});
  $('#theme')?.addEventListener('click',toggle);$('#theme2')?.addEventListener('click',toggle);
  $$('[data-group]').forEach(b=>b.onclick=()=>{S.group=b.dataset.group;render()});
  $$('[data-topic]').forEach(b=>b.onclick=()=>openTopic(b.dataset.topic));
  $$('[data-quick]').forEach(b=>b.onclick=()=>{S.q=b.dataset.quick;S.group='Todos';render()});
  $('#search')?.addEventListener('submit',e=>{e.preventDefault();S.q=$('#q').value;render()});
  $('#books')?.addEventListener('click',openBooks);
  $('#random')?.addEventListener('click',()=>{let s=S.stories[Math.floor(Math.random()*S.stories.length)],l=S.links.find(x=>x.story_id===s.id),t=S.topics.find(x=>x.id===l?.topic_id);if(t)openTopic(t.slug,s.id)});
  $$('[data-style]').forEach(b=>b.onclick=()=>{capture();S.edit.style=b.dataset.style;render()});
  if($('#text')&&window.TNTEditor){sermonEditor=TNTEditor.attach($('#text'));sermonEditor.area.addEventListener('input',()=>{capture();$('#pv').innerHTML=preview(S.edit);try{localStorage.setItem('tnt-glosario-draft',JSON.stringify(S.edit))}catch{}})}
  ['title','subtitle','topic'].forEach(id=>$('#'+id)?.addEventListener('input',()=>{capture();$('#pv').innerHTML=preview(S.edit)}));
  $('#file')?.addEventListener('change',filePick);
  $$('[data-save]').forEach(b=>b.onclick=()=>save(b.dataset.save));
  $('#export')?.addEventListener('click',()=>{capture();download(buildHtml(S.edit),S.edit.title||'predica-tnt')});
  $$('[data-filter]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.filter;render()});
  $$('[data-sermon]').forEach(c=>c.onclick=()=>openSermon(c.dataset.sermon));
  $$('[data-font]').forEach(b=>b.onclick=()=>{S.font=+b.dataset.font;localStorage.setItem('tnt-font',S.font);render()});
  $('#logout')?.addEventListener('click',()=>db.auth.signOut());
}
function toggle(){S.theme=S.theme==='dark'?'light':'dark';localStorage.setItem('tnt-theme',S.theme);render()}

async function filePick(e){
  let f=e.target.files[0];if(!f)return;if(f.size>10485760){toast('El archivo puede pesar hasta 10 MB.');return;}S.edit.file=f;S.edit.source_filename=f.name;let ext=f.name.split('.').pop().toLowerCase();S.edit.source_type=ext;
  try{
    if(['txt','md'].includes(ext))S.edit.text=await f.text();
    else if(ext==='docx'){await importLibrary('mammoth','https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js');S.edit.text=(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value.trim();}
    else if(ext==='pdf'){await importLibrary('pdfjsLib','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise,out=[];for(let i=1;i<=pdf.numPages;i++){let c=await(await pdf.getPage(i)).getTextContent();out.push(c.items.map(x=>x.str).join(' '))}S.edit.text=out.join('\n\n')}
    else toast('DOC antiguo: guardo el archivo, pero pegá el texto para conservarlo exacto.');
    toast('Archivo cargado ✓')
  }catch{toast('No pude extraer ese archivo. Podés pegar el texto manualmente.')}
  render()
}
async function save(status){
  if(S.saving)return;
  capture();if(!S.edit.text.trim())return toast('Falta el contenido de la prédica.');if(status==='published'&&S.edit.status==='draft')return toast('Primero finalizá la prédica.');if(!S.edit.title)S.edit.title='Sin título';
  S.saving=true;document.querySelectorAll('[data-save]').forEach(b=>b.disabled=true);try{
  let tid=topic(S.edit.topic)?.id||null,now=new Date().toISOString(),row={author_id:S.session.user.id,title:S.edit.title,subtitle:S.edit.subtitle,topic_id:tid,status,original_text:S.edit.text,source_type:S.edit.source_type||'text',source_filename:S.edit.source_filename,visual_style:S.edit.style,visual_variant:1,generated_html:buildHtml(S.edit),updated_at:now,finalized_at:status!=='draft'?(S.edit.finalized_at||now):null,published_at:status==='published'?now:null};
  let r=S.edit.id?await db.from('sermons').update(row).eq('id',S.edit.id).select().single():await db.from('sermons').insert(row).select().single();
  if(r.error)return toast('Error: '+r.error.message);
  S.edit.id=r.data.id;S.edit.status=status;S.edit.finalized_at=r.data.finalized_at;
  if(S.edit.file){let safe=S.edit.file.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]/g,'-'),path=`${S.session.user.id}/${S.edit.id}/${Date.now()}-${safe}`,up=await db.storage.from('sermon-files').upload(path,S.edit.file);if(up.error)throw new Error('La prédica quedó guardada, pero falta subir el archivo: '+up.error.message);const meta=await db.from('sermon_files').insert({sermon_id:S.edit.id,uploader_id:S.session.user.id,storage_path:path,original_name:S.edit.file.name,mime_type:S.edit.file.type,size_bytes:S.edit.file.size});if(meta.error){await db.storage.from('sermon-files').remove([path]);throw new Error('La prédica quedó guardada, pero no se pudo vincular el archivo. Reintentá.')}S.edit.file=null}
  toast(status==='published'?'Publicada para TNT ✓':status==='finalized'?'Prédica finalizada ✓':'Borrador guardado ✓');await load();S.tab='create';render()
  }catch(error){toast(error.message||'No se pudo guardar. Tu contenido sigue acá.')}finally{S.saving=false;document.querySelectorAll('[data-save]').forEach(b=>b.disabled=b.dataset.save==='published'&&S.edit.status==='draft')}
}

function openTopic(slug,focus){

  TNTUI.trackOverlay($('#modal'));
  $('#close').onclick=()=>TNTUI.closeModal($('#modal'));$('#modal').onclick=e=>{if(e.target.id==='modal')TNTUI.closeModal(e.currentTarget)};
  $$('[data-tview]',$('#modal')).forEach(b=>b.onclick=()=>{$$('[data-tview]',$('#modal')).forEach(x=>x.classList.toggle('on',x===b));$('#tstories').hidden=b.dataset.tview!=='stories';$('#tguide').hidden=b.dataset.tview!=='guide'});
  $('#sq').oninput=e=>{let q=norm(e.target.value);$$('.story',$('#storylist')).forEach(x=>x.hidden=q&&!norm(x.innerText).includes(q))};
  bindStoryExpand($('#storylist'));
  $('#use').onclick=()=>{S.edit=fresh();S.edit.topic=slug;S.tab='create';TNTUI.closeModal($('#modal'));render();scrollTo(0,0)};
  if(focus)setTimeout(()=>{let el=document.querySelector(`[data-story-id="${focus}"]`);el?.scrollIntoView({behavior:'smooth',block:'start'});el?.querySelector('[data-expand]')?.click()},100)
}
function bookStoryCount(id){return S.stories.filter(s=>s.book_start===id).length}
function openBooks(){
  let ot=S.books.filter(b=>b.testament==='OT'),nt=S.books.filter(b=>b.testament==='NT'),block=(title,a)=>`<div class="section"><h2>${title}</h2><span>${a.length} libros</span></div><div class="book-grid">${a.map(b=>`<button class="book" data-book="${b.id}"><b>${esc(b.name)}</b><small>${esc(b.category)}</small><em>${bookStoryCount(b.id)} rutas</em></button>`).join('')}</div>`;
  document.body.insertAdjacentHTML('beforeend',`<div class="back" id="bm"><section class="sheet"><div class="sheethead"><div><div class="eyebrow">Cobertura bíblica</div><h2>📚 Los 66 libros</h2><p class="muted">Cada libro tiene rutas cargadas. Abrí una para entrar a sus fichas profundas.</p></div><button class="icon" id="bmx">×</button></div>${block('Antiguo Testamento',ot)}${block('Nuevo Testamento',nt)}</section></div>`);
  TNTUI.trackOverlay($('#bm'));
  $('#bmx').onclick=()=>TNTUI.closeModal($('#bm'));$$('[data-book]',$('#bm')).forEach(x=>x.onclick=()=>{let id=+x.dataset.book;openBook(id)})
}
function openBook(id){
  let b=S.books.find(x=>x.id===id),a=S.stories.filter(s=>s.book_start===id);
  document.body.insertAdjacentHTML('beforeend',`<div class="back" id="bd"><section class="sheet"><div class="sheethead"><div><div class="eyebrow">${esc(b.category)} · ${b.testament==='OT'?'Antiguo':'Nuevo'} Testamento</div><h2>${esc(b.name)}</h2><p class="muted">${a.length} rutas profundas cargadas</p></div><button class="icon" id="bdx">×</button></div><input class="story-search" id="bq" placeholder="Buscar dentro de ${esc(b.name)}…"><div id="bookstories">${a.map(s=>storyCard(s,null)).join('')}</div></section></div>`);
  TNTUI.trackOverlay($('#bd'));
  $('#bdx').onclick=()=>TNTUI.closeModal($('#bd'));$('#bq').oninput=e=>{let q=norm(e.target.value);$$('.story',$('#bookstories')).forEach(x=>x.hidden=q&&!norm(x.innerText).includes(q))};bindStoryExpand($('#bookstories'))
}
function openSermon(id){
  let s=S.sermons.find(x=>x.id===id),own=s.author_id===S.session.user.id,t=S.topics.find(x=>x.id===s.topic_id);
  document.body.insertAdjacentHTML('beforeend',`<div class="back" id="sm"><section class="sheet"><div class="sheethead"><div><span class="badge ${s.status}">${statusN[s.status]}</span><h2>${esc(s.title)}</h2><p class="muted">${t?`${t.icon||'✦'} ${esc(t.name)}`:'Sin tema'}</p></div><button class="icon" id="sx">×</button></div>${preview({title:s.title,subtitle:s.subtitle,text:s.original_text,style:s.visual_style,topic:t?.slug})}${own?`<div class="actions"><button class="btn" id="edit">Editar</button><button class="btn" id="exp">Exportar HTML</button>${s.status==='finalized'?'<button class="primary wide" id="pub">Publicar</button>':''}</div>`:''}</section></div>`);
  TNTUI.trackOverlay($('#sm'));
  $('#sx').onclick=()=>TNTUI.closeModal($('#sm'));
  if(own){$('#edit').onclick=()=>{S.edit={id:s.id,title:s.title||'',subtitle:s.subtitle||'',topic:t?.slug||'',text:s.original_text||'',style:s.visual_style||'modern',status:s.status,file:null,source_type:s.source_type,source_filename:s.source_filename,finalized_at:s.finalized_at};S.tab='create';TNTUI.closeModal($('#sm'));render()};$('#exp').onclick=()=>download(s.generated_html||buildHtml({title:s.title,subtitle:s.subtitle,text:s.original_text,style:s.visual_style,topic:t?.slug}),s.title);$('#pub')?.addEventListener('click',()=>{S.edit={id:s.id,title:s.title,subtitle:s.subtitle||'',topic:t?.slug||'',text:s.original_text,style:s.visual_style||'modern',status:s.status,file:null,source_type:s.source_type,source_filename:s.source_filename,finalized_at:s.finalized_at};TNTUI.closeModal($('#sm'));save('published')})}
}

function buildHtml(e){
  let t=topic(e.topic),title=esc(e.title||'Prédica TNT'),sub=esc(e.subtitle||''),body=esc(e.text||'').replace(/\n/g,'<br>'),modern=e.style==='modern';
  return`<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${title}</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:${modern?'#0d1118':'#eee8dc'};font:16px/1.7 Arial;color:#171717}.p{max-width:850px;margin:auto;border-radius:28px;overflow:hidden;background:${e.style==='friendly'?'#fff3e9':e.style==='ancient'?'#efe2c7':'#fff'};box-shadow:0 20px 60px #0002}.h,.b{padding:clamp(28px,7vw,70px)}.h{${modern?'background:#10131a;color:white;':''}}h1{font-size:clamp(2.6rem,8vw,5.5rem);line-height:.96;letter-spacing:-.05em;margin:8px 0}.k{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;opacity:.6}.s{opacity:.7}</style><link rel="stylesheet" href="/assets/tnt-identity.css?v=1"></head><body><main class="p"><header class="h"><div class="k">TNT · ${esc(t?.name||'Mensaje')}</div><h1>${title}</h1>${sub?`<div class="s">${sub}</div>`:''}</header><div class="b">${body}</div></main></body></html>`
}
function download(html,name){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));a.download=(name||'predica-tnt').replace(/[^a-z0-9áéíóúñ _-]/gi,'').trim().replace(/\s+/g,'-')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),700)}

let glossaryLiveTimer;
document.addEventListener('tnt:data',event=>{
 if(!(event.detail?.tables||[]).some(t=>['sermons','topics','sermon_files'].includes(t)))return;
 clearTimeout(glossaryLiveTimer);glossaryLiveTimer=setTimeout(async()=>{
  if(TNT.blocked||!S.session)return;
  // El borrador sigue en pantalla mientras la biblioteca se actualiza.
  const editing=S.tab==='create',draft=S.edit;
  if(editing){try{const r=await db.from('sermons').select('*').order('updated_at',{ascending:false});if(!r.error)S.sermons=r.data||[];}catch{}S.edit=draft;}
  else await load({live:true});
 },180);
});
init();
</script>

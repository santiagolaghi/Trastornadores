<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TNT · Trastornadores</title></head><body style="margin:0;background:#0b0d12;color:white;font-family:system-ui"><div id="boot" style="min-height:100vh;display:grid;place-items:center">Cargando TNT…</div><script>Promise.all(['c0.txt','c1.txt','c2.txt','c3.txt','c4.txt','c5.txt'].map(x=>fetch(x).then(r=>{if(!r.ok)throw Error(x);return r.text()}))).then(a=>{let z=atob(a.join('').trim()),u=new Uint8Array(z.length);for(let i=0;i<z.length;i++)u[i]=z.charCodeAt(i);let h=new TextDecoder().decode(u);document.open();document.write(h);document.close()}).catch(e=>{document.getElementById('boot').textContent='No se pudo cargar TNT. Recargá la página.';console.error(e)})</script></body></html>

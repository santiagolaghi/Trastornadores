<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TNT · Administración</title><link rel="stylesheet" href="/assets/tnt-ui.css?v=10"><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--tnt-bg);color:var(--tnt-text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}.page{width:min(1080px,100%);margin:auto;padding:18px 16px 100px}.hero{display:flex;align-items:end;justify-content:space-between;gap:16px}.hero h1{font-size:36px;line-height:.95;letter-spacing:-.055em;margin:5px 0}.hero p{color:var(--tnt-muted);font-size:10px;max-width:600px}.tabs{display:flex;gap:7px;overflow:auto;margin:18px 0}.tabs button{height:38px;border:1px solid var(--tnt-line);border-radius:999px;background:var(--tnt-panel);color:var(--tnt-muted);padding:0 13px;font-size:9px;font-weight:900;white-space:nowrap}.tabs button.on{background:var(--tnt-text);color:var(--tnt-bg)}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar input{flex:1;height:44px;border:1px solid var(--tnt-line);background:var(--tnt-panel);border-radius:13px;color:var(--tnt-text);padding:0 12px;outline:0}.card{border:1px solid var(--tnt-line);background:var(--tnt-panel);border-radius:18px;padding:13px}.users{display:grid;gap:9px}.user{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}.user .av{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#ff6a35,#7c6cff);display:grid;place-items:center;font-weight:900;color:#fff;overflow:hidden}.user .av img{width:100%;height:100%;object-fit:cover}.user h3{font-size:12px;margin:0}.user p{font-size:8px;color:var(--tnt-muted);margin:3px 0}.btn{height:38px;border:1px solid var(--tnt-line);border-radius:11px;background:var(--tnt-panel2);color:var(--tnt-text);padding:0 11px;font-size:9px;font-weight:900}.btn.primary{background:var(--tnt-accent);border-color:var(--tnt-accent);color:#fff}.btn.danger{color:var(--tnt-bad)}.grid2{display:grid;gap:10px}.req{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.req b{font-size:11px}.req small{display:block;font-size:8px;color:var(--tnt-muted);margin-top:3px}.req .acts{display:flex;gap:5px}.audit{display:grid;gap:7px}.audit .card b{font-size:10px}.audit .card p{font-size:8px;color:var(--tnt-muted);margin:4px 0}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:8px;text-transform:uppercase;color:var(--tnt-muted);font-weight:900;letter-spacing:.08em}.field input,.field select{height:44px;border:1px solid var(--tnt-line);background:var(--tnt-panel2);color:var(--tnt-text);border-radius:12px;padding:0 10px}.perm{display:grid;grid-template-columns:1fr 110px 38px;gap:7px;align-items:center;margin:7px 0}.perm small{display:block;color:var(--tnt-muted);font-size:8px}.perm select{height:38px;border-radius:10px;border:1px solid var(--tnt-line);background:var(--tnt-panel2);color:var(--tnt-text);padding:0 7px;font-size:9px}.perm button{height:38px;border:1px solid var(--tnt-line);border-radius:10px;background:var(--tnt-panel2);color:var(--tnt-bad)}.setting{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.setting b{font-size:11px}.setting p{font-size:8px;color:var(--tnt-muted);margin:3px 0}.switch{width:52px;height:30px;border:0;border-radius:999px;background:#343946;position:relative}.switch:after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;left:3px;top:3px;transition:.2s}.switch.on{background:var(--tnt-good)}.switch.on:after{left:25px}@media(min-width:780px){.grid2{grid-template-columns:1fr 1fr}}
</style></head><body data-tnt-module="admin" data-tnt-label="Administración"><main class="page"><section class="hero"><div><div class="tnt-pill">SOLO ADMIN</div><h1>Administración TNT</h1><p>Usuarios, roles, accesos por módulo y subárea, solicitudes, configuración general y auditoría.</p></div><button class="btn" id="refresh">↻ Actualizar</button></section><nav class="tabs" id="tabs"><button class="on" data-tab="users">Usuarios</button><button data-tab="modules">Por módulo</button><button data-tab="requests">Solicitudes</button><button data-tab="trash">Papelera</button><button data-tab="settings">Configuración</button><button data-tab="audit">Auditoría</button></nav><div id="view"></div></main><script src="/supabase-lite.js?v=3"></script><script src="/assets/tnt-core.js?v=10" data-module="admin" data-label="Administración TNT"></script><script>
const view=document.getElementById('view'),sb=TNT.sb;let tab='users',people=[],accounts=[],grants=[],requests=[],settings=[],audit=[],trash=[];const MODULE_SCOPES={organizacion:[['*','Organización']],efe:[['varones','EFE Varones'],['mujeres18','EFE Mujeres +18'],['mujeres12_14','EFE Mujeres 12–14'],['mujeres15_17','EFE Mujeres 15–17']], 'lista-sabados':[['*','Lista Sábados']],campamento:[['*','Campamento']],glosario:[['*','Prédicas & Glosario']],buffet:[['*','Buffet']],chat:[['*','Chat TNT']]};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function initials(n){return String(n||'?').split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
async function load(){await TNT.ready;if(!TNT.isAdmin){view.innerHTML='<div class="card"><b>Acceso restringido.</b></div>';return}const [p,a,g,r,s,l,tr]=await Promise.all([sb.from('tnt_people').select('*').order('full_name'),sb.from('tnt_accounts').select('*'),sb.from('tnt_access_grants').select('*'),sb.from('tnt_access_requests').select('*').order('created_at',{ascending:false}),sb.from('tnt_settings').select('*'),sb.from('tnt_audit_log').select('*').order('created_at',{ascending:false}).limit(100),sb.from('tnt_trash').select('*').order('deleted_at',{ascending:false})]);people=p.data||[];accounts=a.data||[];grants=g.data||[];requests=r.data||[];settings=s.data||[];audit=l.data||[];trash=tr.data||[];render()}
function acct(pid){return accounts.find(x=>x.person_id===pid)||{person_id:pid,ministry_role:'Timoteo',system_role:'user',enabled:true}}function person(pid){return people.find(x=>x.id===pid)||{full_name:'Usuario TNT'}}function av(p,a){return a.avatar_url?`<img src="${esc(a.avatar_url)}">`:esc(initials(p.full_name))}
function render(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));if(tab==='users')usersView();if(tab==='modules')modulesView();if(tab==='requests')requestsView();if(tab==='trash')trashView();if(tab==='settings')settingsView();if(tab==='audit')auditView()}
function usersView(){view.innerHTML=`<div class="toolbar"><input id="search" placeholder="Buscar por nombre o email…"></div><div class="users" id="users">${people.map(userCard).join('')}</div>`;document.getElementById('search').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('[data-user-card]').forEach(c=>c.hidden=!c.dataset.search.includes(q))};document.querySelectorAll('[data-manage]').forEach(b=>b.onclick=()=>manageUser(b.dataset.manage))}
function userCard(p){const a=acct(p.id);return `<article class="card user" data-user-card data-search="${esc((p.full_name+' '+(a.email||'')).toLowerCase())}"><div class="av">${av(p,a)}</div><div><h3>${esc(a.nickname||p.full_name)}</h3><p>${esc(a.email||'Sin cuenta vinculada')}</p><span class="tnt-pill ${a.system_role==='admin'?'good':''}">${a.system_role==='admin'?'ADMIN':'USUARIO'}</span> <span class="tnt-pill">${esc(a.ministry_role||'Timoteo')}</span> ${a.enabled===false?'<span class="tnt-pill bad">DESHABILITADO</span>':''}</div><button class="btn" data-manage="${p.id}">Gestionar</button></article>`}
function manageUser(pid){const p=person(pid),a=acct(pid),ug=grants.filter(x=>x.person_id===pid);const perms=Object.entries(MODULE_SCOPES).flatMap(([m,ss])=>ss.map(([scope,label])=>{const g=ug.find(x=>x.module===m&&x.scope===scope);return `<div class="perm"><div><b>${esc(label)}</b><small>${m}${scope!=='*'?' · '+scope:''}</small></div><select data-perm data-module="${m}" data-scope="${scope}"><option value="none" ${!g||!g.enabled?'selected':''}>Sin acceso</option><option value="view" ${g?.enabled&&g.access_level==='view'?'selected':''}>Solo ver</option><option value="edit" ${g?.enabled&&g.access_level==='edit'?'selected':''}>Editar</option><option value="manage" ${g?.enabled&&g.access_level==='manage'?'selected':''}>Administrar</option></select><button data-clear="${m}|${scope}">×</button></div>`})).join('');const s=TNT.sheet('Gestionar usuario',`<div class="tnt-profile-head"><span class="tnt-avatar fallback">${esc(initials(p.full_name))}</span><div><b>${esc(a.nickname||p.full_name)}</b><small>${esc(a.email||'Sin login')}</small></div></div><div class="grid2"><div class="field"><label>Rol TNT</label><select id="role"><option>Pastor/a</option><option>Colaborador</option><option>Líder</option><option>Timoteo</option></select></div><div class="field"><label>Estado</label><select id="enabled"><option value="1">Habilitado</option><option value="0">Deshabilitado</option></select></div></div><div style="display:flex;gap:7px;margin:8px 0"><button class="btn ${a.system_role==='admin'?'danger':'primary'}" id="adminToggle">${a.system_role==='admin'?'Quitar Admin':'Dar Admin'}</button></div><h4>Accesos</h4>${perms}<div class="field"><label>Vencimiento del próximo permiso (opcional)</label><input id="until" type="date"></div>`);document.getElementById('role').value=a.ministry_role||'Timoteo';document.getElementById('enabled').value=a.enabled===false?'0':'1';document.getElementById('role').onchange=async e=>{await sb.from('tnt_accounts').update({ministry_role:e.target.value}).eq('person_id',pid);await load()};document.getElementById('enabled').onchange=async e=>{await sb.from('tnt_accounts').update({enabled:e.target.value==='1'}).eq('person_id',pid);await load()};document.getElementById('adminToggle').onclick=async()=>{const r=await sb.rpc('tnt_set_admin',{p_person:pid,p_make_admin:a.system_role!=='admin'});if(r.error)alert(r.error.message);else{document.querySelector('.tnt-overlay')?.remove();await load()}};document.querySelectorAll('[data-perm]',s).forEach(sel=>sel.onchange=async()=>{const mod=sel.dataset.module,scope=sel.dataset.scope,val=sel.value,until=document.getElementById('until').value||null;if(val==='none'){await sb.from('tnt_access_grants').delete().eq('person_id',pid).eq('module',mod).eq('scope',scope)}else{await sb.from('tnt_access_grants').upsert({person_id:pid,module:mod,scope,access_level:val,enabled:true,valid_until:until?until+'T23:59:59Z':null,granted_by:TNT.person.id},{onConflict:'person_id,module,scope'}).select('*')}await load()});document.querySelectorAll('[data-clear]',s).forEach(b=>b.onclick=async()=>{const [m,sc]=b.dataset.clear.split('|');await sb.from('tnt_access_grants').delete().eq('person_id',pid).eq('module',m).eq('scope',sc);document.querySelector('.tnt-overlay')?.remove();await load()})}
function modulesView(){const rows=[];for(const [mod,scopes] of Object.entries(MODULE_SCOPES)){for(const [scope,label] of scopes){const gs=grants.filter(g=>g.module===mod&&g.scope===scope&&g.enabled);rows.push('<article class="card"><b style="font-size:12px">'+esc(label)+'</b><p style="font-size:8px;color:var(--tnt-muted)">'+gs.length+' usuarios autorizados</p><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:8px">'+(gs.length?gs.map(g=>{const p=person(g.person_id),a=acct(g.person_id);return '<span class="tnt-pill">'+esc(a.nickname||p.full_name)+' · '+esc(g.access_level)+'</span>'}).join(''):'<span class="tnt-pill warn">Sin usuarios</span>')+'</div></article>'}}</div>;view.innerHTML='<div class="grid2">'+rows.join('')+'</div>'}
function trashView(){view.innerHTML='<div class="grid2">'+(trash.length?trash.map(x=>'<article class="card"><b style="font-size:11px">'+esc(x.label||x.entity_type)+'</b><p style="font-size:8px;color:var(--tnt-muted)">Eliminado '+new Date(x.deleted_at).toLocaleString('es-AR')+' · recuperable hasta '+new Date(x.restore_until).toLocaleDateString('es-AR')+'</p><span class="tnt-pill">'+esc(x.entity_type)+'</span></article>').join(''):'<div class="card"><b>La papelera está vacía.</b></div>')+'</div>'}
function requestsView(){const pend=requests.filter(x=>x.status==='pending');view.innerHTML=`<div class="grid2">${pend.length?pend.map(r=>{const p=person(r.person_id);return `<article class="card req"><div><b>${esc(p.full_name)}</b><small>${esc(r.module)} · ${esc(r.scope)} · solicita ${esc(r.requested_level)}</small><small>${esc(r.note||'')}</small></div><div class="acts"><button class="btn primary" data-approve="${r.id}">✓</button><button class="btn danger" data-reject="${r.id}">×</button></div></article>`}).join(''):'<div class="card"><b>No hay solicitudes pendientes.</b></div>'}</div>`;document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>review(b.dataset.approve,true));document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>review(b.dataset.reject,false))}
async function review(id,ok){const r=requests.find(x=>x.id===id);if(ok)await sb.from('tnt_access_grants').upsert({person_id:r.person_id,module:r.module,scope:r.scope,access_level:r.requested_level,enabled:true,granted_by:TNT.person.id},{onConflict:'person_id,module,scope'}).select('*');await sb.from('tnt_access_requests').update({status:ok?'approved':'rejected',reviewed_by:TNT.person.id,reviewed_at:new Date().toISOString()}).eq('id',id);await load()}
function settingsView(){const row=settings.find(x=>x.key==='organization_defaults'),v=row?.value||{};view.innerHTML=`<div class="grid2"><article class="card setting"><div><b>Sábados TNT automáticos</b><p>Genera/propone sábados predeterminados en Organización.</p></div><button class="switch ${v.auto_saturdays!==false?'on':''}" id="auto"></button></article><article class="card"><div class="field"><label>Hora predeterminada</label><input id="satTime" type="time" value="${esc(v.saturday_start||'18:30')}"></div><div class="field"><label>Actividades predeterminadas (separadas por coma)</label><input id="acts" value="${esc((v.default_activities||[]).join(', '))}"></div><button class="btn primary" id="saveSet">Guardar configuración</button></article></div>`;document.getElementById('auto').onclick=async e=>{v.auto_saturdays=!(v.auto_saturdays!==false);await saveSettings(v)};document.getElementById('saveSet').onclick=async()=>{v.saturday_start=document.getElementById('satTime').value||'18:30';v.default_activities=document.getElementById('acts').value.split(',').map(x=>x.trim()).filter(Boolean);await saveSettings(v)}}
async function saveSettings(v){await sb.from('tnt_settings').upsert({key:'organization_defaults',value:v,updated_by:TNT.person.id},{onConflict:'key'}).select('*');await load()}
function auditView(){view.innerHTML=`<div class="audit">${audit.length?audit.map(x=>`<article class="card"><b>${esc(x.action)} · ${esc(x.entity_type)}</b><p>${new Date(x.created_at).toLocaleString('es-AR')}</p><p>${esc(JSON.stringify(x.details||{}).slice(0,180))}</p></article>`).join(''):'<div class="card">Todavía no hay movimientos.</div>'}</div>`}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.getElementById('refresh').onclick=load;document.addEventListener('tnt:ready',load,{once:true});setTimeout(()=>TNT.identity&&load(),300);
</script></body></html>

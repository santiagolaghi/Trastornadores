<body data-tnt-module="buffet" data-tnt-label="Buffet">

  <script src="/supabase-lite.js?v=12"></script><script src="/assets/tnt-components.js?v=14"></script><script src="/assets/tnt-core.js?v=14" data-module="buffet" data-label="Buffet"></script><script type="module">
const {createClient}=window.supabase;

const SUPABASE_URL='https://lcrbhzfijumbvhmtunqv.supabase.co';
const SUPABASE_KEY='sb_publishable_GKRoh5nt4lCoG0ZZYA_jdA_TnFEbdWe';
const $=s=>document.querySelector(s);
const app=$('#app'), toastEl=$('#toast'), alertEl=$('#order-alert');
const money=n=>'$'+Math.round(Number(n)||0).toLocaleString('es-AR');
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const localDate=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fmtTime=s=>s?new Date(s).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}):'';

let db=null, channel=null, topic='';
let state={name:localStorage.getItem('tnt_name')||'',role:localStorage.getItem('tnt_role')||'cashier',tab:'sale',shift:null,menu:[],products:[],cart:[],orders:[],sales:[],expenses:[],debts:[],closure:null,pay:'cash',alert:null};

function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.classList.remove('show'),2500)}
function errMsg(e){return e?.message?.replace(/^.*?: /,'')||'Ocurrió un error'}
function setBusy(btn,on,label='Procesando…'){if(!btn)return;btn.disabled=on;if(on){btn.dataset.old=btn.textContent;btn.textContent=label}else if(btn.dataset.old){btn.textContent=btn.dataset.old}}
function clientFor(){return createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}})}

async function connectApp(){
  db=clientFor();
  const {data,error}=await db.from('tnt_settings').select('key,value').limit(10);
  if(error) throw error;
  topic=data?.find(x=>x.key==='realtime_topic')?.value||'';
}

function loginView(msg=''){
  app.innerHTML=`<div class="login"><div class="loginbox"><div class="loginlogo">💣</div><h1>TNT Buffet</h1><p>Tu Cuenta TNT ya está conectada. Elegí cómo vas a trabajar en este dispositivo.</p>${msg?`<div class="card negative">${esc(msg)}</div>`:''}<form id="login-form"><div class="field"><label>Tu nombre</label><input class="input" id="login-name" readonly value="${esc(state.name)}" placeholder="Ej: Santi" autocomplete="name" required></div><label class="muted" style="font-size:12px;font-weight:800">¿QUÉ HACE ESTE CELU?</label><div class="roles"><button type="button" class="role ${state.role==='cashier'?'sel':''}" data-role="cashier">🧾<br>Caja</button><button type="button" class="role ${state.role==='kitchen'?'sel':''}" data-role="kitchen">👨‍🍳<br>Preparación</button></div><button class="btn full" type="submit">Entrar</button></form></div></div>`;
  app.querySelectorAll('.role').forEach(b=>b.onclick=()=>{state.role=b.dataset.role;app.querySelectorAll('.role').forEach(x=>x.classList.toggle('sel',x===b))});
  $('#login-form').onsubmit=async e=>{e.preventDefault();const b=e.submitter;setBusy(b,true,'Conectando…');state.name=$('#login-name').value.trim();try{await connectApp();localStorage.setItem('tnt_name',state.name);localStorage.removeItem('tnt_key');localStorage.setItem('tnt_role',state.role);state.tab=state.role==='kitchen'?'kitchen':'sale';await boot()}catch(x){loginView(errMsg(x))}};
}

async function boot(){
  renderShell();
  await refreshAll();
  connectRealtime();
  
}

function renderShell(){
  const prep=state.role==='kitchen';
  app.innerHTML=`<div class="app ${prep?'prep-app':''}"><header class="top"><div class="toprow"><div class="brand">💣 TNT Buffet<small id="shift-label">SIN JORNADA</small></div><button class="pill role-pill ${prep?'prep-pill':''}" id="role-pill">${prep?'👨‍🍳 PREPARACIÓN':'🧾 CAJA'} · ${esc(state.name)}</button></div></header>${prep?`<div class="prep-strip"><span class="prep-dot"></span><b>MODO PREPARACIÓN</b><small>Este celular recibe las órdenes nuevas en pantalla completa.</small></div>`:''}<main class="content" id="screen"></main><nav class="nav ${prep?'prep-nav':''}">${prep?`<button data-tab="kitchen"><b>👨‍🍳</b>Órdenes de preparación</button>`:`<button data-tab="sale"><b>🛒</b>Vender</button><button data-tab="kitchen"><b>👨‍🍳</b>Órdenes</button><button data-tab="menu"><b>🍽️</b>Menú</button><button data-tab="cash"><b>💰</b>Caja</button>`}</nav></div>`;
  document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});
  $('#role-pill').onclick=()=>{const next=state.role==='kitchen'?'cashier':'kitchen';state.role=next;localStorage.setItem('tnt_role',next);state.tab=next==='kitchen'?'kitchen':'sale';renderShell();render();};
}

async function refreshAll(){
  await loadShift();
  await Promise.all([loadProducts(),loadMenu(),loadOrders(),loadSales(),loadExpenses(),loadDebts(),loadClosure()]);
  render();
}
async function loadShift(){const d=localDate();const {data,error}=await db.from('tnt_shifts').select('*').eq('shift_date',d).maybeSingle();if(error)throw error;state.shift=data}

function connectRealtime(){
  if(channel) db.removeChannel(channel);
  if(!topic)return;
  channel=db.channel(topic,{config:{broadcast:{self:true}}})
    .on('broadcast',{event:'order:insert'},async p=>{await loadOrders();const o=p.payload?.payload||p.payload;if(state.role==='kitchen'&&o?.status==='new')showOrderAlert(o);render()})
    .on('broadcast',{event:'order:update'},async p=>{await loadOrders();const o=p.payload?.payload||p.payload;if(state.role==='kitchen'&&o?.status==='new'&&(!state.alert||state.alert.id!==o.id))showOrderAlert(o);if(state.alert){const current=state.orders.find(x=>x.id===state.alert.id);if(!current||current.status!=='new')hideOrderAlert()}render()})
    .subscribe();

function render(){

  if(state.role==='kitchen') state.tab='kitchen';
  const l=$('#shift-label');if(l)l.textContent=state.shift?`${state.shift.shift_date.split('-').reverse().join('/')} · ${state.shift.status.toUpperCase()}`:'SIN JORNADA';
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));
  if(state.tab==='sale')renderSale();
  else if(state.tab==='kitchen')renderKitchen();

function productCard(m){const p=m.tnt_products;const visual=p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}">`:esc(p.emoji);return `<button class="product" data-id="${m.id}" ${m.remaining_qty<=0?'disabled':''}><div class="pvisual">${visual}</div><div class="pbody"><div class="pname">${esc(p.name)}</div><div class="pmeta"><span class="price">${money(m.price)}</span><span class="stock ${m.remaining_qty<=4?'low':''}">${m.remaining_qty} quedan</span></div></div>${m.remaining_qty<=0?'<div class="soldout">AGOTADO</div>':''}</button>`}

function bindCart(){
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const it=state.cart.find(x=>x.id===b.dataset.id),m=state.menu.find(x=>x.id===b.dataset.id);if(b.dataset.act==='plus'&&it.qty<m.remaining_qty)it.qty++;if(b.dataset.act==='minus'){it.qty--;if(it.qty<=0)state.cart=state.cart.filter(x=>x!==it)}renderSale()});

async function chargeSale(e){const b=e.currentTarget;const customer=$('#customer')?.value.trim()||'',notes=$('#sale-notes')?.value.trim()||'';if(state.pay==='fiado'&&!customer){toast('Poné el nombre del fiado');return}const total=state.cart.reduce((a,x)=>a+Number(state.menu.find(y=>y.id===x.id)?.price||0)*x.qty,0);const received=state.pay==='cash'?Number($('#received')?.value||0):0;if(state.pay==='cash'&&received<total){toast('Falta efectivo');return}setBusy(b,true,'COBRANDO…');try{const {data,error}=await db.rpc('tnt_create_sale',{p_shift_id:state.shift.id,p_customer_name:customer,p_method:state.pay,p_received:received,p_notes:notes,p_cashier:state.name,p_items:state.cart.map(x=>({menu_item_id:x.id,qty:x.qty}))});if(error)throw error;state.cart=[];await Promise.all([loadMenu(),loadSales(),loadOrders(),loadDebts()]);toast(data?.order?`✅ Cobrado · Orden #${data.order.order_no} enviada`:'✅ Cobrado');renderSale()}catch(x){toast(errMsg(x));setBusy(b,false)}}

async function saveMenuRow(row,p,m){const active=row.querySelector('.mi-active').checked,price=Number(row.querySelector('.mi-price').value||0),cost=Number(row.querySelector('.mi-cost').value||0),qty=Math.max(0,Number(row.querySelector('.mi-qty').value||0)),rem=Math.max(0,Number(row.querySelector('.mi-rem').value||qty));try{if(m){const {error}=await db.from('tnt_menu_items').update({price,cost,initial_qty:qty,remaining_qty:rem,active}).eq('id',m.id);if(error)throw error}else if(active){const {error}=await db.from('tnt_menu_items').insert({shift_id:state.shift.id,product_id:p.id,price,cost,initial_qty:qty,remaining_qty:qty,active:true,sort_order:state.menu.length});if(error)throw error}await loadMenu();toast('Guardado');renderMenu()}catch(e){toast(errMsg(e))}}
function productModal(p=null){

async function compressPhoto(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=560,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*scale),h=Math.round(img.height*scale),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',.68))};img.src=r.result};r.readAsDataURL(file)})}

const BILL_DENOMS=[20000,10000,2000,1000,500,200,100,50,20,10];
function billStorageKey(){return state.shift?`tnt_billcount_${state.shift.id}`:'tnt_billcount_none'}
function getBillCounts(){try{return JSON.parse(localStorage.getItem(billStorageKey())||'{}')}catch{return {}}}
function saveBillCounts(counts){try{localStorage.setItem(billStorageKey(),JSON.stringify(counts))}catch{}}
function billCountTotal(counts=getBillCounts()){return BILL_DENOMS.reduce((sum,d)=>sum+d*Math.max(0,Number(counts[d]||0)),0)}
function billCounterHtml(){const counts=getBillCounts(),total=billCountTotal(counts);return `<div class="card bill-card"><div class="bill-head"><div><h3>🧮 Contador de billetes</h3><p>Contá la caja tocando + / −. El total pasa solo al cierre.</p></div><div class="bill-total"><small>TOTAL CONTADO</small><strong id="bill-total">${money(total)}</strong></div></div><div class="bill-list">${BILL_DENOMS.map(d=>`<div class="bill-row" data-denom="${d}"><div class="bill-value">${money(d)}</div><div class="bill-stepper"><button type="button" class="bill-minus" aria-label="Restar billete de ${money(d)}">−</button><input class="bill-count" inputmode="numeric" type="number" min="0" step="1" value="${Math.max(0,Number(counts[d]||0))}" aria-label="Cantidad de billetes de ${money(d)}"><button type="button" class="bill-plus" aria-label="Sumar billete de ${money(d)}">+</button></div><div class="bill-subtotal">${money(d*Math.max(0,Number(counts[d]||0)))}</div></div>`).join('')}</div><button type="button" class="btn secondary full" id="clear-bills">Vaciar contador</button></div>`}
function syncBillCounter(){const counts={};document.querySelectorAll('.bill-row').forEach(row=>{const d=Number(row.dataset.denom),input=row.querySelector('.bill-count'),n=Math.max(0,Math.floor(Number(input.value||0)));input.value=n;counts[d]=n;row.querySelector('.bill-subtotal').textContent=money(d*n)});saveBillCounts(counts);const total=billCountTotal(counts),totalEl=$('#bill-total'),counted=$('#counted');if(totalEl)totalEl.textContent=money(total);if(counted)counted.value=total;}
function bindBillCounter(){document.querySelectorAll('.bill-row').forEach(row=>{const input=row.querySelector('.bill-count');row.querySelector('.bill-minus').onclick=()=>{input.value=Math.max(0,Number(input.value||0)-1);syncBillCounter()};row.querySelector('.bill-plus').onclick=()=>{input.value=Math.max(0,Number(input.value||0)+1);syncBillCounter()};input.oninput=syncBillCounter});const clear=$('#clear-bills');if(clear)clear.onclick=()=>{document.querySelectorAll('.bill-count').forEach(i=>i.value=0);syncBillCounter()};syncBillCounter()}

function saleItemsLabel(sale){const items=sale?.tnt_sale_items||[];return items.length?items.map(i=>`${Number(i.qty)>1?`${i.qty}× `:''}${i.product_name}`).join(' + '):'Sin detalle'}
function saleDisplayLabel(sale){return `${(sale.customer_name||'Venta').trim()||'Venta'} - ${saleItemsLabel(sale)}`}

function closeModal(el){if(el?.parentNode)el.remove()}
function deleteSaleModal(sale){
  const wrap=document.createElement('div');wrap.className='modal-backdrop';
  wrap.innerHTML=`<div class="modal-card"><div class="modal-head"><div><h2>🗑️ Borrar venta</h2><p>Esta acción deshace la operación completa.</p></div><button class="modal-x" type="button">×</button></div><div class="danger-box"><strong>${esc(saleDisplayLabel(sale))}</strong><p>${money(sale.total)} · ${esc(sale.method)} · ${fmtTime(sale.created_at)}</p></div><div class="card" style="margin-bottom:14px"><div style="display:flex;gap:10px;align-items:flex-start"><span style="font-size:22px">↩️</span><div><b>Se devuelve el stock automáticamente</b><div class="muted" style="font-size:12px;margin-top:3px">También se elimina la orden de preparación y el fiado asociado, si lo hubiera.</div></div></div></div><div class="btnrow"><button class="btn secondary modal-cancel" type="button">Cancelar</button><button class="btn red modal-confirm" type="button">Sí, borrar venta</button></div></div>`;
  document.body.appendChild(wrap);wrap.querySelector('.modal-x').onclick=wrap.querySelector('.modal-cancel').onclick=()=>closeModal(wrap);wrap.onclick=e=>{if(e.target===wrap)closeModal(wrap)};
  wrap.querySelector('.modal-confirm').onclick=async e=>{const b=e.currentTarget;setBusy(b,true,'Borrando…');const {error}=await db.rpc('tnt_delete_sale',{p_sale_id:sale.id,p_staff:state.name});if(error){toast(errMsg(error));setBusy(b,false);return}closeModal(wrap);await Promise.all([loadMenu(),loadSales(),loadOrders(),loadDebts()]);toast('🗑️ Venta borrada · stock devuelto');renderCash()};
}

async function editSaleModal(sale){
  let saleItems=sale.tnt_sale_items||[];
  if(!saleItems.length){const {data,error}=await db.from('tnt_sale_items').select('*').eq('sale_id',sale.id);if(error){toast(errMsg(error));return}saleItems=data||[]}
  const wrap=document.createElement('div');wrap.className='modal-backdrop';
  const menuOptions=(selected)=>state.menu.map(m=>`<option value="${m.id}" ${m.id===selected?'selected':''}>${esc(m.tnt_products?.emoji||'🍽️')} ${esc(m.tnt_products?.name||'Producto')} · ${money(m.price)}</option>`).join('');
  const lineHtml=(it={})=>{const m=state.menu.find(x=>x.id===it.menu_item_id)||state.menu[0];return `<div class="editor-line"><div class="editor-product-row"><div class="field" style="margin:0"><label>Producto</label><select class="select edit-product">${menuOptions(m?.id)}</select></div><button type="button" class="editor-remove" aria-label="Quitar producto">🗑️</button></div><div class="editor-numbers"><div class="field" style="margin:0"><label>Cantidad</label><input class="input edit-qty" type="number" inputmode="numeric" min="1" step="1" value="${Math.max(1,Number(it.qty||1))}"></div><div class="field" style="margin:0"><label>Precio unitario</label><input class="input edit-price" type="number" inputmode="decimal" min="0" step="1" value="${Number(it.unit_price??m?.price??0)}"></div></div></div>`};
  wrap.innerHTML=`<div class="modal-card"><div class="modal-head"><div><h2>✏️ Editar venta</h2><p>Corregí nombre, artículos, cantidades, precios y forma de pago.</p></div><button class="modal-x" type="button">×</button></div><div class="field"><label>Nombre / para quién</label><input class="input" id="edit-customer" value="${esc(sale.customer_name||'')}" placeholder="Ej: Santi Laghi"></div><div class="field"><label>Quién cobró</label><input class="input" id="edit-cashier" value="${esc(sale.cashier_name||state.name)}"></div><label class="muted" style="font-size:12px;font-weight:850">FORMA DE PAGO</label><div class="method-grid" id="edit-methods"><button type="button" class="method-option ${sale.method==='cash'?'sel':''}" data-method="cash">💵 Efectivo</button><button type="button" class="method-option ${sale.method==='transfer'?'sel':''}" data-method="transfer">📲 Transfer.</button><button type="button" class="method-option ${sale.method==='fiado'?'sel':''}" data-method="fiado">📝 Fiado</button></div><div class="field" id="edit-received-wrap" style="margin-top:10px;${sale.method==='cash'?'':'display:none'}"><label>Efectivo recibido</label><input class="input" id="edit-received" type="number" inputmode="decimal" min="0" value="${Number(sale.received||sale.total||0)}"></div><div class="section-title" style="margin-top:16px"><h2>Productos vendidos</h2><button class="pill" id="edit-add-line" type="button">+ Agregar</button></div><div class="editor-lines" id="edit-lines">${saleItems.map(lineHtml).join('')}</div><div class="editor-total"><span>Total corregido</span><strong id="edit-total">$0</strong></div><div class="field" style="margin-top:10px"><label>Notas</label><textarea class="textarea" id="edit-notes" placeholder="Sin azúcar, calentar, etc.">${esc(sale.notes||'')}</textarea></div><div class="btnrow"><button class="btn secondary modal-cancel" type="button">Cancelar</button><button class="btn green" id="edit-save" type="button">Guardar cambios</button></div></div>`;
  document.body.appendChild(wrap);let method=sale.method;
  const lines=()=>[...wrap.querySelectorAll('.editor-line')];
  const recalc=()=>{let total=0;lines().forEach(line=>{total+=Math.max(1,Number(line.querySelector('.edit-qty').value||1))*Math.max(0,Number(line.querySelector('.edit-price').value||0))});wrap.querySelector('#edit-total').textContent=money(total);if(method==='cash'){const r=wrap.querySelector('#edit-received');if(r&&Number(r.value||0)<total)r.value=total}}
  const bindLine=line=>{const sel=line.querySelector('.edit-product'),price=line.querySelector('.edit-price');sel.onchange=()=>{const m=state.menu.find(x=>x.id===sel.value);if(m)price.value=Number(m.price);recalc()};line.querySelector('.edit-qty').oninput=recalc;price.oninput=recalc;line.querySelector('.editor-remove').onclick=()=>{if(lines().length<=1){toast('La venta necesita al menos un producto');return}line.remove();recalc()}};
  lines().forEach(bindLine);wrap.querySelector('#edit-add-line').onclick=()=>{if(!state.menu.length){toast('No hay productos en el menú');return}const box=document.createElement('div');box.innerHTML=lineHtml({menu_item_id:state.menu[0].id,qty:1,unit_price:state.menu[0].price});const line=box.firstElementChild;wrap.querySelector('#edit-lines').appendChild(line);bindLine(line);recalc()};
  wrap.querySelectorAll('.method-option').forEach(b=>b.onclick=()=>{method=b.dataset.method;wrap.querySelectorAll('.method-option').forEach(x=>x.classList.toggle('sel',x===b));wrap.querySelector('#edit-received-wrap').style.display=method==='cash'?'':'none';recalc()});
  wrap.querySelector('.modal-x').onclick=wrap.querySelector('.modal-cancel').onclick=()=>closeModal(wrap);wrap.onclick=e=>{if(e.target===wrap)closeModal(wrap)};recalc();
  wrap.querySelector('#edit-save').onclick=async e=>{const b=e.currentTarget,customer=wrap.querySelector('#edit-customer').value.trim(),cashier=wrap.querySelector('#edit-cashier').value.trim()||state.name,notes=wrap.querySelector('#edit-notes').value.trim();if(method==='fiado'&&!customer){toast('El fiado necesita nombre');return}const items=lines().map(line=>({menu_item_id:line.querySelector('.edit-product').value,qty:Math.max(1,Math.floor(Number(line.querySelector('.edit-qty').value||1))),unit_price:Math.max(0,Number(line.querySelector('.edit-price').value||0))}));if(!items.length){toast('Agregá al menos un producto');return}const total=items.reduce((a,x)=>a+x.qty*x.unit_price,0),received=method==='cash'?Number(wrap.querySelector('#edit-received').value||0):0;if(method==='cash'&&received<total){toast('El efectivo recibido es menor al total');return}setBusy(b,true,'Guardando…');const {error}=await db.rpc('tnt_update_sale',{p_sale_id:sale.id,p_customer_name:customer,p_method:method,p_received:received,p_notes:notes,p_staff:cashier,p_items:items});if(error){toast(errMsg(error));setBusy(b,false);return}closeModal(wrap);await Promise.all([loadMenu(),loadSales(),loadOrders(),loadDebts()]);toast('✅ Venta corregida');renderCash()};
}

function renderCash(){
  const s=$('#screen');if(!state.shift){s.innerHTML=shiftGate('');bindCreateShift();return}
  const sales=state.sales,exp=state.expenses;const total=sales.reduce((a,x)=>a+Number(x.total),0),cash=sales.filter(x=>x.method==='cash').reduce((a,x)=>a+Number(x.total),0),tr=sales.filter(x=>x.method==='transfer').reduce((a,x)=>a+Number(x.total),0),fiado=sales.filter(x=>x.method==='fiado').reduce((a,x)=>a+Number(x.total),0),expenses=exp.reduce((a,x)=>a+Number(x.amount),0),cost=sales.reduce((a,x)=>a+Number(x.total_cost),0),profit=total-cost-expenses;
  s.innerHTML=`<div class="stats"><div class="stat"><small>Ventas</small><strong>${money(total)}</strong></div><div class="stat"><small>Efectivo</small><strong>${money(cash)}</strong></div><div class="stat"><small>Transfer.</small><strong>${money(tr)}</strong></div><div class="stat"><small>Resultado est.</small><strong class="${profit>=0?'positive':'negative'}">${money(profit)}</strong></div></div>${state.closure?closureHtml():`<div class="card"><h3>💸 Registrar gasto</h3><div class="mini-grid"><div class="field"><label>Concepto</label><input class="input" id="ex-desc" placeholder="Hielo, pan…"></div><div class="field"><label>Monto</label><input class="input" id="ex-amount" type="number" inputmode="decimal"></div><div class="field"><label>Categoría</label><select class="select" id="ex-cat"><option>Mercadería</option><option>Hielo</option><option>Bebidas</option><option>Pan</option><option>Insumos</option><option>Otro</option></select></div><div class="field"><label>Sale de</label><select class="select" id="ex-method"><option value="cash">Efectivo</option><option value="transfer">Transferencia</option></select></div></div><button class="btn red full" id="add-exp">+ Guardar gasto</button></div><div class="card"><h3>📝 Fiados pendientes</h3>${state.debts.length?state.debts.map(d=>`<div class="expense"><div><b>${esc(d.customer_name)}</b><div class="muted">${money(d.amount)}</div></div><div class="btnrow"><button class="pill debtpay" data-id="${d.id}" data-method="cash">💵</button><button class="pill debtpay" data-id="${d.id}" data-method="transfer">📲</button></div></div>`).join(''):'<div class="empty">Sin fiados pendientes 🎉</div>'}</div>${billCounterHtml()}<div class="card"><h3>🔒 Cierre del sábado</h3><p class="muted">Ventas ${money(total)} · Fiado ${money(fiado)} · Gastos ${money(expenses)}</p><div class="field"><label>Efectivo contado</label><input class="input" id="counted" type="number" inputmode="decimal" value="${billCountTotal()}"></div><div class="field"><label>Notas del cierre</label><textarea class="textarea" id="close-notes"></textarea></div><button class="btn full" id="close-shift">Cerrar jornada</button></div>`}<div class="card"><h3>Gastos de hoy</h3>${exp.length?exp.map(x=>`<div class="expense"><span>${esc(x.description)}</span><b class="negative">-${money(x.amount)}</b></div>`).join(''):'<div class="empty">Sin gastos</div>'}</div><div class="card"><h3>Últimas ventas</h3>${sales.slice(0,20).map(x=>`<div class="expense"><div class="sale-main"><div class="sale-title">${esc(saleDisplayLabel(x))}</div><div class="muted sale-meta">${fmtTime(x.created_at)} · ${x.method} · cobró ${esc(x.cashier_name||'')}</div></div><div class="sale-actions"><b>${money(x.total)}</b>${!state.closure?`<button class="icon-btn edit sale-edit" data-id="${x.id}" aria-label="Editar venta">✏️</button><button class="icon-btn delete sale-delete" data-id="${x.id}" aria-label="Borrar venta">🗑️</button>`:''}</div></div>`).join('')||'<div class="empty">Sin ventas</div>'}</div>`;
  bindCash();
}
function closureHtml(){const c=state.closure;return `<div class="hero"><h1>🔒 Sábado cerrado</h1><p>Cerró ${esc(c.closed_by)}</p></div><div class="stats"><div class="stat"><small>Esperado efectivo</small><strong>${money(c.expected_cash)}</strong></div><div class="stat"><small>Contado</small><strong>${money(c.counted_cash)}</strong></div><div class="stat"><small>Diferencia</small><strong class="${Number(c.difference)===0?'positive':'negative'}">${money(c.difference)}</strong></div><div class="stat"><small>Para ministerio*</small><strong class="positive">${money(c.profit_estimate)}</strong></div></div><div class="card muted">* Resultado estimado: ventas − costo cargado de productos − gastos registrados.</div>`}
function bindCash(){bindBillCounter();const a=$('#add-exp');if(a)a.onclick=async()=>{const desc=$('#ex-desc').value.trim(),amount=Number($('#ex-amount').value||0);if(!desc||amount<=0){toast('Completá concepto y monto');return}setBusy(a,true);const {error}=await db.from('tnt_expenses').insert({shift_id:state.shift.id,description:desc,amount,category:$('#ex-cat').value,method:$('#ex-method').value,created_by:state.name});if(error){toast(errMsg(error));setBusy(a,false);return}await loadExpenses();toast('Gasto registrado');renderCash()};document.querySelectorAll('.debtpay').forEach(b=>b.onclick=async()=>{setBusy(b,true);const {error}=await db.rpc('tnt_pay_debt',{p_debt_id:b.dataset.id,p_shift_id:state.shift.id,p_method:b.dataset.method,p_staff:state.name});if(error){toast(errMsg(error));setBusy(b,false);return}await loadDebts();toast('Fiado cobrado');renderCash()});document.querySelectorAll('.sale-edit').forEach(b=>b.onclick=()=>{const sale=state.sales.find(x=>x.id===b.dataset.id);if(sale)editSaleModal(sale)});document.querySelectorAll('.sale-delete').forEach(b=>b.onclick=()=>{const sale=state.sales.find(x=>x.id===b.dataset.id);if(sale)deleteSaleModal(sale)});const c=$('#close-shift');if(c)c.onclick=async()=>{if(!confirm('¿Cerrar la jornada? Después no se podrán registrar más ventas.'))return;setBusy(c,true);const {data,error}=await db.rpc('tnt_close_shift',{p_shift_id:state.shift.id,p_counted_cash:Number($('#counted').value||0),p_staff:state.name,p_notes:$('#close-notes').value.trim()});if(error){toast(errMsg(error));setBusy(c,false);return}state.closure=data;await loadShift();toast('🔒 Jornada cerrada');renderCash()}}

(async function init(){await TNT.ready;if(!TNT.identity||TNT.blocked)return;state.name=TNT.displayName();localStorage.setItem('tnt_name',state.name);try{await connectApp();await boot()}catch(e){loginView(errMsg(e))}})();

</script>
</body>
</html>

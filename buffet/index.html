<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b0d12"><title>TNT Buffet</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0d12;color:#f7f8fb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.boot{min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(430px,100%);text-align:center;background:#141821;border:1px solid rgba(255,255,255,.09);border-radius:26px;padding:30px 22px}.logo{font-size:48px}.box h1{margin:10px 0 5px}.box p{margin:0;color:#969dad}.spin{width:28px;height:28px;margin:22px auto;border:3px solid rgba(255,255,255,.12);border-top-color:#ffca28;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}#err{display:none;color:#ff9aa1;margin-top:15px;white-space:pre-wrap}</style><link rel="stylesheet" href="/assets/tnt-ui.css?v=10"></head><body><div class="boot"><div class="box"><div class="logo">💣</div><h1>TNT Buffet</h1><p>Abriendo la app…</p><div class="spin"></div><div id="err"></div></div></div><script>(async()=>{const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),8000);try{if(!('DecompressionStream'in window))throw Error('Actualizá Chrome para abrir TNT Buffet.');const rs=await Promise.all(['https://tnt-buffet-final.vercel.app/build-1.bin?v=7','https://tnt-buffet-final.vercel.app/build-2.bin?v=7'].map(u=>fetch(u,{cache:'no-store',signal:ctrl.signal})));if(rs.some(r=>!r.ok))throw Error('No se pudo descargar la app.');const bs=await Promise.all(rs.map(r=>r.arrayBuffer()));clearTimeout(tm);const total=bs.reduce((n,b)=>n+b.byteLength,0),all=new Uint8Array(total);let off=0;for(const b of bs){all.set(new Uint8Array(b),off);off+=b.byteLength}const stream=new Blob([all]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();if(!html.includes('TNT Buffet'))throw Error('La versión descargada no es válida.');document.open();document.write(html);document.close()}catch(e){clearTimeout(tm);const x=document.getElementById('err');x.style.display='block';x.textContent=(e?.name==='AbortError'?'La conexión tardó demasiado. Cerrá y volvé a abrir.':String(e?.message||e))}})();</script><script src="/supabase-lite.js?v=3"></script><script src="/assets/tnt-core.js?v=10" data-module="buffet" data-label="Buffet"></script></body></html>

function ageLabel(p,at){const a=ageAt(p,at);return a==null?'Edad sin dato':a<18?`${a} · Adolescente`:`${a} · Joven`}
function groupMatch(p,g,at){const a=ageAt(p,at||new Date());if(!g)return true;if(g==='M')return p.gender==='M';if(g==='F')return p.gender==='F';if(g==='teen')return a!=null&&a<18;if(g==='young')return a!=null&&a>=18;if(g==='teenM')return p.gender==='M'&&a!=null&&a<18;if(g==='teenF')return p.gender==='F'&&a!=null&&a<18;if(g==='youngM')return p.gender==='M'&&a!=null&&a>=18;if(g==='youngF')return p.gender==='F'&&a!=null&&a>=18;if(g==='noGender')return!p.gender;return true}
function statsForSaturday(sat){const at=sat?.date||new Date(),all=db.people.map(p=>({p,status:sat?.attendance?.[p.id]})),present=all.filter(x=>x.status==='present').map(x=>x.p),absent=all.filter(x=>x.status==='absent').map(x=>x.p),unmarked=all.filter(x=>!x.status).map(x=>x.p),c=(a,g)=>a.filter(p=>groupMatch(p,g,at)).length;return{present,absent,unmarked,male:c(present,'M'),female:c(present,'F'),teen:c(present,'teen'),young:c(present,'young'),teenM:c(present,'teenM'),teenF:c(present,'teenF'),youngM:c(present,'youngM'),youngF:c(present,'youngF')}}
function currentSaturday(month){const sats=[...(month?.saturdays||[])].sort((a,b)=>(a.date||'').localeCompare(b.date||''));if(!sats.length)return null;const today=new Date().toISOString().slice(0,10);if(month.key===monthKey(new Date())){const past=sats.filter(s=>s.date<=today).reverse();return past.find(s=>countMarked(s.attendance)>0)||past[0]||sats.find(s=>s.date>=today)||sats[0]}if(month.key<monthKey(new Date()))return[...sats].reverse().find(s=>countMarked(s.attendance)>0)||sats.at(-1);return sats[0]}
function nextSaturday(month,current){const arr=month?.saturdays||[];return arr.find(s=>s.date>(current?.date||''))||null}
function findSaturday(id){for(const m of Object.values(db.months)){const s=m.saturdays.find(x=>x.id===id);if(s)return s}return null}
function centralIdentity(){try{return JSON.parse(localStorage.getItem('tnt-central-user')||'null')}catch{return null}}
function getActiveUser(){const c=centralIdentity();return c?.display_name||c?.nickname||c?.full_name||''}
function setActiveUser(){return}
function ensureActiveUser(){if(getActiveUser())return;location.replace('/?open=sabados')}
function greeting(){const h=new Date().getHours();return h<12?'Buen día':h<20?'Buenas tardes':'Buenas noches'}
function historySummary(sat){const h=sat?.history||[];if(!h.length)return countMarked(sat?.attendance)>0?'Lista registrada':'Sin actividad';const first=h.find(x=>x.action==='passed')||h[0];const corr=h.filter(x=>x.action==='corrected');let t=first?`${first.user} pasó lista`:'';if(corr.length){const users=[...new Set(corr.map(x=>x.user))];const changes=corr.reduce((n,x)=>n+(x.changes||0),0);t+=` · ${users.join(', ')} corrigió${users.length>1?'n':''}${changes?` ${changes}`:''}`}return t}
function recordAudit(sat,user,prev,next){const changes=diffAttendance(prev,next);if(!changes||!user)return;const action=countMarked(prev)===0?'passed':'corrected';sat.history||=[];sat.history.push({id:uid(),user,action,at:new Date().toISOString(),changes});if(action==='passed'&&!sat.passedBy)sat.passedBy=user;sat.lastEditedBy=user;sat.lastEditedAt=new Date().toISOString()}
function render(){ensureMonth(state.monthKey);const app=document.querySelector('#app');if(state.view==='deck')return renderDeck(app);if(state.view==='people'){app.innerHTML=layout(renderPeople());bindCommon();bindPeople()}else if(state.view==='trash'){app.innerHTML=layout(renderTrash());bindCommon();bindTrash()}else{app.innerHTML=layout(renderHome());bindCommon();bindHome()}if(state.modal)renderModal()}
function layout(content){return `<main class="shell">${content}</main>${bottomNav()}`}
function topHeader(){const u=getActiveUser();return `<div class="top"><div class="hello"><small>${greeting()}</small><h1>${escapeHtml(u||'Lista Sábados')} ${u?'👋':''}</h1></div><div class="topactions"><button class="round" data-action="notifications">🔔${birthdayPushEnabled()?'<i class="dot"></i>':''}</button><button class="avatarbtn" data-action="change-user"><i>${escapeHtml((u||'?')[0])}</i>${escapeHtml(u||'¿Quién soy?')}</button></div></div>`}
function bottomNav(){return `<nav class="bottomnav"><button class="navbtn ${state.view==='home'?'active':''}" data-nav="home"><b>⌂</b>Inicio</button><button class="navbtn ${state.view==='people'?'active':''}" data-nav="people"><b>◉</b>Chicos</button><button class="navbtn action" data-action="quick-list"><b>✓</b>Pasar lista</button><button class="navbtn ${state.view==='trash'?'active':''}" data-nav="trash"><b>♲</b>Papelera</button></nav>`}
function renderHome(){const month=db.months[state.monthKey],sat=currentSaturday(month),s=statsForSaturday(sat),total=db.people.length,done=s.present.length+s.absent.length,pct=total?Math.round(done/total*100):0,next=nextSaturday(month,sat),sd=shortDate(next?.date);return `${topHeader()}<div class="monthstrip"><button data-month="-1">‹</button><div class="monthtitle"><strong>${fmtMonth(state.monthKey)}</strong><small>${month.saturdays.length} sábados</small></div><button data-month="1">›</button></div><section class="hero"><div class="herohead"><div><div class="eyebrow">${escapeHtml(sat?.name||'Sábado')}</div><h2>${sat?fmtDate(sat.date):'Sin fecha'}</h2><p>${sat?escapeHtml(historySummary(sat)):'Creá un sábado para comenzar'}</p></div><div class="progressring" style="--p:${pct}"><div><b>${pct}%</b><span>${done}/${total}</span></div></div></div><div class="herostats"><button class="herostat present" data-att-filter="present" data-sat="${sat?.id||''}"><b>${s.present.length}</b><span>Vinieron</span></button><button class="herostat absent" data-att-filter="absent" data-sat="${sat?.id||''}"><b>${s.absent.length}</b><span>Faltaron</span></button></div><div class="heroaction"><button class="main" data-action="start-list" data-sat="${sat?.id||''}">${done?'Corregir lista':'Pasar lista'}</button><button class="more" data-action="sat-menu" data-sat="${sat?.id||''}">•••</button></div></section><div class="sectionlabel"><h3>Todo a mano</h3><small>Sin llenar el inicio de información</small></div><div class="quickgrid"><button class="quick" data-action="stats"><span class="qicon">▥</span><span><b>Estadísticas</b><small>Edad, sexo y asistencia</small></span></button><button class="quick" data-action="history"><span class="qicon">↻</span><span><b>Historial</b><small>Sábados y correcciones</small></span></button><button class="quick" data-action="notifications"><span class="qicon">♢</span><span><b>Cumpleaños</b><small>${birthdayPushEnabled()?'Avisos activados':'Configurar avisos'}</small></span></button><button class="quick" data-action="sync-settings"><span class="qicon">⇄</span><span><b>Base central</b><small>${syncState.status==='connected'?'Sincronizada':'Ver estado'}</small></span></button></div>${next?`<div class="sectionlabel"><h3>Próximo sábado</h3></div><div class="nextsat"><div class="date"><div><b>${sd.day}</b><small>${sd.mon}</small></div></div><div class="meta"><b>${escapeHtml(next.name)}</b><small>${fmtDate(next.date)}</small></div><button class="arrow" data-action="sat-menu" data-sat="${next.id}">›</button></div>`:''}`}
const groups=[['','Todos'],['M','Varones'],['F','Mujeres'],['teen','Adolescentes −18'],['young','Jóvenes +18'],['teenF','Ados mujeres'],['teenM','Ados varones'],['youngF','Jóvenes mujeres'],['youngM','Jóvenes varones'],['noGender','Sexo pendiente']];
function filteredPeople(){const f=state.filter||{},sat=f.satId?findSaturday(f.satId):null,at=sat?.date||new Date();return[...db.people].filter(p=>{if(sat&&f.status){const st=sat.attendance?.[p.id];if(f.status==='unmarked'?!!st:st!==f.status)return false}return groupMatch(p,f.group,at)}).sort((a,b)=>a.name.localeCompare(b.name,'es'))}
function filterTitle(){const f=state.filter||{};let t=f.status==='present'?'Vinieron':f.status==='absent'?'Faltaron':f.status==='unmarked'?'Sin marcar':'Chicos';if(f.group)t+=` · ${groups.find(x=>x[0]===f.group)?.[1]||''}`;return t}
function renderPeople(){const list=filteredPeople(),scoped=!!state.filter?.satId;return `${topHeader()}<div class="pagehead"><div><h2>${filterTitle()}</h2><p>${list.length} fichas</p></div><div class="pageactions"><button class="smallbtn" data-action="import-db">⇧ Importar</button><button class="smallbtn" data-action="toggle-edit">${state.editMode?'Listo':'Editar'}</button></div></div>${scoped&&['present','absent'].includes(state.filter.status)?`<div class="copybar"><span>Copiar nombre + teléfono para WhatsApp</span><button data-action="copy-contacts">Copiar</button></div>`:''}${scoped?`<button class="smallbtn" data-action="clear-att-filter" style="margin-bottom:10px">← Quitar filtro de asistencia</button>`:''}<div class="filters">${groups.map(([v,l])=>`<button class="chip ${(state.filter?.group||'')===v?'active':''}" data-person-group="${v}">${l}</button>`).join('')}</div><input id="import-file" type="file" accept=".xlsx,.xls,.csv,.zip" multiple hidden><div class="peoplelist">${list.map(personCard).join('')||empty('No hay chicos con este filtro')}</div>`}
function personCard(p){return `<article class="card person"><div class="pavatar">${initials(p.name)}</div><div><h4>${escapeHtml(p.name)}</h4><p>${genderLabel(p.gender)} · ${ageLabel(p)}${p.birthday?` · ${formatBirthday(p.birthday)}`:''}</p></div><div class="actions">${state.editMode?`<button class="iconmini edit" data-edit="${p.id}">✎</button>`:''}<button class="iconmini" data-wa="${p.id}">◔</button></div></article>`}
function renderTrash(){return `${topHeader()}<div class="pagehead"><div><h2>Papelera</h2><p>${db.trash.length} fichas</p></div>${db.trash.length?'<button class="danger" data-action="empty-trash">Vaciar</button>':''}</div><div class="trashlist">${db.trash.map(x=>`<div class="card trashrow"><div><b>${escapeHtml(x.person.name)}</b><small>${new Intl.DateTimeFormat('es-AR',{dateStyle:'medium'}).format(new Date(x.deletedAt))}</small></div><button class="smallbtn" data-restore="${x.person.id}">Restaurar</button></div>`).join('')||empty('La papelera está vacía')}</div>`}

function bindHome(){document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{state.monthKey=monthKey(addMonths(parseMonth(state.monthKey),Number(b.dataset.month)));ensureMonth(state.monthKey);render()});document.querySelectorAll('[data-att-filter]').forEach(b=>b.onclick=()=>openFilteredPeople(b.dataset.sat,b.dataset.attFilter,null));document.querySelectorAll('[data-action="start-list"]').forEach(b=>b.onclick=()=>b.dataset.sat&&startDeck(b.dataset.sat));document.querySelectorAll('[data-action="sat-menu"]').forEach(b=>b.onclick=()=>{state.modal={type:'sat-actions',satId:b.dataset.sat};renderModal()});document.querySelector('[data-action="stats"]')?.addEventListener('click',()=>{state.modal={type:'stats',satId:currentSaturday(db.months[state.monthKey])?.id};renderModal()});document.querySelector('[data-action="history"]')?.addEventListener('click',()=>{state.modal={type:'history'};renderModal()})}

function renderModal(){document.querySelector('#modal')?.remove();if(!state.modal)return;let html='';if(state.modal.type==='user-picker'){const cur=getActiveUser();html=`<div class="modalwrap" id="modal"><section class="sheet"><div class="handle"></div><div class="sheethead"><div><h3>¿Quién sos?</h3><p>Esto queda guardado en este dispositivo.</p></div>${state.modal.required?'':'<button class="close" data-close>×</button>'}</div><div class="usergrid">${USERS.map(u=>`<button class="userchoice ${u===cur?'active':''}" data-user="${u}">${u}</button>`).join('')}</div></section></div>`}if(state.modal.type==='stats'){const sat=findSaturday(state.modal.satId),s=statsForSaturday(sat);const metric=(l,v,g)=>`<button class="card metric" data-stat-group="${g}"><b>${v}</b><small>${l}</small></button>`;html=`<div class="modalwrap" id="modal"><section class="sheet"><div class="handle"></div><div class="sheethead"><div><h3>Estadísticas</h3><p>${fmtDate(sat?.date)}</p></div><button class="close" data-close>×</button></div><div class="modalgrid">${metric('Varones',s.male,'M')}${metric('Mujeres',s.female,'F')}${metric('Adolescentes −18',s.teen,'teen')}${metric('Jóvenes +18',s.young,'young')}${metric('Ados mujeres',s.teenF,'teenF')}${metric('Ados varones',s.teenM,'teenM')}${metric('Jóvenes mujeres',s.youngF,'youngF')}${metric('Jóvenes varones',s.youngM,'youngM')}</div></section></div>`}if(state.modal.type==='history'){const month=db.months[state.monthKey];html=`<div class="modalwrap" id="modal"><section class="sheet"><div class="handle"></div><div class="sheethead"><div><h3>Historial de ${fmtMonth(state.monthKey)}</h3><p>Una sola tarjeta por sábado.</p></div><button class="close" data-close>×</button></div><div class="historylist">${month.saturdays.map(historyCard).join('')}</div><button class="primary" data-new-sat style="width:100%;margin-top:10px">＋ Agregar sábado</button></section></div>`}if(state.modal.type==='notifications'){const active=birthdayPushEnabled();html=`<div class="modalwrap" id="modal"><section class="sheet"><div class="handle"></div><div class="sheethead"><div><h3>Cumpleaños</h3><p>Notificaciones a las 9:00.</p></div><button class="close" data-close>×</button></div><div class="card noticebox"><h4>${active?'🔔 Avisos activados':'🎂 Avisos desactivados'}</h4><p>${active?'Este celular recibe avisos el día de cada cumpleaños.':'Activá los avisos para recibirlos aunque la app esté cerrada.'}</p></div><button class="${active?'danger':'primary'}" data-toggle-push style="width:100%">${active?'Desactivar':'Activar notificaciones'}</button></section></div>`}if(state.modal.type==='sat-actions'){const sat=findSaturday(state.modal.satId),s=statsForSaturday(sat);html=`<div class="modalwrap" id="modal"><section class="sheet"><div class="handle"></div><div class="sheethead"><div><h3>${escapeHtml(sat?.name||'Sábado')}</h3><p>${fmtDate(sat?.date)} · ${escapeHtml(historySummary(sat))}</p></div><button class="close" data-close>×</button></div><div class="modalgrid"><button class="card metric" data-filter="present"><b>${s.present.length}</b><small>Vinieron</small></button><button class="card metric" data-filter="absent"><b>${s.absent.length}</b><small>Faltaron</small></button></div><div class="stack" style="margin-top:10px"><button class="primary" data-list>${countMarked(sat.attendance)?'Corregir lista':'Pasar lista'}</button><button class="smallbtn" data-manual>Editar asistencia manualmente</button><button class="smallbtn" data-edit-sat>Editar nombre / fecha</button></div>${sat.history?.length?`<div class="sectionlabel"><h3>Actividad</h3></div><div class="audit">${sat.history.map((h,i)=>`<span class="${h.action==='passed'?'first':''}">${escapeHtml(h.user)} · ${h.action==='passed'?'pasó lista':`corrigió ${h.changes||''}`}</span>`).join('')}</div>`:''}</section></div>`}if(state.modal.type==='person'){const p=db.people.find(x=>x.id===state.modal.personId)||{name:'',birthday:'',phone:'',gender:''};html=`<div class="modalwrap" id="modal"><section class="sheet"><div class="handle"></div><div class="sheethead"><div><h3>${state.modal.personId?'Editar ficha':'Nueva ficha'}</h3><p>Datos del chico/a</p></div><button class="close" data-close>×</button></div><form class="form" id="person-form"><div class="field"><label>Nombre y apellido</label><input name="name" value="${escapeAttr(p.name)}" required></div><div class="formrow"><div class="field"><label>Cumpleaños</label><input type="date" name="birthday" value="${p.birthday||''}"></div><div class="field"><label>Sexo</label><select name="gender"><option value="">Sin dato</option><option value="F" ${p.gender==='F'?'selected':''}>Mujer</option><option value="M" ${p.gender==='M'?'selected':''}>Varón</option></select></div></div><div class="field"><label>Teléfono</label><input name="phone" value="${escapeAttr(p.phone||'')}"></div><div class="formactions"><button type="button" class="smallbtn" data-close>Cancelar</button><button class="primary">Guardar</button></div>${state.modal.personId?'<button type="button" class="danger" data-delete-person style="width:100%;margin-top:7px">Eliminar ficha</button>':''}</form></section></div>`}if(state.modal.type==='saturday'){const sat=findSaturday(state.modal.satId)||{name:'',date:''};html=`<div class="modalwrap" id="modal"><section class="sheet"><div class="handle"></div><div class="sheethead"><div><h3>${state.modal.satId?'Editar sábado':'Nuevo sábado'}</h3></div><button class="close" data-close>×</button></div><form class="form" id="sat-form"><div class="field"><label>Nombre</label><input name="name" value="${escapeAttr(sat.name||'')}"></div><div class="field"><label>Fecha</label><input name="date" type="date" value="${sat.date||''}"></div><div class="formactions"><button type="button" class="smallbtn" data-close>Cancelar</button><button class="primary">Guardar</button></div></form></section></div>`}if(state.modal.type==='attendance'){const sat=findSaturday(state.modal.satId);html=`<div class="modalwrap" id="modal"><section class="sheet"><div class="handle"></div><div class="sheethead"><div><h3>Editar asistencia</h3><p>${fmtDate(sat?.date)}</p></div><button class="close" data-close>×</button></div><form id="attendance-form"><div class="attendance-tools"><input id="att-search" placeholder="Buscar..."><button type="button" class="smallbtn" data-all="1">Todos</button><button type="button" class="smallbtn" data-all="0">Ninguno</button></div><div class="attendance-list">${[...db.people].sort((a,b)=>a.name.localeCompare(b.name,'es')).map(p=>{const yes=sat.attendance?.[p.id]==='present';return`<label class="attrow" data-name="${escapeAttr(normalizeText(p.name))}"><input type="checkbox" name="present" value="${p.id}" ${yes?'checked':''}><span><b>${escapeHtml(p.name)}</b><small>${genderLabel(p.gender)} · ${ageLabel(p,sat.date)}</small></span><span class="statebadge ${yes?'yes':''}">${yes?'Vino':'No vino'}</span></label>`}).join('')}</div><div class="sticky"><button type="button" class="smallbtn" data-close>Cancelar</button><button class="primary">Guardar</button></div></form></section></div>`}if(state.modal.type==='sync'){const has=!!getSyncKey(),good=syncState.status==='connected',bad=['error','auth_error'].includes(syncState.status);html=`<div class="modalwrap" id="modal"><section class="sheet"><div class="handle"></div><div class="sheethead"><div><h3>Base central</h3><p>Datos compartidos entre dispositivos</p></div><button class="close" data-close>×</button></div><div class="syncstatus ${good?'good':bad?'bad':''}">${escapeHtml(syncState.message||syncState.status)}</div>${has?`<div class="stack"><button class="primary" data-sync-now>Sincronizar ahora</button><button class="smallbtn" data-sync-change>Cambiar clave</button><button class="danger" data-sync-disconnect>Desconectar</button></div>`:`<form class="form" id="sync-form"><div class="field"><label>Código de la base</label><input name="key" placeholder="LS-XXXX-XXXX-XXXX" required></div><button class="primary">Conectar</button></form>`}</section></div>`}if(state.modal.type==='import'){const p=state.importPayload;html=`<div class="modalwrap" id="modal"><section class="sheet"><div class="handle"></div><div class="sheethead"><div><h3>Importar base</h3><p>${p.files.length} archivo(s)</p></div><button class="close" data-close>×</button></div><div class="modalgrid"><div class="card metric"><b>${p.records.length}</b><small>fichas detectadas</small></div><div class="card metric"><b>${p.duplicates}</b><small>posibles existentes</small></div></div><div class="stack" style="margin-top:10px"><button class="primary" data-import="merge">Combinar / actualizar</button><button class="danger" data-import="replace">Reemplazar fichas</button></div></section></div>`}document.body.insertAdjacentHTML('beforeend',html);bindModal()}
function historyCard(sat){const d=shortDate(sat.date),s=statsForSaturday(sat),done=s.present.length+s.absent.length;return `<div class="card historyrow"><div class="hdate"><div><b>${d.day}</b><small>${d.mon}</small></div></div><div><h4>${escapeHtml(sat.name)}</h4><p>${s.present.length} vinieron · ${s.absent.length} faltaron · ${done}/${db.people.length}</p><div class="audit">${sat.history?.length?sat.history.map((h,i)=>`<span class="${h.action==='passed'?'first':''}">${escapeHtml(h.user)} ${h.action==='passed'?'pasó lista':`corrigió ${h.changes||''}`}</span>`).join(''):'<span>Sin actividad</span>'}</div></div><button data-open-sat="${sat.id}">›</button></div>`}
function bindModal(){document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);document.querySelector('#modal')?.addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>setActiveUser(b.dataset.user));document.querySelectorAll('[data-stat-group]').forEach(b=>b.onclick=()=>openFilteredPeople(state.modal.satId,'present',b.dataset.statGroup));document.querySelectorAll('[data-open-sat]').forEach(b=>b.onclick=()=>{state.modal={type:'sat-actions',satId:b.dataset.openSat};renderModal()});document.querySelector('[data-new-sat]')?.addEventListener('click',()=>{state.modal={type:'saturday',satId:null};renderModal()});document.querySelector('[data-toggle-push]')?.addEventListener('click',()=>birthdayPushEnabled()?disableBirthdayPush():enableBirthdayPush());document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>openFilteredPeople(state.modal.satId,b.dataset.filter,null));document.querySelector('[data-list]')?.addEventListener('click',()=>startDeck(state.modal.satId));document.querySelector('[data-manual]')?.addEventListener('click',()=>{state.modal={type:'attendance',satId:state.modal.satId};renderModal()});document.querySelector('[data-edit-sat]')?.addEventListener('click',()=>{state.modal={type:'saturday',satId:state.modal.satId};renderModal()});const pf=document.querySelector('#person-form');if(pf)pf.onsubmit=e=>{e.preventDefault();const fd=new FormData(pf),data={name:String(fd.get('name')||'').trim(),birthday:fd.get('birthday')||'',phone:String(fd.get('phone')||'').trim(),gender:fd.get('gender')||''};if(state.modal.personId)Object.assign(db.people.find(p=>p.id===state.modal.personId),data);else db.people.push({id:uid(),...data});save();closeModal();render()};document.querySelector('[data-delete-person]')?.addEventListener('click',()=>{const id=state.modal.personId;closeModal();deletePerson(id)});const sf=document.querySelector('#sat-form');if(sf)sf.onsubmit=e=>{e.preventDefault();const fd=new FormData(sf),data={name:String(fd.get('name')||'').trim(),date:fd.get('date')||''},m=db.months[state.monthKey];if(state.modal.satId)Object.assign(findSaturday(state.modal.satId),data);else m.saturdays.push({id:uid(),...data,attendance:{},history:[]});m.saturdays=dedupeSaturdays(m.saturdays);save();closeModal();render()};bindAttendanceEditor();const sy=document.querySelector('#sync-form');if(sy)sy.onsubmit=async e=>{e.preventDefault();const key=String(new FormData(sy).get('key')||'').trim().toUpperCase();if(!key)return;localStorage.setItem(SYNC_KEY_STORAGE,key);closeModal();await syncPull(true)};document.querySelector('[data-sync-now]')?.addEventListener('click',async()=>{closeModal();await syncPull(true)});document.querySelector('[data-sync-change]')?.addEventListener('click',()=>{localStorage.removeItem(SYNC_KEY_STORAGE);syncState.ready=false;state.modal={type:'sync'};renderModal()});document.querySelector('[data-sync-disconnect]')?.addEventListener('click',()=>{localStorage.removeItem(SYNC_KEY_STORAGE);localStorage.removeItem(SYNC_META_STORAGE);syncState.ready=false;closeModal();render()});document.querySelectorAll('[data-import]').forEach(b=>b.onclick=()=>applyImport(b.dataset.import))}
function bindAttendanceEditor(){const f=document.querySelector('#attendance-form');if(!f)return;const update=cb=>{const s=cb.closest('.attrow').querySelector('.statebadge');s.textContent=cb.checked?'Vino':'No vino';s.className=`statebadge ${cb.checked?'yes':''}`};f.querySelectorAll('input[name="present"]').forEach(cb=>cb.onchange=()=>update(cb));document.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>{const yes=b.dataset.all==='1';f.querySelectorAll('input[name="present"]').forEach(cb=>{cb.checked=yes;update(cb)})});const q=document.querySelector('#att-search');q.oninput=()=>{const n=normalizeText(q.value);f.querySelectorAll('.attrow').forEach(r=>r.style.display=!n||r.dataset.name.includes(n)?'':'none')};f.onsubmit=e=>{e.preventDefault();const sat=findSaturday(state.modal.satId),prev={...(sat.attendance||{})},checked=new Set([...f.querySelectorAll('input[name="present"]:checked')].map(x=>x.value)),next={};db.people.forEach(p=>next[p.id]=checked.has(p.id)?'present':'absent');sat.attendance=next;recordAudit(sat,getActiveUser(),prev,next);save();closeModal();render();toast('Asistencia guardada')}}
function closeModal(){state.modal=null;document.querySelector('#modal')?.remove()}
function startDeck(satId){const sat=findSaturday(satId);if(!sat)return;if(!getActiveUser()){location.replace('/?open=sabados');return}closeModal();const un=db.people.filter(p=>!sat.attendance[p.id]),mk=db.people.filter(p=>sat.attendance[p.id]);state.deck={satId,queue:[...un,...mk],index:0,history:[],original:{...(sat.attendance||{})},user:getActiveUser()};state.view='deck';render()}
function renderDeck(app){const d=state.deck,sat=findSaturday(d.satId),p=d.queue[d.index],next=d.queue[d.index+1];if(!p){return app.innerHTML=`<div class="deckpage"><div class="decktop"><button data-deck-close>×</button><div class="decktitle"><b>${escapeHtml(sat.name)}</b><small>Lista completa</small></div><div></div></div><div class="deck"><div style="text-align:center"><div style="font-size:58px">✓</div><h2>Lista terminada</h2><button class="primary" data-deck-close style="height:50px">Ver resumen</button></div></div></div>`,document.querySelectorAll('[data-deck-close]').forEach(b=>b.onclick=finishDeck)}const pct=d.queue.length?Math.round(d.index/d.queue.length*100):0;app.innerHTML=`<div class="deckpage"><div class="decktop"><button data-deck-close>×</button><div class="decktitle"><b>${escapeHtml(sat.name)}</b><small>${d.index+1} de ${d.queue.length}</small></div><button data-undo>↶</button></div><div class="deckprogress"><i style="width:${pct}%"></i></div><div class="deck">${next?swCard(next,'next'):''}${swCard(p,'current')}</div><div class="deckbuttons"><button class="no" data-answer="absent">← No vino</button><button class="yes" data-answer="present">Vino →</button></div></div>`;document.querySelector('[data-deck-close]').onclick=finishDeck;document.querySelector('[data-undo]').onclick=undoDeck;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answerDeck(p,b.dataset.answer));bindSwipe(p)}
function swCard(p,c){const sat=findSaturday(state.deck.satId),prev=sat.attendance[p.id];return `<article class="swcard ${c}"><div><div class="bigavatar">${initials(p.name)}</div><h2>${escapeHtml(p.name)}</h2><div class="tags"><span class="tag">${genderLabel(p.gender)}</span><span class="tag">${ageLabel(p,sat.date)}</span>${prev?`<span class="tag">Antes: ${prev==='present'?'vino':'faltó'}</span>`:''}</div></div><div class="swfoot"><span>← faltó</span><b>${escapeHtml(p.phone||'Sin teléfono')}</b><span>vino →</span></div></article>`}
function answerDeck(p,status){const sat=findSaturday(state.deck.satId),prev=sat.attendance[p.id]||null;state.deck.history.push({id:p.id,prev});sat.attendance[p.id]=status;state.deck.index++;save({touch:true});render()}
function undoDeck(){const h=state.deck.history.pop();if(!h)return;const sat=findSaturday(state.deck.satId);if(h.prev)sat.attendance[h.id]=h.prev;else delete sat.attendance[h.id];state.deck.index=Math.max(0,state.deck.index-1);save();render()}
function finishDeck(){const d=state.deck;if(d){const sat=findSaturday(d.satId);recordAudit(sat,d.user,d.original,sat.attendance);save()}state.deck=null;state.view='home';render()}
function bindSwipe(person){const card=document.querySelector('.swcard.current');let sx=0,x=0,drag=false;card.onpointerdown=e=>{drag=true;sx=e.clientX;card.setPointerCapture(e.pointerId)};card.onpointermove=e=>{if(!drag)return;x=e.clientX-sx;card.style.transform=`translate3d(${x}px,0,0) rotate(${x/25}deg)`};const end=()=>{if(!drag)return;drag=false;if(Math.abs(x)>82){answerDeck(person,x>0?'present':'absent')}else card.style.transform=''};card.onpointerup=end;card.onpointercancel=end}
function deletePerson(id){const i=db.people.findIndex(p=>p.id===id);if(i<0)return;const[p]=db.people.splice(i,1);db.trash.unshift({person:p,deletedAt:new Date().toISOString()});save();render();toast(`${p.name} fue a la papelera`)}
function restorePerson(id){const i=db.trash.findIndex(x=>x.person.id===id);if(i<0)return;const[x]=db.trash.splice(i,1);db.people.push(x.person);save();render()}
function normalizeArgentinaPhone(raw){if(!raw)return null;let d=String(raw).replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('54'))d=d.slice(2);if(d.startsWith('9')&&d.length>=11)d=d.slice(1);while(d.startsWith('0'))d=d.slice(1);if(/^15\d{8}$/.test(d))d='11'+d.slice(2);if(d.length===12){for(const pos of[2,3,4])if(d.slice(pos,pos+2)==='15'){const c=d.slice(0,pos)+d.slice(pos+2);if(c.length===10){d=c;break}}}if(d.length!==10)return null;return'549'+d}
function openWhatsApp(p){const n=normalizeArgentinaPhone(p?.phone);if(!n)return toast('Revisá el teléfono de esa ficha');window.open(`https://wa.me/${n}`,'_blank','noopener,noreferrer')}
async function copyFilteredContacts(){const list=filteredPeople(),text=list.map(p=>`${p.name}: ${normalizeArgentinaPhone(p.phone)?'+'+normalizeArgentinaPhone(p.phone):(p.phone||'Sin teléfono')}`).join('\n');try{await navigator.clipboard.writeText(text)}catch{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}toast(`${list.length} contactos copiados`)}
function formatBirthday(x){return new Intl.DateTimeFormat('es-AR').format(new Date(x+'T12:00:00'))}
function normalizeText(v=''){return String(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
const MALE=new Set(['agustin','martin','david','ezequiel','thiago','miguel','humberto','alexis','santiago','dario','samuel','caleb','roger','benjamin','camilo','cristian','leandro','tomas','gabriel','leonel','natanael','bautista','alejo','enzo','angel','kevin','alexander','ian','emmanuel','maximiliano','lucas','esteban','noah','matheo','tobias','joaquin','eber','yair','jose','hugo','german','axel','jonatan','jeremias','juan','mateo','carlos','rodrigo','armando','facundo','hernan','damian','ignacio','alejandro']);
const FEMALE=new Set(['camila','tiziana','isabella','rocio','luciana','selene','hannah','josefina','abigail','daiana','ayelen','uma','kamila','victoria','valentina','pilar','abril','valeria','bianca','antonella','marina','florencia','maria','paula','morena','zoe','delfina','candela','briana','ruth','karen','romina','milagros','sol','melina','maitena','martina','celene','natali','cristina','agustina','emma','gianella','laura','daniela','simone']);
function inferGender(n){const t=normalizeText(n).split(' '),m=t.some(x=>MALE.has(x)),f=t.some(x=>FEMALE.has(x));return m&&!f?'M':f&&!m?'F':''}
function duplicateMatch(r,list=db.people){const p=normalizeArgentinaPhone(r.phone),n=normalizeText(r.name);return list.find(x=>{const q=normalizeArgentinaPhone(x.phone);if(p&&q&&p===q)return true;if(normalizeText(x.name)!==n)return false;return r.birthday&&x.birthday?r.birthday===x.birthday:true})}
async function prepareImport(files){if(!getSyncKey())return toast('Primero conectá este dispositivo a la base central');try{toast('Analizando base…');const fd=new FormData();files.forEach(f=>fd.append('files',f,f.name));const res=await fetch('/api/lista/import-analyze',{method:'POST',body:fd,headers:{'X-Lista-Key':getSyncKey()}}),p=await res.json();if(!res.ok)throw new Error(p.error||'No pude leer la base');const records=(p.records||[]).map(r=>({...r,gender:r.gender||inferGender(r.name)}));state.importPayload={files:p.files||files.map(f=>f.name),records,duplicates:records.filter(r=>duplicateMatch(r)).length};state.modal={type:'import'};renderModal()}catch(e){console.error(e);toast(e.message||'No pude importar')}}
function applyImport(mode){const p=state.importPayload;if(!p)return;if(mode==='replace'&&!confirm('¿Reemplazar las fichas actuales?'))return;if(mode==='replace'){const old=[...db.people],used=new Set(),next=[];for(const r of p.records){const ex=duplicateMatch(r,old.filter(x=>!used.has(x.id)));if(ex){used.add(ex.id);next.push({...ex,...r,id:ex.id})}else next.push({id:uid(),...r})}old.filter(x=>!used.has(x.id)).forEach(person=>db.trash.unshift({person,deletedAt:new Date().toISOString()}));db.people=next}else for(const r of p.records){const ex=duplicateMatch(r);if(ex)Object.assign(ex,Object.fromEntries(Object.entries(r).filter(([,v])=>v)));else db.people.push({id:uid(),...r})}save();state.importPayload=null;closeModal();state.view='people';render();toast('Base importada')}
function birthdayPushSupported(){return'serviceWorker'in navigator&&'PushManager'in window&&'Notification'in window}
function birthdayPushEnabled(){return birthdayPushSupported()&&Notification.permission==='granted'&&localStorage.getItem(BIRTHDAY_PUSH_STORAGE)==='1'}
function b64arr(s){const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...b].map(c=>c.charCodeAt(0)))}
async function ensureBirthdayServiceWorker(){return navigator.serviceWorker.register('/sw.js',{scope:'/',updateViaCache:'none'}),navigator.serviceWorker.ready}
async function enableBirthdayPush(){if(!birthdayPushSupported())return toast('Este navegador no admite notificaciones');if(!getSyncKey())return toast('Primero conectá la base central');try{if(await Notification.requestPermission()!=='granted')return;const reg=await ensureBirthdayServiceWorker();let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64arr(VAPID_PUBLIC_KEY)});const res=await fetch('/api/lista/push-subscribe',{method:'POST',headers:{'Content-Type':'application/json','X-Lista-Key':getSyncKey()},body:JSON.stringify({subscription:sub.toJSON(),user:getActiveUser()})});if(!res.ok)throw new Error();localStorage.setItem(BIRTHDAY_PUSH_STORAGE,'1');closeModal();render();toast('Cumpleaños activados')}catch{toast('No pude activar las notificaciones')}}
async function disableBirthdayPush(){try{const reg=await navigator.serviceWorker.getRegistration('/'),sub=await reg?.pushManager?.getSubscription();if(sub&&getSyncKey())fetch('/api/lista/push-subscribe',{method:'DELETE',headers:{'Content-Type':'application/json','X-Lista-Key':getSyncKey()},body:JSON.stringify({endpoint:sub.endpoint})}).catch(()=>{});await sub?.unsubscribe().catch(()=>{})}finally{localStorage.removeItem(BIRTHDAY_PUSH_STORAGE);closeModal();render()}}
function getSyncKey(){return String(localStorage.getItem(SYNC_KEY_STORAGE)||'').trim()}
function getSyncMeta(){try{return JSON.parse(localStorage.getItem(SYNC_META_STORAGE)||'{}')}catch{return{}}}
function setSyncMeta(x){localStorage.setItem(SYNC_META_STORAGE,JSON.stringify({...getSyncMeta(),...x}))}
function queueRemoteSync(){if(!syncState.ready||!getSyncKey())return;clearTimeout(syncState.timer);syncState.timer=setTimeout(syncPush,250)}
async function apiSync(method,body){if(!navigator.onLine)throw new Error('OFFLINE');const res=await fetch('/api/lista/sync',{method,headers:{'X-Lista-Key':getSyncKey(),'Content-Type':'application/json','Cache-Control':'no-store'},cache:'no-store',body:body?JSON.stringify(body):undefined});let p={};try{p=await res.json()}catch{}if(!res.ok){const e=new Error(p.error||`HTTP ${res.status}`);e.status=res.status;throw e}return p}
async function initRemoteSync(){if(!getSyncKey()){syncState.status='local';syncState.message='Tocá Base central para conectar';return render()}await syncPull(true)}
async function syncPull(redraw=false){if(syncState.pullInFlight)return;syncState.pullInFlight=true;syncState.status='saving';syncState.message='Buscando cambios…';if(redraw)render();try{const remote=await apiSync('GET');syncState.ready=true;if(remote.data){db=mergeDatabases(remote.data,db);ensureShape();normalizeDatabase(db);ensureMonth(monthKey(new Date()));save({remote:false,touch:false});await syncPush()}else await syncPush();syncState.status='connected';syncState.message=`Sincronizada ${new Intl.DateTimeFormat('es-AR',{hour:'2-digit',minute:'2-digit'}).format(new Date())}`}catch(e){syncState.status=e.status===401?'auth_error':'error';syncState.message=e.status===401?'Código de base incorrecto':'Tus cambios siguen guardados acá'}finally{syncState.pullInFlight=false;if(redraw)render()}}
async function syncPush(){if(!syncState.ready||syncState.pushing||!getSyncKey())return;syncState.pushing=true;try{normalizeDatabase(db);await apiSync('PUT',{data:db});setSyncMeta({lastSyncedUpdatedAt:db.meta?.updatedAt||''});syncState.status='connected';syncState.message='Base central sincronizada'}catch{syncState.status='error';syncState.message='Pendiente de sincronizar'}finally{syncState.pushing=false}}
function mergeDatabases(remote,local){const r=structuredClone(remote||{people:[],months:{},trash:[]}),l=structuredClone(local||{people:[],months:{},trash:[]});r.people||=[];l.people||=[];r.trash||=[];l.trash||=[];r.months||={};l.months||={};const trash=new Map();[...r.trash,...l.trash].forEach(x=>{if(x?.person?.id)trash.set(x.person.id,x)});const people=new Map();[...r.people,...l.people].forEach(p=>{if(p?.id)people.set(p.id,{...(people.get(p.id)||{}),...p})});for(const id of trash.keys())people.delete(id);const months={};for(const k of new Set([...Object.keys(r.months),...Object.keys(l.months)])){const rm=r.months[k]||{key:k,saturdays:[]},lm=l.months[k]||{key:k,saturdays:[]};months[k]={...rm,...lm,key:k,saturdays:dedupeSaturdays([...(rm.saturdays||[]),...(lm.saturdays||[])])}}return{...r,...l,people:[...people.values()],trash:[...trash.values()],months,meta:{...(r.meta||{}),...(l.meta||{})}}}
function toast(msg){const r=document.querySelector('#toast-root');r.innerHTML=`<div class="toast">${escapeHtml(msg)}</div>`;setTimeout(()=>r.innerHTML='',3200)}
function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escapeAttr(s=''){return escapeHtml(s)}

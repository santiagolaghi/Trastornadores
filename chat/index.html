<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TNT · Chat</title><link rel="stylesheet" href="/assets/tnt-ui.css?v=10"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--tnt-bg);color:var(--tnt-text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}.chatApp{height:calc(100dvh - var(--tnt-shell-h));display:grid;grid-template-columns:320px 1fr}.threads{border-right:1px solid var(--tnt-line);background:var(--tnt-panel);overflow:auto}.threadsHead{padding:16px;position:sticky;top:0;background:var(--tnt-panel);z-index:2;border-bottom:1px solid var(--tnt-line)}.threadsHead h1{font-size:26px;letter-spacing:-.04em;margin:4px 0}.threadsHead p{font-size:9px;color:var(--tnt-muted)}.thread{width:100%;border:0;border-bottom:1px solid var(--tnt-line);background:transparent;color:var(--tnt-text);padding:13px 14px;display:grid;grid-template-columns:38px 1fr auto;gap:9px;text-align:left;align-items:center}.thread.on{background:var(--tnt-panel2)}.thread .ico{width:38px;height:38px;border-radius:13px;background:#7c6cff22;display:grid;place-items:center}.thread b{font-size:10px}.thread small{display:block;color:var(--tnt-muted);font-size:8px;margin-top:3px}.thread em{font-style:normal;font-size:8px;color:var(--tnt-accent)}.room{display:grid;grid-template-rows:auto 1fr auto;min-width:0}.roomHead{padding:13px 16px;border-bottom:1px solid var(--tnt-line);background:var(--tnt-bg);display:flex;align-items:center;gap:10px}.roomHead button{display:none;width:38px;height:38px;border:1px solid var(--tnt-line);border-radius:11px;background:var(--tnt-panel);color:var(--tnt-text)}.roomHead h2{font-size:14px;margin:0}.roomHead small{display:block;color:var(--tnt-muted);font-size:8px;margin-top:2px}.msgs{overflow:auto;padding:18px;display:flex;flex-direction:column;gap:8px}.msg{max-width:min(78%,580px);background:var(--tnt-panel);border:1px solid var(--tnt-line);border-radius:18px 18px 18px 6px;padding:9px 11px;align-self:flex-start}.msg.mine{align-self:flex-end;background:color-mix(in srgb,var(--tnt-accent) 20%,var(--tnt-panel));border-color:color-mix(in srgb,var(--tnt-accent) 35%,var(--tnt-line));border-radius:18px 18px 6px 18px}.msg .name{font-size:8px;font-weight:900;color:var(--tnt-accent)}.msg .body{font-size:11px;line-height:1.45;margin-top:3px;white-space:pre-wrap}.msg .time{font-size:7px;color:var(--tnt-muted);text-align:right;margin-top:5px}.reacts{display:flex;gap:4px;margin-top:5px}.reacts button{border:1px solid var(--tnt-line);background:var(--tnt-panel2);border-radius:999px;color:var(--tnt-text);font-size:10px}.composer{padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--tnt-line);display:grid;grid-template-columns:1fr 48px;gap:8px;background:var(--tnt-bg)}.composer input{height:48px;border:1px solid var(--tnt-line);border-radius:15px;background:var(--tnt-panel);color:var(--tnt-text);padding:0 13px;outline:0}.composer button{border:0;border-radius:14px;background:var(--tnt-accent);color:#fff;font-weight:900}.empty{display:grid;place-items:center;color:var(--tnt-muted);font-size:11px;padding:24px}.newThread{width:100%;height:40px;border:1px dashed var(--tnt-line);background:transparent;color:var(--tnt-muted);border-radius:12px;font-size:9px;font-weight:900;margin-top:8px}@media(max-width:720px){.chatApp{grid-template-columns:1fr}.threads{display:block}.room{display:none}.chatApp.roomOpen .threads{display:none}.chatApp.roomOpen .room{display:grid}.roomHead button{display:block}.msg{max-width:88%}}
</style></head><body data-tnt-label="Chat TNT"><div class="chatApp" id="chatApp"><aside class="threads"><div class="threadsHead"><div class="tnt-pill">CHAT INTERNO</div><h1>Conversaciones</h1><p>General, eventos, tareas y equipos. Todo queda dentro de TNT.</p><button class="newThread" id="newThread">＋ Nueva conversación</button></div><div id="threadList"></div></aside><section class="room"><header class="roomHead"><button id="back">←</button><div><h2 id="roomTitle">Chat TNT</h2><small id="roomSub">Elegí una conversación</small></div></header><div class="msgs" id="msgs"><div class="empty">Elegí una conversación.</div></div><form class="composer" id="composer"><input id="text" placeholder="Escribí un mensaje…" autocomplete="off"><button>↑</button></form></section></div><script src="/supabase-lite.js?v=11"></script><script src="/assets/tnt-core.js?v=10" data-label="Chat TNT"></script><script>
const sb=TNT.sb,threadList=document.getElementById('threadList'),msgs=document.getElementById('msgs'),chatApp=document.getElementById('chatApp');let threads=[],messages=[],people=[],accounts=[],active=null,timer=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function person(id){return people.find(x=>x.id===id)||{full_name:'Usuario TNT'}}function acct(id){return accounts.find(x=>x.person_id===id)||{}}
async function load(){await TNT.ready;if(!TNT.identity)return;const [t,p,a]=await Promise.all([sb.from('tnt_chat_threads').select('*').order('is_pinned',{ascending:false}).order('updated_at',{ascending:false}),sb.from('tnt_people').select('*'),sb.from('tnt_accounts').select('*')]);threads=t.data||[];people=p.data||[];accounts=a.data||[];renderThreads();const requested=new URLSearchParams(location.search).get('thread');if(requested&&threads.some(x=>x.id===requested))openThread(requested);else if(!active&&threads[0])openThread(threads[0].id)}
function renderThreads(){threadList.innerHTML=threads.length?threads.map(t=>`<button class="thread ${active===t.id?'on':''}" data-thread="${t.id}"><span class="ico">${t.thread_type==='general'?'◌':t.thread_type==='task'?'✓':t.thread_type==='event'?'◫':'◎'}</span><span><b>${esc(t.title)}</b><small>${esc(t.module||t.thread_type)}${t.scope?' · '+esc(t.scope):''}</small></span>${t.is_pinned?'<em>FIJADO</em>':'<em>›</em>'}</button>`).join(''):'<div class="empty">Todavía no hay chats.</div>';document.querySelectorAll('[data-thread]').forEach(b=>b.onclick=()=>openThread(b.dataset.thread))}
async function openThread(id){active=id;chatApp.classList.add('roomOpen');renderThreads();const t=threads.find(x=>x.id===id);document.getElementById('roomTitle').textContent=t?.title||'Chat';document.getElementById('roomSub').textContent=(t?.module||'TNT')+(t?.scope?' · '+t.scope:'');await loadMessages();clearInterval(timer);timer=setInterval(loadMessages,5000)}
async function loadMessages(){if(!active)return;const r=await sb.from('tnt_chat_messages').select('*').eq('thread_id',active).order('created_at');if(r.error)return;messages=r.data||[];renderMessages();await sb.from('tnt_chat_members').upsert({thread_id:active,person_id:TNT.person.id,last_read_at:new Date().toISOString()},{onConflict:'thread_id,person_id'})}
function renderMessages(){msgs.innerHTML=messages.length?messages.filter(m=>!m.deleted_at).map(m=>{const p=person(m.person_id),mine=m.person_id===TNT.person.id;return `<article class="msg ${mine?'mine':''}"><div class="name">${esc(acct(p.id).nickname||p.full_name)}</div><div class="body">${esc(m.body)}</div><div class="reacts"><button data-react="${m.id}|👍">👍</button><button data-react="${m.id}|❤️">❤️</button><button data-react="${m.id}|👀">👀</button></div><div class="time">${new Date(m.created_at).toLocaleString('es-AR',{hour:'2-digit',minute:'2-digit'})}</div></article>`}).join(''):'<div class="empty">Todavía no hay mensajes. Empezá la conversación.</div>';msgs.scrollTop=msgs.scrollHeight;document.querySelectorAll('[data-react]').forEach(b=>b.onclick=async()=>{const [message_id,reaction]=b.dataset.react.split('|');await sb.from('tnt_chat_reactions').upsert({message_id,person_id:TNT.person.id,reaction},{onConflict:'message_id,person_id,reaction'}).select('*')})}
document.getElementById('composer').onsubmit=async e=>{e.preventDefault();const input=document.getElementById('text'),body=input.value.trim();if(!body||!active)return;input.value='';const r=await sb.from('tnt_chat_messages').insert({thread_id:active,person_id:TNT.person.id,body}).select('*');if(r.error)alert(r.error.message);else{await sb.from('tnt_chat_threads').update({updated_at:new Date().toISOString()}).eq('id',active);await loadMessages()}};document.getElementById('back').onclick=()=>chatApp.classList.remove('roomOpen');document.getElementById('newThread').onclick=()=>{if(!TNT.isAdmin&&!TNT.hasAccess('organizacion','*','manage'))return alert('Necesitás permiso para crear conversaciones.');const s=TNT.sheet('Nueva conversación',`<div class="field"><label>Título</label><input id="ntTitle" style="width:100%;height:44px;border:1px solid var(--tnt-line);background:var(--tnt-panel2);color:var(--tnt-text);border-radius:12px;padding:0 10px"></div><button id="ntCreate" style="width:100%;height:44px;border:0;border-radius:12px;background:var(--tnt-accent);color:white;font-weight:900;margin-top:10px">Crear chat</button>`);document.getElementById('ntCreate').onclick=async()=>{const title=document.getElementById('ntTitle').value.trim();if(!title)return;const r=await sb.from('tnt_chat_threads').insert({title,thread_type:'module',module:'organizacion',scope:'*',created_by:TNT.person.id}).select('*');if(r.error)alert(r.error.message);else{document.querySelector('.tnt-overlay')?.remove();await load();openThread(r.data?.[0]?.id)}}};document.addEventListener('tnt:ready',load,{once:true});setTimeout(()=>TNT.identity&&load(),300);
</script></body></html>

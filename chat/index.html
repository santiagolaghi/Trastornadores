<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta

      content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"
    />

    <link rel="stylesheet" href="/chat/style.css?v=25" />

    <link

      href="/assets/fonts/inter.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/assets/tnt-design.css?v=20261016" />
    <link rel="stylesheet" href="/assets/tnt-next.css?v=20261021r4" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32.png?v=20261013"
    />
    <link

      type="image/svg+xml"
      href="/icons/dynamite-app.svg?v=20261013"
    />

      href="/icons/dynamite-app-192.png?v=20261013"
    />

  <link rel="stylesheet" href="/assets/tnt-life.css?v=20261023d"><link rel="stylesheet" href="/assets/tnt-unified.css?v=20261024b"><link rel="stylesheet" href="/assets/tnt-approved.css?v=20261024b"></head>
  <body data-tnt-module="chat" data-tnt-label="Chat TNT">
    <main class="chat-app" id="chat-app">
      <aside class="chat-sidebar">
        <header class="chat-intro">
          <div class="chat-sidebar-header">
            <button
              type="button"
              id="chat-own-avatar"
              class="chat-own-avatar"
              aria-label="Mi perfil"
            ></button>
            <h1>Chats</h1>
            <div class="chat-sidebar-actions">
              <button
                type="button"
                class="tnt-icon-button"
                id="chat-community"
                aria-label="Ver equipo TNT"
              ></button>
              <button
                type="button"
                class="tnt-icon-button"
                id="new-chat"
                aria-label="Nueva conversación"
              ></button>
            </div>
          </div>
          <label class="chat-search"
            ><span id="search-icon"></span
            ><input
              id="chat-search"
              type="search"
              placeholder="Buscar o empezar un chat nuevo"
              aria-label="Buscar conversación"
          /></label>
          <nav class="chat-filters" aria-label="Filtrar conversaciones">
            <button type="button" data-chat-filter="all" aria-pressed="true">
              Todos
            </button>
            <button
              type="button"
              data-chat-filter="unread"
              aria-pressed="false"
            >
              No leídos
            </button>
            <button
              type="button"
              data-chat-filter="groups"
              aria-pressed="false"
            >
              Grupos
            </button>
          </nav>
        </header>
        <div class="chat-team" id="chat-team" hidden></div>
        <div id="chat-error" role="alert"></div>
        <nav class="chat-threads" id="chat-threads" aria-label="Conversaciones">
          <div class="tnt-empty">Cargando conversaciones…</div>
        </nav>
        <footer class="chat-sidebar-footer">Tus conversaciones de TNT.</footer>
      </aside>
      <section class="chat-room" aria-label="Conversación">
        <header class="chat-room-head" id="chat-room-head"></header>
        <div class="chat-pinned" id="chat-pinned" hidden></div>
        <div
          class="chat-messages"
          id="chat-messages"
          role="log"
          aria-label="Mensajes"
          aria-live="polite"
        >
          <div class="chat-welcome">
            <span class="chat-welcome-art" id="welcome-icon"></span>
            <h2>Tus conversaciones de TNT</h2>
            <p>Elegí un chat para empezar.</p>
          </div>
        </div>
        <div class="chat-compose-wrap" id="chat-compose-wrap" hidden>
          <div
            id="chat-voice-lock"
            class="chat-voice-lock"
            hidden
            aria-live="polite"
          >
            <span aria-hidden="true">🔒</span><small>Deslizá hacia arriba</small
            ><b aria-hidden="true">↑</b>
          </div>
          <div id="chat-draft-context"></div>
          <div id="chat-record-status" class="tnt-actions"></div>
          <div class="chat-compose-tools">
            <button
              class="tnt-button"
              type="button"
              id="chat-format"
              aria-label="Mostrar formato"
            >
              Aa</button
            ><button
              class="tnt-button"
              type="button"
              id="chat-bubble-color"
              aria-label="Color de la burbuja"
            >
              ● Burbuja</button
            ><button class="tnt-button" type="button" id="chat-audience" hidden>
              👥 Destinatarios</button
            ><button class="tnt-button" type="button" id="chat-find">
              Buscar</button
            ><button class="tnt-button" type="button" id="chat-starred">
              ★ Destacados
            </button>
          </div>
          <form class="chat-composer" id="chat-composer">
            <button
              class="tnt-icon-button"
              type="button"
              id="chat-emoji"
              aria-label="Emojis"
            ></button
            ><button
              class="tnt-icon-button"
              type="button"
              id="chat-attach"
              aria-label="Adjuntar archivo"
            ></button
            ><input
              type="file"
              id="chat-photo"
              multiple
              hidden
              accept="image/*,video/*"
            /><input
              type="file"
              id="chat-camera"
              hidden
              accept="image/*"
              capture="environment"
            /><input type="file" id="chat-file" multiple hidden /><textarea
              id="chat-text"
              rows="1"
              maxlength="10000"
              placeholder="Escribí un mensaje aquí"
              aria-label="Mensaje"
            ></textarea
            ><button
              class="tnt-icon-button"
              type="button"
              id="chat-mention"
              aria-label="Mencionar participante"
            >
              @</button
            ><button
              class="tnt-icon-button"
              type="button"
              id="chat-voice"
              aria-label="Grabar audio"
            >
              🎙</button
            ><button
              class="chat-send"
              type="submit"
              id="chat-send"
              aria-label="Enviar mensaje"
            ></button>
          </form>
          <div
            class="chat-composer-status"
            id="chat-composer-status"
            role="status"
          ></div>
        </div>
      </section>
    </main>
    <script src="/supabase-lite.js?v=12"></script>
    <script src="/assets/tnt-components.js?v=20261023e"></script>
    <script src="/assets/tnt-profiles.js?v=20261018r2"></script>
    <script src="/assets/tnt-editor.js?v=21"></script>
    <script src="/assets/tnt-experience.js?v=20261024b"></script>
    <script src="/assets/tnt-notifications.js?v=20261023d"></script>
    <script src="/assets/tnt-push.js?v=20261024c"></script>
    <script
      src="/assets/tnt-core.js?v=20261023d"
      data-module="chat"
      data-label="Chat TNT"
    ></script>
    <script src="/chat/app.js?v=20261018r2"></script>
  </body>
</html>

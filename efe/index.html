/* V10 · asistencia por swipe + resumen + seguimiento */.wedActions{display:flex;gap:5px;align-items:center}
.chartBtn{background:#fff0e8!important;color:#c9451b;font-weight:900}
.swipeHelp{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0 12px}
.swipeHelp span{border-radius:10px;padding:8px 10px;font-size:9px;font-weight:900;text-align:center}
.swipeHelp .goRight{background:#e3f4eb;color:var(--g)}
.swipeHelp .goLeft{background:#fbe9e7;color:var(--r)}
.att{display:grid;gap:7px;overflow:hidden}
.swipeRow{position:relative;border-radius:12px;overflow:hidden;touch-action:pan-y;user-select:none}
.swipeBg{position:absolute;inset:0;display:flex;align-items:center;padding:0 14px;font-size:9px;font-weight:1000;letter-spacing:.08em}
.swipeBgLeft{justify-content:flex-start;background:#dff4e9;color:#14734e}
.swipeBgRight{justify-content:flex-end;background:#f9dfdc;color:#a43b34}
.swipeCard{position:relative;z-index:2;background:#fff;border:1px solid var(--l);border-radius:11px;padding:10px;display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center;transition:transform .16s ease,background .16s ease,border-color .16s ease;will-change:transform}
.swipeRow.present .swipeCard{border-color:#b6dfcc;background:#f7fcf9}
.swipeRow.absent .swipeCard{border-color:#efc4bf;background:#fff9f8}
.swipeCheck{width:28px;height:28px;border:2px solid #cfd3da;border-radius:8px;display:grid;place-items:center;font-weight:1000;color:#fff}
.swipeRow.present .swipeCheck{background:var(--g);border-color:var(--g)}
.swipeRow.absent .swipeCheck{background:var(--r);border-color:var(--r)}
.swipeCard b{font-size:11px}.swipeCard small{display:block;color:var(--m);font-size:8px;margin-top:2px}
.swipeState{font-size:8px;font-weight:1000;padding:5px 7px;border-radius:999px;background:var(--soft);white-space:nowrap}
.swipeRow.present .swipeState{background:#e3f4eb;color:var(--g)}
.swipeRow.absent .swipeState{background:#fbe9e7;color:var(--r)}
.summaryChart{background:linear-gradient(135deg,var(--n),#101832);color:#fff;border-radius:15px;padding:15px;margin:10px 0}
.summaryChartTop{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.sumKpi{border:1px solid #ffffff18;background:#ffffff0c;border-radius:10px;padding:9px}
.sumKpi b{display:block;font-size:22px}.sumKpi small{font-size:8px;color:#adb5c6}
.chartTrack{height:18px;border-radius:999px;background:#ffffff12;overflow:hidden;display:flex;margin-top:12px}
.chartPresent{background:#25a56e;height:100%}.chartAbsent{background:#e15e54;height:100%}.chartPending{background:#7b8498;height:100%}
.chartLegend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;color:#b7becd;font-size:8px}
.chartLegend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.chartLegend .lp i{background:#25a56e}.chartLegend .la i{background:#e15e54}.chartLegend .lu i{background:#7b8498}
.copyBar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 14px}
.copyBar .btn{min-height:40px;padding:0 8px;font-size:9px}
.summarySectionTitle{display:flex;justify-content:space-between;align-items:end;margin:15px 1px 7px}
.summarySectionTitle h4{margin:0;font-size:13px}.summarySectionTitle small{color:var(--m);font-size:8px}
.followRows{display:grid;gap:7px}
.followRow{background:#fff;border:1px solid var(--l);border-radius:12px;padding:10px;display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:9px;align-items:center}
.followRow.absent{border-color:#efc4bf;background:#fff9f8}.followRow.present{border-color:#c5e3d4;background:#fbfefc}.followRow.pending{background:#f7f8fa}
.followRow .miniAva{width:38px;height:38px;border-radius:9px;background:var(--n);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:1000}
.followRow h5{margin:0;font-size:11px}.followRow p{margin:3px 0 0;color:var(--m);font-size:8px;line-height:1.35}
.followActions{display:flex;gap:5px;align-items:center}
.waMini{width:36px;height:36px;border:0;border-radius:9px;background:#e6f4ee;color:#16734f;font-weight:1000}
.followSelect{height:36px;max-width:145px;border:1px solid var(--l);border-radius:9px;background:#fff;color:var(--i);padding:0 7px;font-size:8px;font-weight:900}
.followSelect[data-state="talked"]{background:#fff3d9;border-color:#e7c477}
.followSelect[data-state="waiting"]{background:#fff0df;border-color:#e6af73}
.followSelect[data-state="chatting"]{background:#e9f0ff;border-color:#9fb6e5}
.followSelect[data-state="no_reply"]{background:#fbe9e7;border-color:#e0aaa5}
.followSelect[data-state="closed"]{background:#e3f4eb;border-color:#9ed0b8}
.historyHead{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%}
.historyDanger{border:1px solid #efc4bf;background:#fff;color:var(--r);min-height:38px;border-radius:9px;padding:0 10px;font-size:9px;font-weight:900}
@media(max-width:520px){
 .copyBar{grid-template-columns:1fr 1fr 1fr}
 .followRow{grid-template-columns:36px 1fr}
 .followActions{grid-column:1/-1;justify-content:flex-end}
 .followSelect{flex:1;max-width:none}
}

/* asignación de líder */
.person.unassigned{border-color:#ffb18f;background:#fff7f2;box-shadow:inset 3px 0 0 var(--o)}
.person.unassigned .ava{background:#2a1320;color:#ff8a61}

.leaderChip.assigned{background:#e6f4ee;color:#187653}.leaderChip.missing{background:#ffe4d8;color:#b53f18}

function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function uid(){return(globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():'i'+Date.now()+Math.random().toString(36).slice(2)}
function monthKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function md(k){let[y,m]=k.split('-').map(Number);return new Date(y,m-1,1)}
function shift(k,n){let d=md(k);d.setMonth(d.getMonth()+n);return monthKey(d)}
function monthName(k){return new Intl.DateTimeFormat('es-AR',{month:'long',year:'numeric'}).format(md(k))}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function weds(k){let d=md(k),m=d.getMonth(),a=[];while(d.getMonth()===m){if(d.getDay()===3)a.push(iso(d));d.setDate(d.getDate()+1)}return a}
function ensure(k){db.months||={};let old=db.months[k]?.wednesdays||[],map=new Map(old.map(x=>[x.date,x]));let arr=weds(k).map(date=>{let w=map.get(date)||{id:'w'+date,date,attendance:{},followups:{},takenBy:'',updatedBy:'',updatedAt:''};w.attendance=w.attendance&&typeof w.attendance==='object'?w.attendance:{};w.followups=w.followups&&typeof w.followups==='object'?w.followups:{};return w});return db.months[k]={key:k,wednesdays:arr}}
function age(b){if(!b)return null;let[y,m,d]=b.split('-').map(Number),n=new Date(),a=n.getFullYear()-y;if(n.getMonth()+1<m||(n.getMonth()+1===m&&n.getDate()<d))a--;return a}
function grp(p){let a=age(p.birthday);return a==null?'Sin edad':a>=18?'Joven':'Adolescente'}
function fmt(s){if(!s)return'';let[y,m,d]=s.split('-').map(Number);return new Intl.DateTimeFormat('es-AR').format(new Date(y,m-1,d))}
function cache(){if(g)LS.set('lista_efe_cache_'+g,JSON.stringify(db))}

function groups(){const visible=Object.entries(G).filter(([k])=>!window.TNT||TNT.isAdmin||TNT.hasAccess('efe',k,'view'));root.innerHTML='<main class="gate"><div class="wrap"><div class="brand"><b>✦</b> LISTA EFE</div><h1>Elegí tu<br><span style="color:var(--o)">equipo.</span></h1><p><b>Equipos de Formación Ministerial</b><br>Solo aparecen los EFE habilitados para tu Cuenta TNT.</p><h3>Ingresar a</h3><div class="groups">'+(visible.length?visible.map(([k,x])=>'<button class="group" data-g="'+k+'"><span class="ico">'+x[2]+'</span><span><b>'+esc(x[0])+'</b><small>'+esc(x[1])+'</small></span><em>›</em></button>').join(''):'<div class="emptyLead"><b>No tenés un EFE habilitado</b><p>Solicitá acceso desde tu Cuenta TNT o hablá con un Administrador.</p></div>')+'</div></div></main>';document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>choose(b.dataset.g));refreshGroupNames()}

async function choose(x){if(window.TNT&&!TNT.isAdmin&&!TNT.hasAccess('efe',x,'view'))return alert('Tu Cuenta TNT no tiene acceso a este EFE.');g=x;db=load(g);clearActiveUser();auth.err='';auth.pat=[];try{let r=await fetch('/api/efe/auth?group='+encodeURIComponent(g),{cache:'no-store'}),j=await r.json();if(!r.ok)throw 0;if(j.label)G[g][0]=j.label;auth.init=!!j.initialized;render()}catch{g='';toast('No pude abrir ese EFE');render()}}

function loginScreen(){let x=G[g],setup=!auth.init,body=setup?'<div class="field"><label>Nueva contraseña</label><input id="p1" type="password" placeholder="Mínimo 4 caracteres"></div><div class="field"><label>Repetir contraseña</label><input id="p2" type="password" placeholder="Repetí la contraseña"></div><div class="pat-title"><b>Creá un patrón</b><br>Uní al menos 4 puntos.</div>'+pattern()+'<div class="actions"><button class="btn secondary" id="clearPat">Borrar patrón</button><button class="btn primary" id="setupBtn">Crear acceso</button></div>':'<div class="tabs"><button class="tab '+(auth.method==='password'?'on':'')+'" data-m="password">Contraseña</button><button class="tab '+(auth.method==='pattern'?'on':'')+'" data-m="pattern">Patrón</button></div>'+(auth.method==='password'?'<div class="field"><label>Contraseña</label><input id="lp" type="password"></div><button class="btn primary" id="enterBtn" style="width:100%;margin-top:9px">Entrar</button>':'<div class="pat-title"><b>Dibujá el patrón</b></div>'+pattern()+'<div class="actions"><button class="btn secondary" id="clearPat">Borrar patrón</button><button class="btn primary" id="enterPat">Entrar</button></div>');root.innerHTML='<main class="gate"><div class="wrap"><button class="back" id="backBtn">‹ Volver a los EFE</button><section class="auth"><div class="tag">'+x[2]+' '+esc(x[0])+'</div><h2>'+(setup?'Configurar acceso':'Bienvenido de nuevo')+'</h2><p>'+(setup?'Es la primera vez. Creá la contraseña y patrón del equipo.':'Ingresá con contraseña o patrón.')+'</p>'+(auth.err?'<div class="err">'+esc(auth.err)+'</div>':'')+body+'</section></div></main>';document.getElementById('backBtn').onclick=leave;document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{auth.method=b.dataset.m;auth.pat=[];auth.err='';render()});bindPat();document.getElementById('clearPat')?.addEventListener('click',()=>{auth.pat=[];document.querySelectorAll('.node').forEach(x=>x.classList.remove('on'))});document.getElementById('setupBtn')?.addEventListener('click',setupAccess);document.getElementById('enterBtn')?.addEventListener('click',()=>doLogin('password',document.getElementById('lp').value));document.getElementById('lp')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('enterBtn').click()});document.getElementById('enterPat')?.addEventListener('click',()=>doLogin('pattern',auth.pat.join('-')))}
async function setupAccess(){let a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(a.length<4)return fail('La contraseña debe tener al menos 4 caracteres.');if(a!==b)return fail('Las contraseñas no coinciden.');if(auth.pat.length<4)return fail('El patrón debe unir al menos 4 puntos.');try{let r=await fetch('/api/efe/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'setup',group:g,password:a,pattern:auth.pat.join('-')})}),j=await r.json();if(!r.ok)throw new Error(j.error);tok=j.token;if(j.label)G[g][0]=j.label;auth.init=true;await pull(true);render()}catch(e){fail(e.message==='ALREADY_INITIALIZED'?'Ese EFE ya fue configurado.':'No pude crear el acceso.')}}
